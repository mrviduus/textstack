# Textstack Production Nginx Configuration
# Install: sudo cp this_file /etc/nginx/sites-available/textstack
#          sudo ln -s /etc/nginx/sites-available/textstack /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

# Rate-limit key: the client, not the hop. Public traffic arrives from cloudflared on this host,
# so $remote_addr is loopback for every request. When (and only when) the peer is that loopback
# hop, key on the CF-Connecting-IP header Cloudflare sets at the edge; anything else (direct
# connections, a request without the header) keys on the peer address as before.
#
# Deliberately a map, not `real_ip_header`: real_ip would rewrite $remote_addr, which changes what
# $proxy_add_x_forwarded_for appends and what X-Real-IP carries to the API. The API derives the
# client itself from X-Forwarded-For with a trusted-network walk (backend/src/Api/Program.cs);
# leaving $remote_addr alone keeps that input exactly as it was.
geo $from_tunnel {
    default   0;
    127.0.0.1 1;
    ::1       1;
}
map "$from_tunnel:$http_cf_connecting_ip" $limit_key {
    "~^1:(?<cf_client_ip>.+)$" $cf_client_ip;
    default                    $binary_remote_addr;
}

# Rate limiting for API
limit_req_zone $limit_key zone=api_limit:10m rate=10r/s;
limit_req_zone $limit_key zone=upload_limit:10m rate=1r/s;
limit_req_zone $limit_key zone=translate_limit:10m rate=5r/m;
# Remote MCP transport (AI-049) — same shape as the API zone (10r/s, burst 20).
limit_req_zone $limit_key zone=mcp_limit:10m rate=10r/s;

# Bot detection — serve SSG only to crawlers, SPA to real users
# NOTE: ~*ahrefs intentionally broad — covers AhrefsBot AND AhrefsSiteAudit/X.X
# (the latter does NOT contain "bot" substring, so the generic ~*bot fallback
# below misses it). Same reasoning for ~*siteaudit / ~*audit.
map $http_user_agent $is_bot {
    default                     0;
    ~*googlebot                 1;
    ~*bingbot                   1;
    ~*yandexbot                 1;
    ~*duckduckbot               1;
    ~*baiduspider               1;
    ~*facebookexternalhit       1;
    ~*twitterbot                1;
    ~*linkedinbot               1;
    ~*slurp                     1;
    ~*applebot                  1;
    ~*semrushbot                1;
    ~*ahrefs                    1;
    ~*siteaudit                 1;
    ~*screaming.?frog           1;
    ~*bytespider                1;
    ~*pingdom                   1;
    ~*gtmetrix                  1;
    ~*lighthouse                1;
    ~*mj12bot                   1;
    ~*dotbot                    1;
    ~*petalbot                  1;
    ~*sogou                     1;
    ~*crawl                     1;
    ~*spider                    1;
    ~*scanner                   1;
    ~*audit                     1;
    ~*bot                       1;
    ~*Google-InspectionTool     1;
}

# SSG path: bots try SSG file first, real users go straight to SPA
# bot: try /ssg/en/genres/poetry/index.html → fallback /index.html
# user: try /nonexistent → fallback /index.html (instant SPA)
map $is_bot $ssg_file {
    1       /ssg$uri/index.html;
    default /nonexistent;
}

# Header: indicates whether SSG or SPA was served
map $is_bot $seo_render_tag {
    1       ssg;
    default spa;
}

# Private/user routes — emit X-Robots-Tag noindex. Key on $request_uri (not
# $uri) because try_files in location / does internal redirect to /index.html,
# which rewrites $uri — $request_uri keeps the original. Matched in both
# location / and location @spa (the two terminal branches).
# Empty default → nginx omits the header.
#
# Chapter reader routes (/books/{slug}/{chapter}) are SPA-only (no SSG) and
# would otherwise be indexed as thin-content duplicates.
# Pattern `[^/]+/[^/?#]+` requires a second non-root segment so it does NOT
# match book detail pages (`/books/{slug}/`) which ARE SSG-rendered.
map $request_uri $private_route_robots {
    default                                                                                     "";
    "~*^/en/(library/my|settings|profile|highlights|practice|stats|vocabulary|reader)"      "noindex, follow";
    "~*^/en/books/[^/]+/[^/?#]+"                                                            "noindex, follow";
}

# Upstream for API (Docker container on localhost only)
upstream textstack_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Upstream for Admin panel (Docker container on localhost only)
upstream textstack_admin {
    server 127.0.0.1:81;
}

# Upstream for the remote MCP server (AI-049) — Docker container, localhost only.
# Streamable HTTP / SSE; keepalive so long-lived connections reuse upstream sockets.
upstream textstack_mcp {
    server 127.0.0.1:8090;
    keepalive 32;
}

# --- textstack.app (Public site) ---
# Cloudflare terminates SSL, traffic arrives as HTTP
server {
    listen 80;
    listen [::]:80;
    server_name textstack.app www.textstack.app localhost;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com;" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /home/vasyl/projects/onlinelib/textstack/apps/web/dist;
    index _nonexistent_;

    # === REDIRECTS (order matters!) ===

    # 1. Normalize double slashes
    if ($request_uri ~* "//") {
        rewrite ^(.*)//+(.*)$ $1/$2 permanent;
    }

    # 2. www → non-www
    if ($host = 'www.textstack.app') {
        return 301 https://textstack.app$request_uri;
    }

    # 3. Homepage → /en/
    location = / {
        return 301 https://textstack.app/en/;
    }

    # 3.5 Legacy /uk/* → /en/* (Ukrainian content removed 2026-04-21)
    location ~ ^/uk(/.*)?$ {
        return 301 https://textstack.app/en$1;
    }

    # 4. Book assets (BEFORE legacy redirect — nginx uses first regex match)
    location ~ ^/books/[^/]+/assets/ {
        proxy_pass http://textstack_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 5. Legacy URLs without lang prefix → /en/*/
    location ~ ^/(books|authors|genres|search|about|library)(?:/(.*))?$ {
        set $section $1;
        set $subpath $2;
        if ($subpath ~ ^(.+)/$ ) {
            set $subpath $1;
        }
        set $final_path /en/$section;
        if ($subpath != '') {
            set $final_path /en/$section/$subpath;
        }
        return 301 https://textstack.app$final_path/;
    }

    # 6. Trailing slash enforcement for /en|uk/* (skip files). Keeps the query string: `$uri` has
    #    none, and dropping it broke every link that carries one — the OAuth consent page arrived
    #    without `?req=` and told every reader their connection request had expired.
    location ~ ^/en/(.+[^/])$ {
        if ($uri ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|json|xml|txt|map|html)$) {
            break;
        }
        return 301 https://textstack.app$uri/$is_args$args;
    }

    # === PROXIES ===

    # SEO files
    location = /robots.txt {
        proxy_pass http://textstack_api/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Site-Id general;
    }

    location = /sitemap.xml {
        proxy_pass http://textstack_api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Site-Id general;
    }

    location /sitemaps/ {
        proxy_pass http://textstack_api/sitemaps/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Site-Id general;
    }

    # Translation endpoint — stricter per-IP rate limit
    location /api/translate {
        limit_req zone=translate_limit burst=2 nodelay;
        proxy_pass http://textstack_api/translate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Site-Id general;
        proxy_set_header Connection "";
    }

    # API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://textstack_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Site-Id general;
        proxy_set_header Connection "";
        client_max_body_size 500M;
        proxy_read_timeout 300s;
    }

    # MCP discovery manifest (AI-052) — machine-readable JSON for MCP clients /
    # tooling. Exact-match (`location =`) so it CANNOT be shadowed by the `/mcp`
    # prefix below (which is the live protocol endpoint → mcp-server container).
    # Served by the main API at the internal path /mcp/manifest; mirror the /api/
    # header set so SiteContextMiddleware resolves the site for this anonymous call.
    location = /.well-known/mcp/manifest.json {
        proxy_pass http://textstack_api/mcp/manifest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Site-Id general;
        proxy_set_header Connection "";
    }

    # OAuth for MCP (ADR-017). Without these the paths fall through to the SPA and answer
    # 200 text/html, which Claude/ChatGPT then try to parse as JSON. Exact-match so neither
    # the `/mcp` prefix nor `location /` can shadow them.
    #
    # Protected Resource Metadata (RFC 9728) belongs to the resource server → MCP host.
    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://textstack_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://textstack_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
    # Authorization server metadata (RFC 8414) + the AS endpoints → API, path unchanged
    # (no trailing URI on proxy_pass: /oauth/token stays /oauth/token).
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://textstack_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
    location /oauth/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://textstack_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # Remote MCP endpoint (AI-049) — streamable HTTP transport behind nginx +
    # the Cloudflare tunnel. Multi-user: each client sends its own
    # Authorization: Bearer <device-flow JWT> (relayed verbatim below); the MCP
    # server validates it per request (no server-side token cache here).
    #
    # SSE/streaming settings: HTTP/1.1 with no upstream "Connection: close",
    # buffering/cache off so server-pushed events flush immediately, and long
    # read/send timeouts for held-open streams.
    location /mcp {
        limit_req zone=mcp_limit burst=20 nodelay;
        proxy_pass http://textstack_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Relay the client's bearer to the MCP server (it authenticates per request).
        proxy_set_header Authorization $http_authorization;
        # Clear Connection so keepalive to the upstream works (no "close"/"upgrade").
        proxy_set_header Connection "";
        # Streaming: do not buffer or cache server-sent events.
        proxy_buffering off;
        proxy_cache off;
        # Hold long-lived streams open.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Personal connect URL: /mcp/k/<key> (ChatGPT can't send a header, so the key is in the
        # path — see ConnectUrl.cs). The URL is a password, and both logs record the request line:
        # access_log always, error_log on e.g. a limit_req rejection. Everything above is
        # inherited except proxy_pass, which is a handler and has to be repeated.
        location /mcp/k/ {
            access_log off;
            error_log /var/log/nginx/error.log crit;
            proxy_pass http://textstack_mcp;
        }
    }

    # Storage
    location /storage/ {
        alias /home/vasyl/projects/onlinelib/textstack/data/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Readers' uploads live here (EPUB images incl. SVG, clipped HTML, avatars). A stored file
        # must never run as a page on this origin: sandbox = no scripts, unique origin. add_header
        # here replaces the server-level set, so nosniff is repeated. Images in <img> are unaffected.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; media-src 'self'; sandbox" always;
    }

    # /internal/* is for the Docker network and host pollers only (they call 127.0.0.1:8080
    # directly). Never route it from the internet. ~* because ASP.NET routing ignores case.
    location ~* ^/api/internal(/|$) {
        return 404;
    }

    # SSG files are written by ssg-worker container → host bind mount data/ssg/.
    # nginx root is apps/web/dist, so $ssg_file (/ssg$uri/index.html) without this
    # alias resolves to a non-existent path. `internal` blocks direct external access.
    location /ssg/ {
        internal;
        alias /home/vasyl/projects/onlinelib/textstack/data/ssg/;
    }

    # === SSG PAGES (bots get static HTML, real users get SPA) ===
    # $ssg_file map: bots → /ssg/<uri>/index.html, users → /nonexistent
    # try_files: if SSG file exists serve it, otherwise fall back to SPA

    location ~ ^/en/?$ {
        add_header X-SEO-Render $seo_render_tag always;
        try_files $ssg_file @spa;
    }

    location ~ ^/en/books/[^/]+/?$ {
        add_header X-SEO-Render $seo_render_tag always;
        try_files $ssg_file @spa;
    }

    location ~ ^/en/authors/[^/]+/?$ {
        add_header X-SEO-Render $seo_render_tag always;
        try_files $ssg_file @spa;
    }

    location ~ ^/en/genres/[^/]+/?$ {
        add_header X-SEO-Render $seo_render_tag always;
        try_files $ssg_file @spa;
    }

    location ~ ^/en/(books|authors|genres|about)/?$ {
        add_header X-SEO-Render $seo_render_tag always;
        try_files $ssg_file @spa;
    }

    # SPA fallback for SSG blocks
    # When SSG file missing: users get SPA, bots get proper HTTP 404.
    # This prevents Google "Soft 404" — bots were getting SPA shell (HTTP 200)
    # with "Book not found" text, which Google classifies as Soft 404.
    location @spa {
        # "if" inside location is safe here: both branches use "return" or
        # "try_files" (no rewrite), avoiding the known nginx "if is evil" pitfalls.
        if ($is_bot) {
            return 404 '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Not Found</title></head><body><h1>404 — Page Not Found</h1></body></html>';
        }
        add_header X-SEO-Render "spa" always;
        add_header X-Robots-Tag $private_route_robots always;
        try_files /index.html =404;
    }

    # Catch-all: SPA routes without SSG. Private/user routes (reader, stats, …)
    # land here and pick up X-Robots-Tag via the $private_route_robots map.
    location / {
        add_header X-SEO-Render "spa" always;
        add_header X-Robots-Tag $private_route_robots always;
        try_files $uri /index.html;
    }

    # Static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /avatars/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/manifest+json;
    gzip_min_length 1000;

    # Web manifest — correct MIME type
    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
    }
}

# --- textstack.dev (Admin Panel - auth required) ---
server {
    listen 80;
    listen [::]:80;
    server_name textstack.dev;

    # Block indexing - admin-only domain, no public content
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS (uncomment after SSL is set up)
    # location / {
    #     return 301 https://$server_name$request_uri;
    # }

    # robots.txt - disallow everything
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # API proxy for admin endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://textstack_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Site-Id general;  # Admin works with general site
        proxy_set_header Connection "";

        # File uploads for admin
        client_max_body_size 500M;
        proxy_read_timeout 300s;
    }

    # Static files for uploads/covers (admin needs to see book covers)
    location /storage/ {
        alias /home/vasyl/projects/onlinelib/textstack/data/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Readers' uploads live here (EPUB images incl. SVG, clipped HTML, avatars). A stored file
        # must never run as a page on this origin: sandbox = no scripts, unique origin. add_header
        # here replaces the server-level set, so nosniff is repeated. Images in <img> are unaffected.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; media-src 'self'; sandbox" always;
    }

    # /internal/* is for the Docker network and host pollers only (they call 127.0.0.1:8080
    # directly). Never route it from the internet. ~* because ASP.NET routing ignores case.
    location ~* ^/api/internal(/|$) {
        return 404;
    }

    # Proxy to admin SPA (Vite dev server in Docker)
    location / {
        proxy_pass http://textstack_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name textstack.dev;

    ssl_certificate /etc/letsencrypt/live/textstack.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/textstack.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Block indexing - admin-only domain
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # robots.txt - disallow everything
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://textstack_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Site-Id general;
        proxy_set_header Connection "";
        client_max_body_size 500M;
        proxy_read_timeout 300s;
    }

    location /storage/ {
        alias /home/vasyl/projects/onlinelib/textstack/data/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Readers' uploads live here (EPUB images incl. SVG, clipped HTML, avatars). A stored file
        # must never run as a page on this origin: sandbox = no scripts, unique origin. add_header
        # here replaces the server-level set, so nosniff is repeated. Images in <img> are unaffected.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; media-src 'self'; sandbox" always;
    }

    # /internal/* is for the Docker network and host pollers only (they call 127.0.0.1:8080
    # directly). Never route it from the internet. ~* because ASP.NET routing ignores case.
    location ~* ^/api/internal(/|$) {
        return 404;
    }

    # Proxy to admin SPA
    location / {
        proxy_pass http://textstack_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
