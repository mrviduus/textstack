# Textstack Production Nginx Configuration
# Install: sudo cp this_file /etc/nginx/sites-available/textstack
#          sudo ln -s /etc/nginx/sites-available/textstack /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

# Rate-limit key: the client, not the hop. Public traffic arrives from cloudflared on this host,
# so $remote_addr is loopback for every request. When (and only when) the peer is that loopback
# hop, key on the CF-Connecting-IP header Cloudflare sets at the edge; anything else (direct
# connections, a request without the header) keys on the peer address as before.
#
# Deliberately a map, not `real_ip_header`: real_ip would rewrite $remote_addr, which changes what
# $proxy_add_x_forwarded_for appends and what X-Real-IP carries to the API. The API derives the
# client itself from X-Forwarded-For with a trusted-network walk (backend/src/Api/Program.cs);
# leaving $remote_addr alone keeps that input exactly as it was.
geo $from_tunnel {
    default   0;
    127.0.0.1 1;
    ::1       1;
}
map "$from_tunnel:$http_cf_connecting_ip" $limit_key {
    "~^1:(?<cf_client_ip>.+)$" $cf_client_ip;
    default                    $binary_remote_addr;
}

# Access log without query strings. The default `combined` format logs "$request", and our query
# strings carry reader content: /api/tts?text=<the passage being read aloud>, /api/search?q=<query>
# — next to the client IP. Same field layout as `combined`, so anything that parses combined still
# parses this; only the part after `?` is gone (from the request line and the Referer, which for
# same-origin requests is the full page URL, e.g. /en/search?q=...). $request_uri, not $uri:
# $uri is rewritten by try_files and would log /index.html for every SPA route.
# Applied per server block below — an http-level access_log here would ADD a second log next to
# the one nginx.conf already declares, not replace it.
map $request_uri $log_path {
    "~^([^?]*)" $1;
}
map $http_referer $log_referer {
    default      "-";      # no Referer: same "-" that combined prints
    "~^([^?]+)"  $1;
}
log_format textstack_noquery '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $log_path $server_protocol" $status $body_bytes_sent '
                             '"$log_referer" "$http_user_agent"';

# Rate limiting for API
limit_req_zone $limit_key zone=api_limit:10m rate=10r/s;
limit_req_zone $limit_key zone=upload_limit:10m rate=1r/s;
limit_req_zone $limit_key zone=translate_limit:10m rate=5r/m;
# Remote MCP transport (AI-049) — same shape as the API zone (10r/s, burst 20).
limit_req_zone $limit_key zone=mcp_limit:10m rate=10r/s;

# Private/user routes — emit X-Robots-Tag noindex. Key on $request_uri (not
# $uri) because try_files in location / does internal redirect to /index.html,
# which rewrites $uri — $request_uri keeps the original. Sent by the textstack.app
# server-level add_header (#857), so every location gets it.
# Empty default → nginx omits the header.
map $request_uri $private_route_robots {
    default                                                                                     "";
    "~*^/en/(library/my|settings|profile|highlights|practice|stats|vocabulary|reader)"      "noindex, follow";
}

# Upstream for API (Docker container on localhost only)
upstream textstack_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Upstream for Admin panel (Docker container on localhost only)
upstream textstack_admin {
    server 127.0.0.1:81;
}

# Upstream for the remote MCP server (AI-049) — Docker container, localhost only.
# Streamable HTTP / SSE; keepalive so long-lived connections reuse upstream sockets.
upstream textstack_mcp {
    server 127.0.0.1:8090;
    keepalive 32;
}

# --- textstack.app (Public site) ---
# Cloudflare terminates SSL, traffic arrives as HTTP
server {
    listen 80;
    listen [::]:80;
    server_name textstack.app www.textstack.app localhost;

    access_log /var/log/nginx/access.log textstack_noquery;

    # Security headers. nginx drops every server-level add_header in a location that has its own
    # add_header (#857: HTML pages went out with no CSP), so the per-page headers live here too.
    # An empty value → nginx omits the header.
    # CSP origins: Google sign-in (GSI script, stylesheet, iframe), gtag/GA, Ahrefs (after cookie
    # Accept; GA4 signals: *.g.doubleclick.net, www.google.com), Google Fonts, Sentry ingest, Cloudflare Web Analytics (beacon injected at the edge); blob: for TTS audio and the avatar preview.
    # Static locations set $cache_immutable for the same reason (#861: their own Cache-Control dropped nosniff).
    set $cache_immutable "";
    add_header Cache-Control $cache_immutable;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://www.googletagmanager.com https://analytics.ahrefs.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://accounts.google.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.g.doubleclick.net https://www.google.com https://analytics.ahrefs.com https://cloudflareinsights.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; frame-src 'self' https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag $private_route_robots always;

    root /home/vasyl/projects/onlinelib/textstack/apps/web/dist;
    index _nonexistent_;

    # === REDIRECTS (order matters!) ===

    # 1. Normalize double slashes
    if ($request_uri ~* "//") {
        rewrite ^(.*)//+(.*)$ $1/$2 permanent;
    }

    # 2. www → non-www
    if ($host = 'www.textstack.app') {
        return 301 https://textstack.app$request_uri;
    }

    # 3. Homepage → /en/
    location = / {
        return 301 https://textstack.app/en/;
    }

    # 3.5 Legacy /uk/* → /en/* (Ukrainian content removed 2026-04-21)
    location ~ ^/uk(/.*)?$ {
        return 301 https://textstack.app/en$1;
    }

    # 4. The retired public catalog (M6, D1): 410 Gone, so crawlers drop it. Before the
    #    redirects below — nginx uses the first regex match.
    location ~ ^/(en/)?(books|authors|genres|search|sitemap)(/|$) {
        return 410;
    }
    location ~ ^/sitemaps?(\.xml$|/) {
        return 410;
    }

    # 5. Legacy URLs without lang prefix → /en/*/
    location ~ ^/(about|library)(?:/(.*))?$ {
        set $section $1;
        set $subpath $2;
        if ($subpath ~ ^(.+)/$ ) {
            set $subpath $1;
        }
        set $final_path /en/$section;
        if ($subpath != '') {
            set $final_path /en/$section/$subpath;
        }
        return 301 https://textstack.app$final_path/;
    }

    # 6. Trailing slash enforcement for /en|uk/* (skip files). Keeps the query string: `$uri` has
    #    none, and dropping it broke every link that carries one — the OAuth consent page arrived
    #    without `?req=` and told every reader their connection request had expired.
    location ~ ^/en/(.+[^/])$ {
        if ($uri ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|json|xml|txt|map|html)$) {
            break;
        }
        return 301 https://textstack.app$uri/$is_args$args;
    }

    # === PROXIES ===

    # robots.txt: static. Private pages are not indexable; no sitemap (the catalog is retired).
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /api/\nDisallow: /*/library/my/\nDisallow: /*/vocabulary\nDisallow: /*/highlights\nDisallow: /*/reset-password\n";
    }

    # Translation endpoint — stricter per-IP rate limit
    location /api/translate {
        limit_req zone=translate_limit burst=2 nodelay;
        proxy_pass http://textstack_api/translate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Site-Id general;
        proxy_set_header Connection "";
    }

    # API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://textstack_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Site-Id general;
        proxy_set_header Connection "";
        client_max_body_size 500M;
        proxy_read_timeout 300s;
    }

    # MCP discovery manifest (AI-052) — machine-readable JSON for MCP clients /
    # tooling. Exact-match (`location =`) so it CANNOT be shadowed by the `/mcp`
    # prefix below (which is the live protocol endpoint → mcp-server container).
    # Served by the main API at the internal path /mcp/manifest; mirror the /api/
    # header set so SiteContextMiddleware resolves the site for this anonymous call.
    location = /.well-known/mcp/manifest.json {
        proxy_pass http://textstack_api/mcp/manifest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Site-Id general;
        proxy_set_header Connection "";
    }

    # OAuth for MCP (ADR-017). Without these the paths fall through to the SPA and answer
    # 200 text/html, which Claude/ChatGPT then try to parse as JSON. Exact-match so neither
    # the `/mcp` prefix nor `location /` can shadow them.
    #
    # Protected Resource Metadata (RFC 9728) belongs to the resource server → MCP host.
    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://textstack_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://textstack_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
    # Authorization server metadata (RFC 8414) + the AS endpoints → API, path unchanged
    # (no trailing URI on proxy_pass: /oauth/token stays /oauth/token).
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://textstack_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
    location /oauth/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://textstack_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # Remote MCP endpoint (AI-049) — streamable HTTP transport behind nginx +
    # the Cloudflare tunnel. Multi-user: each client sends its own
    # Authorization: Bearer <device-flow JWT> (relayed verbatim below); the MCP
    # server validates it per request (no server-side token cache here).
    #
    # SSE/streaming settings: HTTP/1.1 with no upstream "Connection: close",
    # buffering/cache off so server-pushed events flush immediately, and long
    # read/send timeouts for held-open streams.
    location /mcp {
        limit_req zone=mcp_limit burst=20 nodelay;
        proxy_pass http://textstack_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Relay the client's bearer to the MCP server (it authenticates per request).
        proxy_set_header Authorization $http_authorization;
        # Clear Connection so keepalive to the upstream works (no "close"/"upgrade").
        proxy_set_header Connection "";
        # Streaming: do not buffer or cache server-sent events.
        proxy_buffering off;
        proxy_cache off;
        # Hold long-lived streams open.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Personal connect URL: /mcp/k/<key> (ChatGPT can't send a header, so the key is in the
        # path — see ConnectUrl.cs). The URL is a password, and both logs record the request line:
        # access_log always, error_log on e.g. a limit_req rejection. Everything above is
        # inherited except proxy_pass, which is a handler and has to be repeated.
        location /mcp/k/ {
            access_log off;
            error_log /var/log/nginx/error.log crit;
            proxy_pass http://textstack_mcp;
        }
    }

    # Storage
    location ~* ^/storage/+(library|uploads)(/|$) {
        # The V2 library's names (library/ books and covers, uploads/ parts; owner-only through
        # /api/me/v2). #1110 moved the bytes out of data/storage; the rule stays so a misplaced file
        # (a symlink, a bind, a write after startup) is never public. Same rule: UserStoragePolicy.
        return 404;
    }

    location ~* ^/storage/+users/(?![^/]+/[^/]+/books/[^/]+/cover\.[a-z0-9]+$) {
        # Of a reader's upload folder only the cover is public; the book and its images go through
        # owner-checked /api/me/books/{id}/file and /assets (#913, ADR-024). Allowlist: anything else
        # under users/ is 404. Regex beats the /storage/ prefix below. Same rule: UserStoragePolicy.
        return 404;
    }

    location /storage/ {
        alias /home/vasyl/projects/onlinelib/textstack/data/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Readers' uploads live here (EPUB images incl. SVG, clipped HTML, avatars). A stored file
        # must never run as a page on this origin: sandbox = no scripts, unique origin. add_header
        # here replaces the server-level set, so nosniff is repeated. Images in <img> are unaffected.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; media-src 'self'; sandbox" always;
    }

    # /internal/* is for the Docker network and host pollers only (they call 127.0.0.1:8080
    # directly). Never route it from the internet. ~* because ASP.NET routing ignores case.
    location ~* ^/api/internal(/|$) {
        return 404;
    }

    # Catch-all: the SPA. Private/user routes (reader, stats, …) pick up X-Robots-Tag via
    # the $private_route_robots map.
    location / {
        try_files $uri /index.html;
    }

    # Static assets
    location /assets/ {
        # nginx's mime.types has no .mjs → application/octet-stream, which a browser refuses as a
        # module: the pdf.js worker (pdf.worker.min-*.mjs) never loaded, so web PDFs could not open.
        include mime.types;
        types { text/javascript mjs; }
        expires 1y;
        set $cache_immutable "public, immutable";
    }

    location /avatars/ {
        expires 1y;
        set $cache_immutable "public, immutable";
    }

    # Reader frame (#1225, ADR-029 Decision 4; packages/reader/src/frame.mjs). The shell is
    # same-origin, embedded by the app (hence `frame-src 'self'` above), with a fresh nonce per response:
    # sub_filter swaps the placeholder for $request_id (32 hex). Unfilled, it fails closed (no script runs).
    # Its own add_header set drops the server-level one (#857), which is the point: frame-ancestors 'none'
    # and X-Frame-Options DENY would refuse the frame; X-Robots-Tag is set here again for the same reason.
    # no-transform: an edge that rewrites the HTML (beacon injection) would add a script the nonce CSP refuses.
    # Must match frame.mjs READER_FRAME_HEADERS (prodCsp.check.mjs compares them both ways).
    location = /reader/frame.html {
        types { }
        default_type text/html;
        charset utf-8;
        sub_filter '%READER_FRAME_NONCE%' $request_id;
        sub_filter_once off;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Cache-Control "no-store, no-transform" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # The page code the shell loads (3.75 MB, ~1.6 MB gzipped): content-hashed, so cached for a year. No
    # add_header here: the server-level set (nosniff included) applies. The charset matters: the script is
    # not ASCII. A name that is not there is a 404, never the SPA's index.html; so is anything else under
    # /reader/ (the plain prefix below: this regex still wins over it).
    location ~ "^/reader/page\.[0-9a-f]{16}\.js$" {
        types { }
        default_type text/javascript;
        charset utf-8;
        charset_types text/javascript;
        try_files $uri =404;
        set $cache_immutable "public, max-age=31536000, immutable";
    }

    location /reader/ {
        return 404;
    }


    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml application/manifest+json;
    gzip_min_length 1000;

    # Web manifest — correct MIME type
    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
    }
}

# --- textstack.dev (Admin Panel - auth required) ---
server {
    listen 80;
    listen [::]:80;
    server_name textstack.dev;

    access_log /var/log/nginx/access.log textstack_noquery;

    # Block indexing - admin-only domain, no public content
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Cloudflare reaches this block, not the 443 one (#864). CSP is frame-ancestors only: the admin
    # SPA is the Vite dev server, a script policy would break it. Only /storage/ has its own add_header.
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS (uncomment after SSL is set up)
    # location / {
    #     return 301 https://$server_name$request_uri;
    # }

    # robots.txt - disallow everything
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # API proxy for admin endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://textstack_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Site-Id general;  # Admin works with general site
        proxy_set_header Connection "";

        # File uploads for admin
        client_max_body_size 500M;
        proxy_read_timeout 300s;
    }

    # Static files for uploads/covers (admin needs to see book covers)
    location ~* ^/storage/+(library|uploads)(/|$) {
        # The V2 library's names (library/ books and covers, uploads/ parts; owner-only through
        # /api/me/v2). #1110 moved the bytes out of data/storage; the rule stays so a misplaced file
        # (a symlink, a bind, a write after startup) is never public. Same rule: UserStoragePolicy.
        return 404;
    }

    location ~* ^/storage/+users/(?![^/]+/[^/]+/books/[^/]+/cover\.[a-z0-9]+$) {
        # Of a reader's upload folder only the cover is public; the book and its images go through
        # owner-checked /api/me/books/{id}/file and /assets (#913, ADR-024). Allowlist: anything else
        # under users/ is 404. Regex beats the /storage/ prefix below. Same rule: UserStoragePolicy.
        return 404;
    }

    location /storage/ {
        alias /home/vasyl/projects/onlinelib/textstack/data/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Readers' uploads live here (EPUB images incl. SVG, clipped HTML, avatars). A stored file
        # must never run as a page on this origin: sandbox = no scripts, unique origin. add_header
        # here replaces the server-level set, so nosniff is repeated. Images in <img> are unaffected.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; media-src 'self'; sandbox" always;
    }

    # /internal/* is for the Docker network and host pollers only (they call 127.0.0.1:8080
    # directly). Never route it from the internet. ~* because ASP.NET routing ignores case.
    location ~* ^/api/internal(/|$) {
        return 404;
    }

    # Proxy to admin SPA (Vite dev server in Docker)
    location / {
        proxy_pass http://textstack_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name textstack.dev;

    access_log /var/log/nginx/access.log textstack_noquery;

    ssl_certificate /etc/letsencrypt/live/textstack.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/textstack.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Block indexing - admin-only domain
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # robots.txt - disallow everything
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://textstack_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Site-Id general;
        proxy_set_header Connection "";
        client_max_body_size 500M;
        proxy_read_timeout 300s;
    }

    location ~* ^/storage/+(library|uploads)(/|$) {
        # The V2 library's names (library/ books and covers, uploads/ parts; owner-only through
        # /api/me/v2). #1110 moved the bytes out of data/storage; the rule stays so a misplaced file
        # (a symlink, a bind, a write after startup) is never public. Same rule: UserStoragePolicy.
        return 404;
    }

    location ~* ^/storage/+users/(?![^/]+/[^/]+/books/[^/]+/cover\.[a-z0-9]+$) {
        # Of a reader's upload folder only the cover is public; the book and its images go through
        # owner-checked /api/me/books/{id}/file and /assets (#913, ADR-024). Allowlist: anything else
        # under users/ is 404. Regex beats the /storage/ prefix below. Same rule: UserStoragePolicy.
        return 404;
    }

    location /storage/ {
        alias /home/vasyl/projects/onlinelib/textstack/data/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Readers' uploads live here (EPUB images incl. SVG, clipped HTML, avatars). A stored file
        # must never run as a page on this origin: sandbox = no scripts, unique origin. add_header
        # here replaces the server-level set, so nosniff is repeated. Images in <img> are unaffected.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; media-src 'self'; sandbox" always;
    }

    # /internal/* is for the Docker network and host pollers only (they call 127.0.0.1:8080
    # directly). Never route it from the internet. ~* because ASP.NET routing ignores case.
    location ~* ^/api/internal(/|$) {
        return 404;
    }

    # Proxy to admin SPA
    location / {
        proxy_pass http://textstack_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
