# Serves the built admin SPA inside the admin container. Host nginx (infra/nginx)
# terminates TLS, adds the security headers and proxies /api; this only serves files.
server {
    listen 81;
    root /usr/share/nginx/html;

    # Vite fingerprints everything under /assets; index.html is not, so it must revalidate.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
