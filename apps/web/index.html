<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F3EEE7" />
    <!-- Primary reading font; other TextStack faces load on demand. -->
    <link rel="preload" href="/src/assets/fonts/TextStack-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Interface font + Material Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,700&family=Material+Icons+Outlined&display=swap" rel="stylesheet" />
    <title>TextStack Reader – Read Books in English with Translation</title>
    <meta name="description" content="Read books in English with instant word translation. TextStack Reader helps you learn languages naturally through real books, vocabulary tracking, and spaced repetition.">

    <meta name="author" content="TextStack Reader">
    <meta name="publisher" content="TextStack Reader">
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TextStack Reader",
      "url": "https://textstack.app",
      "logo": "https://textstack.app/favicon-96x96.png"
    }
    </script>
    <!-- Structured Data - WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TextStack Reader",
      "url": "https://textstack.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://textstack.app/en/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- Google tag (gtag.js) with Consent Mode v2 — analytics denied until user consents.
         CookieBanner flips consent on Accept and lazy-loads Ahrefs. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3ZNR40KDFP"></script>
    <script src="/gtag-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
