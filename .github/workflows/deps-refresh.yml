name: Dependencies (semiannual)

# One pull request, twice a year, for everything that is only about not falling
# behind. Security is deliberately NOT here: Dependabot security updates open
# their own pull request the day an advisory lands, `dotnet list package
# --vulnerable` gates the backend job and `scripts/check-advisories.mjs` gates
# `advisories` in ci.yml. Separating the two is what lets this lane be this quiet — a calendar is
# the wrong instrument for a vulnerability, and a vulnerability is the only
# reason a calendar would need to be fast.
#
# Three things move, in one commit:
#
#   lockfile — re-resolve inside the ranges already declared. No package.json
#              changes. This is the one that mattered: dompurify shipped a known
#              vulnerable XSS sanitiser to every visitor for months while
#              apps/web/package.json already declared a range that allowed the
#              fix. The range was right; nothing re-resolved it.
#   catalog  — raise the shared versions in pnpm-workspace.yaml by patch and minor.
#   nuget    — raise Directory.Packages.props by patch and minor.
#
# Majors are reported and left for a person, in all three.
#
# What this must never touch is expo, react-native and react. Those decide the
# mobile runtime fingerprint. A bot bump passes CI — tsc and the unit tests do
# not know what an SDK compatibility matrix is — and then every installed app
# stops receiving OTA updates, because mobile-ota.yml correctly refuses to
# publish into a runtime nobody is running. scripts/catalogBump.mjs holds the
# list; the lockfile lane cannot reach them because it never changes a declared
# range. `scripts/report-drift.mjs mobile` is what reports them instead, on
# every pull request, since nothing else will.
#
# There is a workflow in four sibling repositories that bumps NuGet packages and
# pushes straight to `main`, verified inside the job. That is right there and
# wrong here: in those repos a push to main publishes a package, and in this one
# **a merge to main deploys production**. So the PR is not ceremony — it is the
# gate, and CI is what opens it.

on:
  schedule:
    - cron: '0 6 1 1,7 *'   # 1 January and 1 July, before anyone is looking
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would change and stop
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deps-refresh
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Two installs and a restore. No verification — see the note further down.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The pull request body is assembled as the job goes: each bumper prints
      # the same markdown it puts in the job summary. Kept in RUNNER_TEMP so it
      # cannot end up committed.
      - name: Start the proposal
        run: |
          {
            echo 'Raised twice a year, patch and minor only. Majors are listed below and left for a person.'
            echo
            echo 'Merging this deploys production, so CI is the gate — it runs on this branch because'
            echo '`ci.yml` also triggers on a push to `deps/**` (a bot pull request fires no'
            echo '`pull_request` event, which is what left every earlier proposal BLOCKED with nothing'
            echo 'to run).'
            echo
          } > "$RUNNER_TEMP/proposal.md"

      # No --frozen-lockfile: re-resolving inside the declared ranges is the
      # entire point. Every package.json is left exactly as it is.
      - name: Re-resolve the lockfile
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          {
            echo '### Lockfile'
            echo
            if git diff --quiet -- pnpm-lock.yaml; then
              echo 'Already current.'
            else
              echo 'Re-resolved inside the ranges already declared — no `package.json` changed.'
              echo
              echo '```'
              git diff --stat -- pnpm-lock.yaml
              echo '```'
            fi
            echo
          } | tee -a "$RUNNER_TEMP/proposal.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Raise the catalog
        run: |
          set -euo pipefail
          node scripts/bump-catalog.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            | tee -a "$RUNNER_TEMP/proposal.md"
          echo >> "$RUNNER_TEMP/proposal.md"

      # The catalog rewrite changes declared versions, so the lockfile has to
      # follow it. Skipped on a dry run, where nothing was written.
      - name: Install the raised versions
        if: inputs.dry_run != true
        run: pnpm install --no-frozen-lockfile

      # `dotnet list package --outdated` reads the assets file, so restore first.
      - name: Raise the NuGet manifest
        run: |
          set -euo pipefail
          dotnet restore
          node scripts/bump-nuget.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            | tee -a "$RUNNER_TEMP/proposal.md"
          echo >> "$RUNNER_TEMP/proposal.md"

      # One question, asked once, instead of three `changed` outputs to combine.
      - name: Anything to propose?
        id: state
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo '### Nothing to raise' >> "$GITHUB_STEP_SUMMARY"
          fi

      # This job verifies nothing itself, and that is new. It used to re-run both
      # site builds, the unit suites, typecheck and a Metro bundle by hand,
      # because a pull request opened by a bot got no CI: GITHUB_TOKEN fires no
      # `pull_request` event, so the four required contexts never appeared and
      # every proposal sat BLOCKED. ci.yml now also triggers on a push to
      # `deps/**`, so the real suite runs on this branch — including the two
      # checks that were the actual reason for verifying here, `expo install
      # --check` against the SDK matrix and the Metro bundle. Duplicating them
      # would buy ten minutes of nothing.

      # NOTE: this step needs a REPOSITORY SETTING, not a token. Without
      # Settings → Actions → General → Workflow permissions → "Allow GitHub
      # Actions to create and approve pull requests", it fails with
      # "GitHub Actions is not permitted to create or approve pull requests"
      # AFTER doing all the work — the branch is pushed and the proposal is
      # sound, only the PR is missing. That is what happened on 2026-09-07:
      # deps/catalog held two verified bumps that nobody saw, while Dependabot,
      # which needs no such permission, filed five that could not merge.
      - name: Open a pull request
        if: steps.state.outputs.changed == 'true' && inputs.dry_run != true
        uses: peter-evans/create-pull-request@v8
        with:
          branch: deps/semiannual
          delete-branch: true
          title: 'chore(deps): semiannual dependency raise'
          commit-message: |
            chore(deps): semiannual dependency raise

            Lockfile re-resolved inside declared ranges, pnpm catalog and
            Directory.Packages.props raised by patch and minor. Majors reported,
            not taken. Security fixes do not wait for this lane.
          body-path: ${{ runner.temp }}/proposal.md
          labels: dependencies
