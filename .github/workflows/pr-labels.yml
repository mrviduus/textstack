name: PR labels

# Every PR needs an area label: it picks the PR's section on the /changelog page (#1220). The allowed labels are read from .github/release.yml,
# so the list lives in one place. Dependabot PRs pass by their `dependencies` label,
# which release.yml excludes from the changelog.
on:
  pull_request:
    types: [opened, reopened, edited, labeled, unlabeled, synchronize]

permissions:
  contents: read

jobs:
  area-label:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/release.yml
            scripts/changelog-data.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # yq (mikefarah) ships with the runner image.
          allowed=$(yq -o=json '[.changelog.categories[].labels[], .changelog.exclude.labels[]] - ["*"]' .github/release.yml)
          hit=$(jq -n --argjson a "$allowed" --argjson l "$LABELS" '$l - ($l - $a) | length')
          if [ "$hit" -eq 0 ]; then
            echo "::error::Add one area label: $(jq -r 'join(", ")' <<<"$allowed"). It picks the release-notes section (.github/release.yml)."
            exit 1
          fi
          echo "Area label present: $(jq -r --argjson a "$allowed" '. - (. - $a) | join(", ")' <<<"$LABELS")"
      # `public` puts the PR on the reader view of /changelog (#1216): it needs the
      # `## Public` block the page shows. Same parser as the build.
      - if: contains(github.event.pull_request.labels.*.name, 'public')
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/changelog-data.mjs --check
