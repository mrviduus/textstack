name: Scheduled Backup

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC
  workflow_dispatch:

env:
  PROJECT_DIR: /home/vasyl/projects/onlinelib/textstack
  BACKUP_DIR: /home/vasyl/backups/textstack
  # Opt JS actions into Node 24 ahead of June 2026 forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  backup:
    runs-on: self-hosted
    # 13m typical.
    timeout-minutes: 45

    steps:
      - name: Set backup date
        run: echo "BACKUP_DATE=$(date +%F)" >> $GITHUB_ENV

      - name: Create backup directory
        run: mkdir -p $BACKUP_DIR

      - name: Backup database
        run: |
          docker exec textstack_db_prod pg_dump -U textstack_prod textstack_prod | gzip > $BACKUP_DIR/db-$BACKUP_DATE.sql.gz
          echo "Database backup: db-$BACKUP_DATE.sql.gz"

      - name: Backup storage
        run: |
          tar czf $BACKUP_DIR/storage-$BACKUP_DATE.tar.gz -C $PROJECT_DIR/data storage
          echo "Storage backup: storage-$BACKUP_DATE.tar.gz"

      - name: Cleanup old backups (keep 5 newest of each type)
        run: |
          cd $BACKUP_DIR
          ls -1t db-*.sql.gz 2>/dev/null | tail -n +6 | xargs -r rm -v
          ls -1t storage-*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm -v
          ls -1t pre-deploy-*.sql.gz 2>/dev/null | tail -n +6 | xargs -r rm -v

      - name: Verify archive integrity
        run: |
          ls -lh $BACKUP_DIR/*.gz | tail -5
          gunzip -t $BACKUP_DIR/db-$BACKUP_DATE.sql.gz

      - name: Verify backup restores into fresh postgres
        run: |
          cd $PROJECT_DIR
          ./infra/scripts/backup-verify.sh $BACKUP_DIR/db-$BACKUP_DATE.sql.gz
