name: Restore drill (R2 → clean machine)

# Proves the off-site backup can actually be restored — with nothing from the prod box.
# A GitHub-hosted runner pulls the latest R2 snapshots (restic), loads the V2 database dump
# (ADR-030: all live data since the cutover) into a fresh postgres, and checks that it is complete
# and that the files it points at exist in the restored library. Prints how long each step took:
# that is the real RTO. Nothing is written anywhere; the runner is thrown away.
#
# Monthly + on demand. A backup that was never restored is a hope, not a backup.

on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of the month, after the nightly backup
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'restic id of a /db_v2.sql snapshot (storage from the same night); empty = latest'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      db:
        # Same image as prod.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: drill
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U drill -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PGHOST: 127.0.0.1
      PGUSER: drill
      PGPASSWORD: drill
      PGDATABASE: textstack_v2
      PSQL: psql -X -v ON_ERROR_STOP=1 -qAt
      RESTORE: /tmp/restore
    steps:
      # database/v2: run.sh creates the scratch V2 database, the migrations name its tables.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            database
          persist-credentials: false

      - name: Install restic + psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic postgresql-client >/dev/null
          restic version

      - name: Snapshots in R2
        run: |
          restic snapshots --compact

      # A pinned /db_v2.sql snapshot: storage (/backup, sent just before it) is the snapshot of that
      # path closest in time, within 6 h. Unpinned, every step reads latest.
      - name: Resolve pinned snapshot
        if: inputs.snapshot
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          set -euo pipefail
          [[ "$SNAPSHOT" =~ ^[0-9a-f]{8,64}$ ]] || { echo "::error::snapshot must be a restic id (hex)"; exit 1; }
          snap=$(restic snapshots --json "$SNAPSHOT")
          [ "$(jq -r '.[0].paths | index("/db_v2.sql") != null' <<<"$snap")" = true ] \
            || { echo "::error::$SNAPSHOT is not a /db_v2.sql snapshot"; exit 1; }
          db_t=$(jq -r '.[0].time' <<<"$snap"); db=$(date -d "$db_t" +%s)
          # "<seconds apart> <id>" of the /backup snapshot closest to the dump; nothing if none.
          read -r fd fid <<<"$(restic snapshots --path /backup --json | jq -r '.[] | "\(.time) \(.id)"' \
            | while read -r t id; do d=$(( $(date -d "$t" +%s) - db )); echo "${d#-} $id"; done \
            | sort -n | head -n 1)" || true
          [ -n "${fid:-}" ] && [ "$fd" -le 21600 ] || { echo "::error::no /backup snapshot within 6 h of $SNAPSHOT"; exit 1; }
          echo "db $SNAPSHOT ($db_t), storage $fid"
          { echo "DB_SNAP=$SNAPSHOT"; echo "FILES_SNAP=$fid"; } >> "$GITHUB_ENV"

      # backup.yml sends the V2 dump through stdin as /db_v2.sql. The dump owner is the prod user.
      - name: Restore V2 database (timed)
        run: |
          set -euo pipefail
          restic snapshots --path /db_v2.sql --json | grep -q '"id"' \
            || { echo "::error::no /db_v2.sql snapshot in R2"; exit 1; }
          start=$(date +%s)
          $PSQL -d drill -c "CREATE ROLE textstack_prod" >/dev/null
          sh database/v2/run.sh create
          restic dump --path /db_v2.sql "${DB_SNAP:-latest}" /db_v2.sql | $PSQL >/dev/null
          echo "DB_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # Every table a migration in the restored ledger creates, read from that migration; then the
      # tables a reader's data lives in must have rows (a truncated or empty dump, not normal churn).
      - name: V2 database is complete
        run: |
          set -euo pipefail
          n=0
          for v in $($PSQL -c "SELECT lpad(version::text, 4, '0') || '_' || name FROM schema_migrations ORDER BY version"); do
            for t in $(grep -o 'CREATE TABLE public\.[a-z0-9_]*' "database/v2/migrations/$v.up.sql" | cut -d. -f2); do
              # Not inside echo: echo's status would hide a table the dump never created.
              c=$($PSQL -c "SELECT count(*) FROM public.$t")
              echo "$t: $c"
              n=$((n + 1))
            done
          done
          [ "$n" -gt 0 ] || { echo "::error::restored V2 database has no migrated tables"; exit 1; }
          for t in users books book_files annotations; do
            [ "$($PSQL -c "SELECT count(*) FROM public.$t")" -ge 1 ] \
              || { echo "::error::$t is empty: restored V2 database looks truncated"; exit 1; }
          done
          echo "TABLES=$n" >> "$GITHUB_ENV"
          echo "newest annotation in the backup: $($PSQL -c "SELECT max(updated_at) FROM annotations")"

      - name: Restore storage + .env (timed)
        run: |
          set -euo pipefail
          start=$(date +%s)
          restic restore "${FILES_SNAP:-latest}" --path /backup --target "$RESTORE"
          echo "FILES_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          for d in storage library; do
            echo "$d: $(find "$RESTORE/backup/$d" -type f | wc -l) files, $(du -sh "$RESTORE/backup/$d" | cut -f1)"
          done

      # book_files.server_storage_key is relative to the library root (data/library = /backup/library).
      - name: Files the database points at exist
        run: |
          set -euo pipefail
          L="$RESTORE/backup/library"
          total=0; missing=0
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            total=$((total + 1))
            [ -f "$L/$p" ] || { missing=$((missing + 1)); [ $missing -le 5 ] && echo "missing: $p"; }
          done < <($PSQL -c "SELECT server_storage_key FROM book_files WHERE server_storage_key IS NOT NULL AND is_current ORDER BY random() LIMIT 200")
          echo "book files checked: $total, missing: $missing"
          [ "$total" -gt 0 ] || { echo "::error::no book file keys to check"; exit 1; }
          # A few may legitimately be gone (deleted after the dump); most missing = broken backup.
          [ $((missing * 10)) -le "$total" ] || { echo "::error::more than 10% of book files missing"; exit 1; }

      - name: .env is present (names only, never values)
        run: |
          set -euo pipefail
          E="$RESTORE/backup/env"
          [ -s "$E" ] || { echo "::error::.env missing from the backup"; exit 1; }
          for k in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB JWT_SECRET OPENAI_API_KEY; do
            grep -q "^$k=." "$E" && echo "$k: set" || { echo "::error::$k missing in backed-up .env"; exit 1; }
          done

      - name: Recovery time
        run: |
          echo "### Restore drill passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- V2 database restore: ${DB_SECONDS}s, ${TABLES} tables counted" >> "$GITHUB_STEP_SUMMARY"
          echo "- storage + .env restore: ${FILES_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
          echo "DB ${DB_SECONDS}s, files ${FILES_SECONDS}s"
