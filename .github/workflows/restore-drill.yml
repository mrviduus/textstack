name: Restore drill (R2 → clean machine)

# Proves the off-site backup can actually be restored — with nothing from the prod box.
# A GitHub-hosted runner pulls the latest R2 snapshots (restic), loads the DB dump into a
# fresh pgvector postgres, and checks that it is complete and that the files the DB points
# at exist in the restored storage. Prints how long each step took: that is the real RTO.
# Nothing is written anywhere; the runner is thrown away.
# The V2 database (ADR-030, #1043) is restored and row-counted too, when the backup has one.
#
# Monthly + on demand. A backup that was never restored is a hope, not a backup.
#
# On demand only, `etl_rehearsal: true` then rehearses the legacy → V2 ETL on the restored pair
# (docs/03-ops/v2-etl.md; M3.5, #1030): dry run → real run → validate-etl → re-run (0 writes) →
# validate again, all on this runner. The step summary carries timings, counts and check names; ids
# are masked (public repo: run logs and summaries are public), no text is ever printed.

on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of the month, after the nightly backup
  workflow_dispatch:
    inputs:
      etl_rehearsal:
        description: 'After the drill, rehearse etl-v2 on the restored pair (M3.5)'
        type: boolean
        default: false
      snapshot:
        description: 'restic id of a /db.sql snapshot (storage and V2 from the same night); empty = latest'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    # inputs is empty on the schedule: 45.
    timeout-minutes: ${{ inputs.etl_rehearsal && 150 || 45 }}
    services:
      db:
        # Same image as prod: the schema still creates the `vector` extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: drill
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U drill -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PGPASSWORD: drill
      PSQL: psql -h 127.0.0.1 -U drill -d drill -v ON_ERROR_STOP=1 -qAt
      RESTORE: /tmp/restore
    steps:
      # database/v2: run.sh creates the scratch V2 database, the migrations name its tables.
      # backend: only the ETL rehearsal builds it (a few MB; simpler than a second checkout).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            database
            backend
          persist-credentials: false

      - name: Install restic + psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic postgresql-client >/dev/null
          restic version

      - name: Snapshots in R2
        run: |
          restic snapshots --compact

      # A pinned /db.sql snapshot: storage (/backup, sent just before it) and V2 (/db_v2.sql, just after)
      # are the snapshots of their path closest in time, within 6 h. Unpinned, every step reads latest.
      - name: Resolve pinned snapshot
        if: inputs.snapshot
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          set -euo pipefail
          [[ "$SNAPSHOT" =~ ^[0-9a-f]{8,64}$ ]] || { echo "::error::snapshot must be a restic id (hex)"; exit 1; }
          snap=$(restic snapshots --json "$SNAPSHOT")
          [ "$(jq -r '.[0].paths | index("/db.sql") != null' <<<"$snap")" = true ] \
            || { echo "::error::$SNAPSHOT is not a /db.sql snapshot"; exit 1; }
          db=$(date -d "$(jq -r '.[0].time' <<<"$snap")" +%s)
          # "<seconds apart> <id>" of the snapshot of path $1 closest to the dump; nothing if it has none.
          closest() {
            restic snapshots --path "$1" --json | jq -r '.[] | "\(.time) \(.id)"' | while read -r t id; do
              d=$(( $(date -d "$t" +%s) - db )); echo "${d#-} $id"
            done | sort -n | head -n 1
          }
          read -r fd fid <<<"$(closest /backup)" || true
          [ -n "${fid:-}" ] && [ "$fd" -le 21600 ] || { echo "::error::no /backup snapshot within 6 h of $SNAPSHOT"; exit 1; }
          read -r vd vid <<<"$(closest /db_v2.sql)" || true
          [ -n "${vid:-}" ] && [ "$vd" -le 21600 ] || vid=none
          echo "db $SNAPSHOT, storage $fid, v2 $vid"
          { echo "DB_SNAP=$SNAPSHOT"; echo "FILES_SNAP=$fid"; echo "V2_SNAP=$vid"; } >> "$GITHUB_ENV"

      - name: Restore database (timed)
        run: |
          set -euo pipefail
          start=$(date +%s)
          # Roles the dump references; the dump owner is the prod user.
          $PSQL -c "CREATE ROLE textstack_prod" >/dev/null
          # Current format: the dump as plain SQL via stdin (/db.sql, since #700). Before that it
          # was /backup/db.sql.gz inside the storage snapshot — still restorable, so still checked.
          if restic snapshots --path /db.sql --json | grep -q '"id"'; then
            echo "restoring /db.sql"
            # Hashed on the way in: the ETL rehearsal records it as the run's source_dump_sha.
            mkfifo /tmp/db.fifo
            sha256sum < /tmp/db.fifo | cut -c1-64 > /tmp/db.sql.sha256 & hasher=$!
            restic dump --path /db.sql "${DB_SNAP:-latest}" /db.sql | tee /tmp/db.fifo | $PSQL >/dev/null
            wait "$hasher"
          else
            echo "no /db.sql snapshot yet — restoring /backup/db.sql.gz"
            restic dump --path /backup "${FILES_SNAP:-latest}" /backup/db.sql.gz | gunzip | $PSQL >/dev/null
          fi
          echo "DB_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Database is complete
        run: |
          set -euo pipefail
          read -r tables users editions chapters progress vocab userbooks <<<"$($PSQL -F' ' -c "
            SELECT (SELECT count(*) FROM information_schema.tables WHERE table_schema='public'),
                   (SELECT count(*) FROM users), (SELECT count(*) FROM editions),
                   (SELECT count(*) FROM chapters), (SELECT count(*) FROM reading_progresses),
                   (SELECT count(*) FROM vocabulary_words), (SELECT count(*) FROM user_books)")"
          echo "tables=$tables users=$users editions=$editions chapters=$chapters progress=$progress vocab=$vocab user_books=$userbooks"
          # Floors well below today's numbers: catch a truncated/empty dump, not normal churn.
          [ "$tables" -ge 50 ] && [ "$editions" -ge 1000 ] && [ "$chapters" -ge 10000 ] && [ "$users" -ge 10 ] \
            || { echo "::error::restored database looks truncated"; exit 1; }
          newest=$($PSQL -c "SELECT max(updated_at) FROM reading_progresses")
          echo "newest reading progress in the backup: $newest"

      - name: Restore storage + .env (timed)
        run: |
          set -euo pipefail
          start=$(date +%s)
          restic restore "${FILES_SNAP:-latest}" --path /backup --target "$RESTORE"
          echo "FILES_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "storage: $(find "$RESTORE/backup/storage" -type f | wc -l) files, $(du -sh "$RESTORE/backup/storage" | cut -f1)"

      - name: Files the database points at exist
        run: |
          set -euo pipefail
          S="$RESTORE/backup/storage"
          total=0; missing=0
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            total=$((total + 1))
            [ -f "$S/$p" ] || { missing=$((missing + 1)); [ $missing -le 5 ] && echo "missing: $p"; }
          done < <($PSQL -c "SELECT cover_path FROM editions WHERE cover_path IS NOT NULL ORDER BY random() LIMIT 200")
          echo "edition covers checked: $total, missing: $missing"
          [ "$total" -gt 0 ] || { echo "::error::no cover paths to check"; exit 1; }
          # A few may legitimately be gone (deleted after the dump); most missing = broken backup.
          [ $((missing * 10)) -le "$total" ] || { echo "::error::more than 10% of covers missing"; exit 1; }

      - name: .env is present (names only, never values)
        run: |
          set -euo pipefail
          E="$RESTORE/backup/env"
          [ -s "$E" ] || { echo "::error::.env missing from the backup"; exit 1; }
          for k in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB JWT_SECRET OPENAI_API_KEY; do
            grep -q "^$k=." "$E" && echo "$k: set" || { echo "::error::$k missing in backed-up .env"; exit 1; }
          done

      # V2: backup.yml sends /db_v2.sql to R2 only when textstack_v2 existed that night. No such
      # snapshot = "no V2 in this backup": fine while the backed-up .env has FEATURES_V2API off (V2 is
      # empty by design), a failure when it is on (the Api serves V2 data that no backup holds).
      # Counted: every table a migration in the restored ledger creates, read from that migration.
      - name: Restore + count V2 database (timed)
        env:
          PGHOST: 127.0.0.1
          PGUSER: drill
          PGDATABASE: textstack_v2
        run: |
          set -euo pipefail
          # As the Api's binder reads it: True/true, quoted or not.
          flag=off
          grep -qiE '^FEATURES_V2API="?true"?[[:space:]]*$' "$RESTORE/backup/env" && flag=on
          if [ "${V2_SNAP:-}" = none ] || ! restic snapshots --path /db_v2.sql --json | grep -q '"id"'; then
            if [ "$flag" = on ]; then
              echo "::error::FEATURES_V2API=true in the backed-up .env, but no V2 dump in R2"; exit 1
            fi
            echo "no V2 in this backup (FEATURES_V2API off)"
            echo "V2_RESULT=no V2 in this backup" >> "$GITHUB_ENV"; exit 0
          fi
          # A nightly V2 dump failing for weeks still leaves an old /db_v2.sql as "latest". Older than the
          # legacy dump by more than a day: an alarm with the flag on, a warning with it off.
          newest() { restic snapshots --path "$1" --json | grep -o '"time":"[^"]*"' | cut -d'"' -f4 | sort | tail -n 1; }
          legacy_t=$(newest /db.sql); v2_t=$(newest /db_v2.sql)
          if [ -n "$legacy_t" ]; then
            lag=$(( $(date -d "$legacy_t" +%s) - $(date -d "$v2_t" +%s) ))
            if [ "$lag" -gt 86400 ]; then
              msg="V2 snapshot ($v2_t) is $((lag / 3600))h older than the legacy one ($legacy_t)"
              [ "$flag" = on ] && { echo "::error::$msg"; exit 1; }
              echo "::warning::$msg; FEATURES_V2API off"
            fi
          fi
          start=$(date +%s)
          sh database/v2/run.sh create
          restic dump --path /db_v2.sql "${V2_SNAP:-latest}" /db_v2.sql | psql -X -q -v ON_ERROR_STOP=1 >/dev/null
          secs=$(( $(date +%s) - start ))
          n=0
          for v in $(psql -XAt -c "SELECT lpad(version::text, 4, '0') || '_' || name FROM schema_migrations ORDER BY version"); do
            for t in $(grep -o 'CREATE TABLE public\.[a-z0-9_]*' "database/v2/migrations/$v.up.sql" | cut -d. -f2); do
              # Not inside echo: echo's status would hide a table the dump never created.
              c=$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.$t") || exit 1
              echo "$t: $c"
              n=$((n + 1))
            done
          done
          [ "$n" -gt 0 ] || { echo "::error::restored V2 database has no migrated tables"; exit 1; }
          echo "V2_RESULT=${secs}s, $n tables counted" >> "$GITHUB_ENV"

      - name: Recovery time
        run: |
          echo "### Restore drill passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- database restore: ${DB_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- storage + .env restore: ${FILES_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- V2 database: ${V2_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "DB ${DB_SECONDS}s, files ${FILES_SECONDS}s"

      # ---- ETL rehearsal (M3.5, #1030): on demand only, on the pair restored above ----

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: inputs.etl_rehearsal
        with:
          dotnet-version: '10.0.x'

      - name: 'ETL rehearsal: build the Api (timed)'
        if: inputs.etl_rehearsal
        run: |
          set -euo pipefail
          start=$(date +%s)
          dotnet build backend/src/Api -c Release -o /tmp/api -v quiet -nologo
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # The runbook's preflight (docs/03-ops/v2-etl.md §1) on the restored legacy copy: the SELECT-only
      # etl_reader (its password is this throwaway service's, as drill's is), PUBLIC's large-object
      # EXECUTE revoked. Then V2 at this checkout's head: the restored V2 copy when the backup has one
      # (the cutover's target), else an empty database; run.sh up creates it either way.
      - name: 'ETL rehearsal: source role, V2 schema'
        if: inputs.etl_rehearsal
        env:
          ETL_READER_PASSWORD: drill
        run: |
          set -euo pipefail
          $PSQL -f database/scripts/etl-reader.sql
          $PSQL <<'SQL'
          DO $$
          DECLARE f regprocedure;
          BEGIN
            FOR f IN SELECT p.oid::regprocedure FROM pg_proc p
                     WHERE p.pronamespace = 'pg_catalog'::regnamespace AND (p.proname LIKE 'lo\_%' OR p.proname IN ('loread', 'lowrite'))
                       AND has_function_privilege('public', p.oid, 'EXECUTE')
            LOOP
              EXECUTE format('REVOKE EXECUTE ON FUNCTION %s FROM PUBLIC', f);
            END LOOP;
          END $$;
          SQL
          PGHOST=127.0.0.1 PGUSER=drill PGDATABASE=textstack_v2 sh database/v2/run.sh up
          mkdir -p /tmp/library

      # dry run → run → validate (exit 0) → re-run (0 rows inserted/updated in its ledger row) → validate.
      # The JSON reports and validate's rows stay in files on the runner. Summary and log get timings,
      # counts, check names and statuses only: every uuid is masked (public repo, public run pages),
      # report lines are grouped by kind with their numbers folded, nothing prints text or emails.
      - name: 'ETL rehearsal: dry run, run, validate, re-run, validate (timed)'
        if: inputs.etl_rehearsal
        env:
          # Env, never argv (etl-v2 refuses a password there). The throwaway service's credentials.
          ConnectionStrings__Default: Host=127.0.0.1;Database=drill;Username=etl_reader;Password=drill
          ConnectionStrings__V2: Host=127.0.0.1;Database=textstack_v2;Username=drill;Password=drill
          Storage__RootPath: /tmp/restore/backup/storage
          Storage__LibraryRoot: /tmp/library
          # The ETL has no business with the R2 credentials.
          RESTIC_REPOSITORY: ''
          RESTIC_PASSWORD: ''
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
        run: |
          set +e -uo pipefail
          OUT=/tmp/etl; mkdir -p "$OUT"
          S="$GITHUB_STEP_SUMMARY"
          V2PSQL="psql -X -h 127.0.0.1 -U drill -d textstack_v2 -v ON_ERROR_STOP=1 -qAt"
          UUID='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          mask() { sed -E "s/$UUID/<id>/g; s/[^[:space:]|(]+@[^[:space:]|)]+/<email>/g; s/(<id>[ ,;\/]*){2,}/<id>… /g"; }
          fail() { echo "::error::$1"; echo -e "\n**FAILED: $1**" >> "$S"; exit 1; }
          dump_sha=$(cat /tmp/db.sql.sha256 2>/dev/null)
          sha_arg=(); [[ "$dump_sha" =~ ^[0-9a-f]{64}$ ]] && sha_arg=(--source-dump-sha "$dump_sha")
          {
            echo "### ETL rehearsal"
            echo "- snapshot: ${DB_SNAP:-latest} (storage ${FILES_SNAP:-latest}, V2 ${V2_SNAP:-latest}); dump sha256 ${dump_sha:--}"
            echo "- build: ${BUILD_SECONDS}s"
            echo
            echo "| phase | seconds | exit |"
            echo "|---|---|---|"
          } >> "$S"
          # phase <name> <cmd…>: stdout to $OUT/<name>.out, stderr masked to the log; a timed row in the summary.
          phase() {
            local name=$1 start rc; shift
            start=$(date +%s)
            "$@" > "$OUT/$name.out" 2> >(mask >&2); rc=$?
            echo "| $name | $(( $(date +%s) - start )) | $rc |" >> "$S"
            echo "$name: exit $rc"
            return $rc
          }
          etl() { dotnet /tmp/api/Api.dll etl-v2 "$@"; }
          run_id() { jq -r '.runId // empty' "$OUT/$1.out" 2>/dev/null | grep -xE "$UUID"; }
          # One run's ledger row, counts and writes per table, failed checks, report lines grouped by kind.
          report() {
            local name=$1 f="$OUT/$1.out" id
            jq -e . "$f" >/dev/null 2>&1 || { echo -e "\n#### $name: no JSON report" >> "$S"; return; }
            id=$(run_id "$name")
            {
              echo; echo "#### $name"
              [ -n "$id" ] && $V2PSQL -F' · ' -c "SELECT 'ledger: ' || COALESCE(outcome, 'unfinished'),
                  'validation_failures ' || COALESCE(validation_failures::text, '-'),
                  round(extract(epoch FROM finished_at - started_at)) || 's',
                  'source_dump_sha ' || COALESCE(left(source_dump_sha, 12), '-')
                FROM migration_runs WHERE id = '$id'"
              echo; echo "| table | source | target | inserted | updated | unchanged |"; echo "|---|---|---|---|---|---|"
              jq -r '. as $r | [($r.sourceCounts // {} | keys), ($r.targetCounts // {} | keys), ($r.writes // {} | keys)] | add | unique[]
                | "| \(.) | \($r.sourceCounts[.] // "-") | \($r.targetCounts[.] // "-") | \($r.writes[.].inserted // "-") | \($r.writes[.].updated // "-") | \($r.writes[.].unchanged // "-") |"' "$f"
              echo; echo "checks: $(jq '.checks | length' "$f") ran; failed: $(jq -r '[.checks[] | select(.failures > 0) | "\(.name) (\(.failures))"] | if length == 0 then "none" else join("; ") end' "$f")"
              for k in orphanCandidates cleanupActions; do
                echo; echo "$k: $(jq ".${k} | length" "$f")"; echo
                jq -r ".${k}[]" "$f" | mask | sed -E 's/\b[0-9]+\b/<n>/g' | sort | uniq -c | sort -rn | head -n 40 | sed -E 's/^ *([0-9]+) /- \1 × /'
              done
            } | mask >> "$S"
          }
          # validate-etl as the run's source login; exit 0 = no FAIL row. Rows to the summary, masked.
          validate() {
            local name=$1 rc
            phase "$name" psql -X -qAt -F $'\t' -h 127.0.0.1 -U etl_reader -d drill \
              -v v2='host=127.0.0.1 dbname=textstack_v2 user=drill' -f database/v2/scripts/validate-etl.sql
            rc=$?
            { echo; echo "#### $name (exit $rc)"; echo; echo "| check | status | details |"; echo "|---|---|---|"
              grep $'\t' "$OUT/$name.out" | mask \
                | awk -F'\t' '{ d = substr($3, 1, 300); gsub(/\|/, "/", d); printf "| %s | %s | %s |\n", $1, $2, d }'; } >> "$S"
            return $rc
          }

          phase dry-run etl --dry-run; rc=$?; report dry-run
          [ $rc -eq 0 ] || fail "etl-v2 --dry-run exited $rc"
          phase run etl "${sha_arg[@]}"; rc=$?; report run
          [ $rc -eq 0 ] || fail "etl-v2 run exited $rc"
          validate validate || fail "validate-etl after the run failed"
          phase re-run etl "${sha_arg[@]}"; rc=$?; report re-run
          [ $rc -eq 0 ] || fail "etl-v2 re-run exited $rc"
          id=$(run_id re-run)
          [ -n "$id" ] || fail "the re-run's report names no run id"
          read -r n w <<<"$($V2PSQL -F' ' -c "SELECT count(*), COALESCE(sum((v ->> 'Inserted')::bigint + (v ->> 'Updated')::bigint), 0)
            FROM migration_runs r, jsonb_each(r.validation -> 'writes') e(k, v) WHERE r.id = '$id'")"
          echo -e "\nre-run ledger: ${n:-?} targets, ${w:-?} rows inserted or updated" >> "$S"
          [ "${n:-0}" -gt 0 ] && [ "${w:-1}" -eq 0 ] || fail "the re-run wrote ${w:-?} row(s) (ledger: ${n:-0} targets)"
          validate validate-again || fail "validate-etl after the re-run failed"
          echo -e "\n**ETL rehearsal passed**: dry run → run → validate exit 0 → re-run 0 writes → validate exit 0" >> "$S"
