name: CI

on:
  pull_request:
    branches: [main]
  # Also on a push to the bot's own branches. A pull request opened by
  # `peter-evans/create-pull-request` under GITHUB_TOKEN fires no
  # `pull_request` event — by design, so a workflow cannot trigger itself into
  # a loop — so the four required contexts never appeared and every
  # deps-refresh PR sat BLOCKED with nothing to run. The checks land on the
  # head SHA either way, which is all branch protection reads. Only
  # `mobile-runtime` is PR-only (it diffs against the base) and the catalog
  # lane already reports the fingerprint itself.
  push:
    branches: ['deps/**']
  workflow_call:
    inputs:
      scope:
        description: >-
          `full` (the default, and what a pull request gets) or `merged-tree`.
          See the note below.
        type: string
        default: full

# **Two scopes, because deploy.yml was running this entire file a second time.**
#
# Every merge used to pay for the whole suite twice: once on the pull request,
# then again inside `deploy.yml`, which calls this workflow before shipping —
# and then the server rebuilt the images itself anyway (`up -d --build`), so
# even the docker job was built twice over. Thirty minutes of deploy, most of it
# re-proving what the pull request had just proved.
#
# What the second run genuinely adds is narrow: branch protection here is
# `strict: false`, so a pull request may have been tested against a base older
# than main's tip. The insurance worth buying is "does the MERGED tree still
# compile and pass its tests" — which is `backend` and `frontend`. The rest
# either does not affect what gets deployed (`mobile`, `mobile-runtime`,
# `extension`), or re-does work the server repeats (`docker`), or re-asks a
# question whose answer cannot change by merging (`node-version`,
# `advisories`).
#
# So `scope: merged-tree` runs those two (and `reader`, split out of `frontend`, in parallel). `e2e` is the deliberate omission and
# the one with a real cost: a regression only it catches would reach production
# without it having run on the exact merged tree. It ran on the pull request's
# head, and with one merge at a time the difference between the two is the
# previous merge. That is the trade, stated rather than discovered.
#
# Opt JS actions into Node 24 ahead of June 2026 forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# A new push to a pull request cancels the run it makes obsolete. Everything else
# — the `deps/**` push and above all the `merged-tree` call from deploy.yml — is
# keyed on its own run id, so it shares a group with nothing and is never
# cancelled (a group also drops older *pending* runs, so keying a deploy's call on
# the ref would not be safe even with cancel-in-progress off).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job carries `timeout-minutes`, and the comment above each one is what it
# actually takes, measured. None of them had a ceiling until a hung `mobile-runtime`
# on a Dependabot PR ran for six hours — GitHub's default — and was billed for all
# six. The numbers are deliberately loose: a ceiling is there to end a hang, not to
# police a slow run, so a job that trips one is reporting a hang, not a bad estimate.
# Read-only by default; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  # Which areas a pull request touches, so the expensive jobs can sit out the ones
  # they cannot be affected by. A docs-only PR used to pay the full 12 minutes.
  #
  # Pull requests only. On the `deps/**` push and the `merged-tree` call this job
  # is skipped, and every job below treats "changes did not succeed" as "run" —
  # so those paths behave exactly as before, and so does a PR whose diff this
  # step fails to read (fail open: a broken filter costs time, never coverage).
  #
  # Required checks: backend, frontend, docker and e2e are required (reader should be too: it holds
  # the V2 reader gates that were in frontend), and a job
  # skipped by its own `if:` reports success to branch protection. That is also
  # true of a job skipped because a job it `needs` FAILED — which is why every
  # `if:` below starts with `!cancelled()` and the fail-open clause: without them
  # a broken `changes` job would skip all four and let the PR merge green.
  #
  # Areas: `docs/**`, `tools/docs-site/**` (the docs site, #1275) and root-level *.md touch nothing. Markdown INSIDE a code
  # directory is that directory's (Application embeds ChapterReview/ReviewMethod.md;
  # the MCP package ships its README). Anything shared or unrecognised —
  # packages/, tools/, infra/scripts/, .github/, root package/lock files, .nvmrc — is
  # everything. Except in .github/: other workflows, issue forms, its *.md pages,
  # release.yml and dependabot.yml touch nothing (node-version and area-label still
  # read workflows and release.yml, and they always run).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # ~5s.
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      web: ${{ steps.areas.outputs.web }}
      mobile: ${{ steps.areas.outputs.mobile }}
      extension: ${{ steps.areas.outputs.extension }}
      reader: ${{ steps.areas.outputs.reader }}
      docs: ${{ steps.areas.outputs.docs }}
    steps:
      # A pull_request checkout is GitHub's merge commit; its first parent is the
      # base tip. Depth 2 is both commits and nothing more.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: areas
        run: |
          set -euo pipefail
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          backend=false web=false mobile=false extension=false reader=false docs=false
          everything() { backend=true web=true mobile=true extension=true reader=true docs=true; }
          [ -n "$files" ] || everything
          while IFS= read -r f; do
            # Not an area of its own: the `reader` gates' inputs inside an area (everything() covers the
            # runtime: .nvmrc, root package files, tools/, infra/scripts/, unknown paths). The committed page, its frame and pin
            # live in v2reader/; a packages/ change to the page lands there regenerated, or the drift check in
            # `frontend` fails. Plus the nginx CSP, the fixtures the checks read, and the Playwright version.
            case "$f" in
              packages/reader/*|apps/mobile/src/lib/reader/*|apps/mobile/assets/fonts/*|apps/web/e2e/fixtures/v2-sync.epub|infra/nginx/*|apps/web/package.json|pnpm-lock.yaml|.github/workflows/ci.yml) reader=true ;;
            esac
            case "$f" in
              '') ;;
              # Working notes and Claude Code guides: hidden from the site, read by no build or test.
              docs/internal/*|.claude/*|*/CLAUDE.md) ;;
              docs/*|tools/docs-site/*) docs=true ;;
              # Another workflow, a form, a repo page: no job here builds or tests it.
              # ci.yml itself stays everything, and so do the compose overrides.
              .github/workflows/ci.yml) everything ;;
              .github/workflows/*|.github/ISSUE_TEMPLATE/*|.github/*.md|.github/release.yml|.github/dependabot.yml) ;;
              backend/*|database/*|tests/*|*.sln|Directory.*.props|NuGet.Config|global.json|docker-compose*.yml) backend=true ;;
              apps/web/*|apps/admin/*) web=true ;;
              apps/mobile/*) mobile=true ;;
              apps/browser-extension/*) extension=true ;;
              */*) everything ;;
              *.md) ;;
              *) everything ;;
            esac
          done <<< "$files"
          {
            echo "backend=$backend"
            echo "web=$web"
            echo "mobile=$mobile"
            echo "extension=$extension"
            echo "reader=$reader"
            echo "docs=$docs"
          } | tee -a "$GITHUB_OUTPUT"

  # Cheapest job in the file and the one that would have saved the most time:
  # an EAS workflow pinned to Node 20 could not install eas-cli 23, and finding
  # that out cost two round trips. See tools/checks/check-node-version.mjs.
  node-version:
    if: inputs.scope != 'merged-tree'
    runs-on: ubuntu-latest
    # 6s typical.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # This job installs nothing — it runs one plain Node script. Leave the
          # cache off: setup-node reads `packageManager` from the root
          # package.json, decides it should prime a pnpm cache, and fails with
          # "Unable to locate executable file: pnpm" in a job that has no reason
          # to have pnpm at all.
          package-manager-cache: false
      - run: node tools/checks/check-node-version.mjs

  # A moved or renamed doc must not leave a dead link behind (#1237). Every
  # relative link in every tracked .md file has to point at a file that exists.
  docs-links:
    if: inputs.scope != 'merged-tree'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # One plain Node script, no install (same reason as node-version).
          package-manager-cache: false
      - run: node tools/checks/check-doc-links.mjs

  # The docs site (#1275) builds from docs/ with the tooling in tools/docs-site/. A page that
  # breaks the build (a bad link target, a diagram the loader chokes on) fails here,
  # not at publish time.
  docs-site:
    needs: changes
    if: ${{ !cancelled() && inputs.scope != 'merged-tree' && (needs.changes.result != 'success' || needs.changes.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # tools/docs-site/ is not a workspace member: its own lockfile, nothing shared with the apps.
      - name: Install
        working-directory: tools/docs-site
        run: pnpm install --ignore-workspace --frozen-lockfile
      - name: Build
        working-directory: tools/docs-site
        env:
          DOCS_BASE: /textstack
        run: pnpm build

  # The extension has no build step and no package.json, so nothing else in this
  # file would ever look at it. Its README documented a check and asked a person
  # to remember it; nothing ran it, and it could not have failed if it had.
  extension:
    needs: changes
    if: ${{ !cancelled() && inputs.scope != 'merged-tree' && (needs.changes.result != 'success' || needs.changes.outputs.extension == 'true') }}
    runs-on: ubuntu-latest
    # 12s typical.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Same reason as above: one plain Node script, no install, and the
          # pnpm cache priming would fail in a job with no pnpm.
          package-manager-cache: false
      - run: node tools/checks/check-extension.mjs

  # Dependabot alerts were disabled on this repository for its whole life, which
  # is how a patched dompurify sat available for months while the vulnerable one
  # shipped to every visitor. They are on now — and a setting somebody can switch
  # off is not a check, so this asks the same question here, where turning it off
  # is a diff. See tools/checks/check-advisories.mjs.
  advisories:
    if: inputs.scope != 'merged-tree'
    runs-on: ubuntu-latest
    # Under a second in practice. The ceiling is low on purpose: this job used to
    # sit for ten minutes while `pnpm audit` declined to exit, and a ten-minute
    # wait for no information is the shape of failure worth making impossible.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No pnpm. The check reads pnpm-lock.yaml itself and asks the npm registry
      # directly, so there is no package manager in this lane at all — which is
      # the point: it cannot be broken by one.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Nothing is installed here; the lockfile is the input.
          package-manager-cache: false
      - run: node tools/checks/check-advisories.mjs

  backend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    # 5m typical.
    timeout-minutes: 20
    services:
      postgres:
        # pgvector image (stock pg16 + vector ext): the baseline migration runs
        # CREATE EXTENSION vector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: books
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # The JS half of this question is tools/checks/check-advisories.mjs; this is the
      # .NET half, and it is free here because restore has already run. Currently
      # clean across every project — cheap to keep that way, and the command
      # reports success without failing, so the grep is what makes it a gate.
      - name: Vulnerable packages
        run: |
          set -euo pipefail
          out=$(dotnet list package --vulnerable --include-transitive)
          echo "$out"
          if echo "$out" | grep -qE '^\s+> '; then
            echo "::error::A dependency has a known advisory. See the listing above."
            exit 1
          fi

      - name: Lint (format check)
        run: dotnet format --no-restore --verify-no-changes

      # textstack_v2's runner and every migration on scratch databases: up, down one version deeper
      # per pass then up again (database/README.md). Run in the postgres image, so psql/pg_dump
      # match the server and `sh` is a strict POSIX shell (dash), as close to the migrator's busybox as ubuntu gets.
      - name: Migrations round trip
        run: >-
          docker run --rm --network host -v "$PWD/database:/database:ro"
          -e PGHOST=localhost -e PGUSER=app -e PGPASSWORD=changeme -e PGDATABASE=books
          pgvector/pgvector:pg16 sh /database/tests/roundtrip.sh

      # Dapper repositories against real Postgres (ADR-028): Testcontainers starts its own
      # pgvector:pg16 and builds the schema with database/run.sh. Uses the runner's Docker.
      - name: Persistence tests
        run: dotnet test tests/TextStack.Persistence.Tests --no-build

      # MCP over-the-wire integration suite (AI-053) — hermetic (loopback only, no
      # Postgres/Docker). In the solution, so --no-build reuses the Build step above.
      - name: MCP integration tests
        run: dotnet test tests/TextStack.Ai.Mcp.Tests --no-build

      - name: Unit tests
        run: dotnet test tests/TextStack.UnitTests --no-build

      # Deterministic eval-runner paths on fake LLMs. The live MEAI evals skip
      # themselves without OPENAI_API_KEY (not set in CI) / a reachable Ollama.
      - name: AI eval tests
        run: dotnet test tests/TextStack.AiEvals --no-build

      # AI-051: keep the MCP global-tool packaging green (no publish, no secret).
      # Owner publishes manually via `dotnet nuget push` with their nuget.org key.
      - name: Pack MCP global tool
        run: dotnet pack backend/src/Ai/TextStack.Ai.Mcp -c Release

      # See the same step in `frontend`. Free here: restore has already run, and
      # `dotnet list package --outdated` reads the assets file it wrote.
      - name: Drift report
        run: node tools/dependencies/report-drift.mjs nuget

  frontend:
    # Mobile too: this job drift-checks the reader bundles generated into apps/mobile.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    # 1m45 typical.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version here — pnpm/action-setup reads `packageManager` from the
      # root package.json, so CI, Docker and developers use the same one.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # One install for the whole workspace. Each app used to install from its
      # own lockfile; there is one lockfile now, and `catalog:` only resolves
      # with pnpm-workspace.yaml in scope.
      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter textstack-web build

      # Vitest was never wired into CI — the job built the app and stopped, so a
      # failing web unit test merged to main unnoticed.
      - name: Web unit tests
        working-directory: apps/web
        run: pnpm test

      # Same gap, one level up: apps/web's vitest config is rooted at apps/web,
      # so the ~380 tests in packages/shared were reachable only through a root
      # `pnpm -r test` that nothing ran. That package is the auth client, the
      # progress maths and the resume logic for BOTH web and mobile.
      - name: Shared package unit tests
        working-directory: packages/shared
        run: pnpm test

      # And it had no `typecheck` script at all, so root `pnpm -r typecheck`
      # skipped it silently — which is how four type errors sat in its test
      # fixtures unnoticed. Running the tests without this would guard the
      # behaviour of a package whose types nothing checks.
      - name: Shared reader unit tests
        run: pnpm --filter @textstack/reader test

      - name: Shared reader typecheck
        run: pnpm --filter @textstack/reader typecheck

      - name: Shared package typecheck
        working-directory: packages/shared
        run: pnpm typecheck

      # ADR-029: the V2 reader page is pinned foliate-js + patches/ + page.mjs. Clones the pin, so a
      # patch that no longer applies fails here too.
      - name: Drift-check V2 reader page
        working-directory: apps/web
        run: pnpm check:reader

      - name: Build admin
        run: pnpm --filter textstack-admin build

      # Repository tools have their own tests and no vitest project would otherwise find
      # them — the web config's include does not reach outside apps/web, so
      # without this step they exist and never run. They cover the semiannual
      # dependency job, which edits pnpm-workspace.yaml and
      # Directory.Packages.props unattended.
      - name: Repo script tests
        run: pnpm test:scripts

      # The deploy's web swap (deploy.yml "Put web bundle live"): fake dists, two
      # releases, a reader racing the swap. Plus backup.yml's files archive.
      - name: Web swap self-check
        run: |
          bash infra/scripts/swap-web-dist.test.sh
          bash infra/scripts/backup-files-tar.test.sh

      # A gauge, not a gate — it cannot fail the build. The bump lane runs twice
      # a year now (deps-refresh.yml), and a calendar that quiet needs something
      # in between it, or the first sign that a minor became a major is a January
      # pull request nobody can review. Free here: the workspace is installed.
      - name: Drift report
        run: node tools/dependencies/report-drift.mjs js

  # The V2 reader page's gates, beside `frontend` rather than inside it: they need only the workspace and Chromium
  # (no build), and run only when what they read changed (reader), or on push to main.
  reader:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.reader == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version here — pnpm/action-setup reads `packageManager` from the
      # root package.json, so CI, Docker and developers use the same one.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # One install for the whole workspace. Each app used to install from its
      # own lockfile; there is one lockfile now, and `catalog:` only resolves
      # with pnpm-workspace.yaml in scope.
      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # Chromium for the checks below, installed exactly as the e2e job does (same cache key).
      - name: Get Playwright version
        id: pw-version
        working-directory: apps/web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      # See the e2e job: install-deps' apt-get update fails hard on these unneeded repositories.
      - name: Drop apt repositories Playwright does not need
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list

      - name: Install Playwright Chromium
        if: ${{ steps.pw-cache.outputs.cache-hit != 'true' }}
        working-directory: apps/web
        run: pnpm exec playwright install chromium

      # See the e2e job: best-effort, an apt/DNS outage must not turn the job red by itself.
      - name: Install Playwright system deps (best-effort)
        continue-on-error: true
        timeout-minutes: 1
        run: pnpm -C apps/web exec playwright install-deps chromium

      # ADR-029 Decision 6: the V2 reader page's CSP holds against the hostile EPUB, MOBI and FB2, and
      # the check fails when any directive is removed. Needs only Chromium (no API); ~90s (CI and locally).
      - name: V2 reader sandbox — gates the PR
        working-directory: apps/web
        run: pnpm check:reader-sandbox

      # #1128: one small book per format opens as README "Formats" says (lazy readers, CBZ, PDF, refusals, hostile PDF). ~10s locally (was 280–580s in CI at 771 rows).
      - name: V2 reader formats — gates the PR
        working-directory: apps/web
        run: pnpm check:reader-formats

      # #1219: the web host's frame document (frame.mjs) works under the app CSP read from
      # infra/nginx/textstack.conf (a change there runs this job); srcdoc, header-less, foreign-framed and unfilled stay refused. ~10s.
      - name: V2 reader prod CSP — gates the PR
        working-directory: apps/web
        run: pnpm check:reader-prod-csp

  # apps/mobile gets its own job rather than another step in `frontend` because it
  # installs and checks a different app, not because it uses a different package
  # manager — it is a pnpm workspace member with eight `catalog:` specifiers and no
  # lockfile of its own, which is why the steps below are `pnpm --filter mobile`.
  # (This comment used to claim npm and a local lockfile; the job it introduces has
  # contradicted that ever since #514 moved mobile into the workspace.)
  # @textstack/shared is
  # consumed from source via Metro watchFolders + tsconfig paths, so the checkout
  # already carries it and only the app's own deps need installing.
  #
  # Not covered here: e2e. apps/mobile/e2e is Playwright driving the Expo *web*
  # build in a Pixel-sized viewport — it exercises no native code path, so running
  # it in CI would buy confidence it cannot actually provide.
  mobile:
    needs: changes
    if: ${{ !cancelled() && inputs.scope != 'merged-tree' && (needs.changes.result != 'success' || needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    # 1m10 typical.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter mobile typecheck

      - name: Unit tests
        run: pnpm --filter mobile test

      # Expo pins a set of package versions it has tested together, and nothing
      # in CI knew about it. Dependabot proposed react-native 0.87.1 against an
      # SDK that expects 0.83.10, expo-splash-screen from a different SDK
      # entirely, and a webview major the SDK does not ship — all with green
      # type checks and green unit tests, because tsc does not know what an SDK
      # compatibility matrix is. The version catalog had also quietly moved
      # react past Expo's pin.
      #
      # `--check` fails on a version mismatch. It is the check that turns "the
      # tests pass" into "and the app is built out of parts that were tested
      # together". @sentry/react-native is deliberately ahead and recorded in
      # expo.install.exclude.
      #
      # Wrapped so that a PATCH lag is a warning, not a failure: Expo ships
      # patches constantly, and the fix `--check` demands moves the OTA runtime
      # fingerprint — against the twice-a-year policy. Minor/major drift and
      # output it can't read still fail. See tools/checks/check-expo-alignment.mjs.
      - name: Expo SDK version alignment
        working-directory: apps/mobile
        run: node ../../tools/checks/check-expo-alignment.mjs

      # tsc and unit tests both passed while the app could not be bundled at
      # all — a broken import or a bad module resolution only surfaces when
      # Metro walks the graph. This is the cheapest step that would have
      # caught it, and it is the same command that produces an OTA payload.
      - name: Bundle (Metro)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/ci-bundle

      # expo, react-native and react are excluded from every bump lane — they
      # decide the OTA runtime fingerprint — so nothing would ever mention how
      # far behind they are. This says it, along with the only dependency drift
      # that carries a deadline and a consequence: Play's required target API.
      - name: Drift report
        run: node tools/dependencies/report-drift.mjs mobile

  # Does this change still ship as an OTA, or does it need a Play build?
  #
  # mobile-ota.yml already refuses to publish into a runtime nobody is running,
  # and that guard works — but it runs after the merge, so it tells the person
  # who can no longer avoid it. Asked here, the answer still changes a decision.
  #
  # Its own job because it checks out and installs twice, and only when
  # something that can move a fingerprint has changed.
  mobile-runtime:
    runs-on: ubuntu-latest
    # 12s when it skips; an install and a fingerprint when it does not.
    timeout-minutes: 30
    if: github.event_name == 'pull_request' && inputs.scope != 'merged-tree'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No pnpm cache here. This job installs only when something mobile
          # changed, and on the PRs where it does not, setup-node's cleanup
          # fails trying to save a store that was never created:
          # "Path Validation Error: Path(s) specified in the action for caching
          # do(es) not exist". A skipped job should cost nothing, including at
          # the end.

      # Nothing mobile touched → nothing to say. Keeps this off the ~85% of PRs
      # that cannot possibly move a fingerprint.
      - name: Does this PR touch anything that could move it
        id: touched
        run: |
          set -euo pipefail
          base=$(git merge-base origin/${{ github.base_ref }} HEAD)
          if git diff --quiet "$base" HEAD -- apps/mobile packages pnpm-lock.yaml pnpm-workspace.yaml; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo '### Mobile runtime not affected' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'Nothing under apps/mobile, packages/ or the lockfile changed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "base=$base" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the runtime on this branch
        if: steps.touched.outputs.relevant == 'true'
        id: head
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          cd apps/mobile
          echo "runtime=$(npx expo-updates runtimeversion:resolve --platform android | jq -r '.runtimeVersion')" >> "$GITHUB_OUTPUT"

      # The merge base, not main's tip: the question is what this branch changed,
      # not what happened on main while it was open.
      - name: Resolve the runtime on the merge base
        if: steps.touched.outputs.relevant == 'true'
        id: base
        run: |
          set -euo pipefail
          git checkout --detach ${{ steps.touched.outputs.base }}
          pnpm install --frozen-lockfile
          cd apps/mobile
          echo "runtime=$(npx expo-updates runtimeversion:resolve --platform android | jq -r '.runtimeVersion')" >> "$GITHUB_OUTPUT"

      - name: Report
        if: steps.touched.outputs.relevant == 'true'
        run: |
          git checkout ${{ github.sha }} -- infra/scripts/report-runtime-change.mjs 2>/dev/null || true
          node infra/scripts/report-runtime-change.mjs \
            "${{ steps.base.outputs.runtime }}" \
            "${{ steps.head.outputs.runtime }}"

  docker:
    needs: changes
    if: ${{ !cancelled() && inputs.scope != 'merged-tree' && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    # 12m typical uncached; a layer-cache hit should cut the build share (unmeasured).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: infra/scripts/ci-free-disk.sh

      # Layer cache in the Actions cache (.github/docker-compose.ci.yml). buildx
      # gives compose a builder that can export to it; the runtime action hands
      # the cache token to `run:` steps, which do not get it otherwise.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=app
          POSTGRES_PASSWORD=changeme
          POSTGRES_DB=books
          JWT_SECRET=test-secret-key-for-ci-minimum-32-chars
          JWT_ISSUER=textstack.app
          JWT_AUDIENCE=textstack.app
          GOOGLE_CLIENT_ID=test
          ASPNETCORE_ENVIRONMENT=Development
          # The integration suite runs against this stack, so the limiter knobs
          # have to be HERE. They were previously only in the e2e job's .env,
          # which meant the suite ran on production defaults: guest-session 3
          # (16 legitimate guest creates starve it) and clip 20 (a dozen classes
          # seed a book by clipping). Harmless while the limiter was inert, fatal
          # the moment it works.
          GUEST_SESSION_PERMIT_LIMIT=50
          USER_LOGIN_PERMIT_LIMIT=100
          CLIP_PERMIT_LIMIT=200
          ACCOUNT_DELETE_PERMIT_LIMIT=50
          DEVICE_CODE_PERMIT_LIMIT=50
          MCP_KEYS_PERMIT_LIMIT=100
          EOF

      - name: Create volume dirs for non-root containers
        run: |
          # The cache dirs are bind mounts. Docker creates a missing one as root,
          # the api container runs as uid 1000, and every cache write is
          # best-effort - so an uncreated dir means the cache silently does
          # nothing.
          mkdir -p data/storage data/library data/textstack data/postgres-prod data/explain-cache
          chmod 777 data/storage data/library data/textstack data/explain-cache

      # Loaded into the local daemon under compose's own names, so the plain
      # `up -d` below starts them without building again.
      - name: Build containers
        run: docker compose -f docker-compose.yml -f .github/docker-compose.ci.yml build

      # `up -d` runs it too (api and worker wait for it); this step shows its output on its own.
      - name: Migrator runs through compose
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f .github/docker-compose.ci-db.yml"
          $COMPOSE run --rm migrator up
          $COMPOSE run --rm migrator status

      # The ci-db overlay publishes Postgres on loopback for the DB-backed integration tests.
      - name: Start services
        run: docker compose -f docker-compose.yml -f .github/docker-compose.ci-db.yml up -d

      - name: Wait for API health
        run: |
          timeout 120 bash -c 'until curl -s http://localhost:8080/health; do sleep 5; done'


      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'

      # The admin tests log in as this account (AuthenticatedApiFixture); without it they fail in
      # CI rather than skip, since a skip is a green run with the admin endpoints untested (#990).
      # Idempotent: the CLI catches "already exists" and exits 0.
      - name: Create admin user for integration tests
        run: docker compose exec -T api dotnet Api.dll create-admin admin@textstack.app admin Admin

      # Everything EXCEPT the rate-limit enforcement test. That one deliberately drains the whole
      # guest-session bucket (60 consecutive POST /auth/guest until one is rejected), and the bucket
      # is keyed on client IP with a 5-minute window — in CI every request comes from one host, so
      # sharing a window with the functional guest suite means one of them starves. Measured: run
      # together, the enforcement test finishes in ~2.7s and fifteen guest/merge tests then SKIP,
      # which is precisely the "green with no coverage" outcome the guest PR exists to prevent.
      # Raising the limit cannot resolve it: the enforcement test consumes limit+1 by construction.
      - name: Integration tests
        run: dotnet test tests/TextStack.IntegrationTests --filter "FullyQualifiedName!~RateLimitEnforcement"
        env:
          API_URL: http://localhost:8080
          # The V2 classes fail (not skip) if /me/v2 does not answer.
          SYNC_API_TESTS: "1"
          # DB-backed tests skip without it: textstack_v2 (DeviceAuth, HealthReadyLibrary).
          TEST_DB_CONNECTION: "Host=localhost;Port=5432;Database=textstack_v2;Username=app;Password=changeme"

      # Restarting the API drops the in-memory limiter partitions, so this starts from a full
      # bucket and cannot be starved by the run above.
      - name: Restart API to reset rate-limiter state
        run: |
          docker compose up -d --force-recreate --no-deps api
          timeout 120 bash -c 'until curl -sf http://localhost:8080/health; do sleep 3; done'

      - name: Rate limit enforcement test (isolated)
        run: dotnet test tests/TextStack.IntegrationTests --filter "FullyQualifiedName~RateLimitEnforcement"
        env:
          API_URL: http://localhost:8080

      - name: Stop services
        if: always()
        run: docker compose down

  e2e:
    needs: changes
    if: ${{ !cancelled() && inputs.scope != 'merged-tree' && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.reader == 'true') }}
    runs-on: ubuntu-latest
    # reader: the web build ships the V2 page from packages/reader/src; a page-only PR must meet the e2e gate.
    # 11m typical uncached; same layer cache as `docker` (unmeasured).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: infra/scripts/ci-free-disk.sh

      # Layer cache in the Actions cache (.github/docker-compose.ci.yml). buildx
      # gives compose a builder that can export to it; the runtime action hands
      # the cache token to `run:` steps, which do not get it otherwise.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=app
          POSTGRES_PASSWORD=changeme
          POSTGRES_DB=books
          JWT_SECRET=test-secret-key-for-ci-minimum-32-chars
          JWT_ISSUER=textstack.app
          JWT_AUDIENCE=textstack.app
          GOOGLE_CLIENT_ID=test
          ASPNETCORE_ENVIRONMENT=Development
          ENABLE_TEST_AUTH=true
          GUEST_SESSION_PERMIT_LIMIT=50
          USER_LOGIN_PERMIT_LIMIT=100
          CLIP_PERMIT_LIMIT=200
          ACCOUNT_DELETE_PERMIT_LIMIT=50
          EOF

      - name: Create volume dirs for non-root containers
        run: |
          # The cache dirs are bind mounts. Docker creates a missing one as root,
          # the api container runs as uid 1000, and every cache write is
          # best-effort - so an uncreated dir means the cache silently does
          # nothing.
          mkdir -p data/storage data/library data/textstack data/postgres-prod data/explain-cache
          chmod 777 data/storage data/library data/textstack data/explain-cache

      # Same images and cache scopes as `docker`; see the note there.
      - name: Build containers
        run: docker compose -f docker-compose.yml -f .github/docker-compose.ci.yml build

      - name: Start services
        run: docker compose up -d

      - name: Wait for API health
        run: |
          timeout 120 bash -c 'until curl -s http://localhost:8080/health; do sleep 5; done'

      # No version here — pnpm/action-setup reads `packageManager` from the
      # root package.json, so CI, Docker and developers use the same one.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: pw-version
        working-directory: apps/web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      # `playwright install-deps` runs `apt-get update`, which fails HARD if ANY
      # configured repository is unreachable — including the Microsoft ones the
      # runner image ships and Playwright has no use for. On 2026-08-27 both
      # returned 403 and took two PRs red with "The repository is no longer
      # signed", which reads like a broken change rather than an upstream outage.
      - name: Drop apt repositories Playwright does not need
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list

      # The browser comes from Playwright's CDN (cached above), no apt involved.
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: pnpm exec playwright install chromium

      # Best-effort: the ubuntu runner image already carries Chrome's shared libraries, so this is
      # usually a no-op. It runs `apt-get update`, and on 2026-11-11 the runners could not resolve
      # archive/security.ubuntu.com for over an hour: three red runs on a PR whose only change was a
      # unit-test timeout. If a library really is missing, the browser fails to launch in the tests
      # below with Playwright's "Host system is missing dependencies", which is still a red job.
      - name: Install Playwright system deps (best-effort)
        id: pw-deps
        continue-on-error: true
        # apt retries an unresolvable mirror for ~10 min (2026-11-11), which alone pushed `frontend`
        # past its 15-min job limit. A healthy run takes under 25 s; at 3 min the cap itself cost
        # every run 193 s while the mirror stayed slow.
        timeout-minutes: 1
        run: pnpm -C apps/web exec playwright install-deps chromium

      - name: Flag skipped Playwright system deps
        if: steps.pw-deps.outcome == 'failure'
        run: echo "::warning title=Playwright deps::install-deps failed (apt unreachable?); running on the runner image's libraries."

      - name: Clean stale dist
        run: rm -rf apps/web/dist

      # Built once here; every Playwright run below serves this dist with `vite preview`
      # (playwright.config.ts under CI) instead of rebuilding the app per run.
      - name: Build web app
        run: pnpm -C apps/web build

      # One pass (what production runs). SYNC_E2E=1: a /me/v2 404 fails the V2 specs
      # instead of skipping them.
      - name: E2E — gates the PR
        working-directory: apps/web
        run: pnpm test:e2e
        env:
          CI: true
          SYNC_E2E: "1"
          API_URL: http://localhost:8080
          BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: apps/web/e2e/playwright-report/
          retention-days: 14

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color api migrator worker

      - name: Stop services
        if: always()
        run: docker compose down
