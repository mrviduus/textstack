name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

# Opt JS actions into Node 24 ahead of June 2026 forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Every job carries `timeout-minutes`, and the comment above each one is what it
# actually takes, measured. None of them had a ceiling until a hung `mobile-runtime`
# on a Dependabot PR ran for six hours — GitHub's default — and was billed for all
# six. The numbers are deliberately loose: a ceiling is there to end a hang, not to
# police a slow run, so a job that trips one is reporting a hang, not a bad estimate.
jobs:
  # Cheapest job in the file and the one that would have saved the most time:
  # an EAS workflow pinned to Node 20 could not install eas-cli 23, and finding
  # that out cost two round trips. See scripts/check-node-version.mjs.
  node-version:
    runs-on: ubuntu-latest
    # 6s typical.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # This job installs nothing — it runs one plain Node script. Leave the
          # cache off: setup-node reads `packageManager` from the root
          # package.json, decides it should prime a pnpm cache, and fails with
          # "Unable to locate executable file: pnpm" in a job that has no reason
          # to have pnpm at all.
          package-manager-cache: false
      - run: node scripts/check-node-version.mjs

  # The extension has no build step and no package.json, so nothing else in this
  # file would ever look at it. Its README documented a check and asked a person
  # to remember it; nothing ran it, and it could not have failed if it had.
  extension:
    runs-on: ubuntu-latest
    # 12s typical.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Same reason as above: one plain Node script, no install, and the
          # pnpm cache priming would fail in a job with no pnpm.
          package-manager-cache: false
      - run: node scripts/check-extension.mjs

  # Dependabot alerts were disabled on this repository for its whole life, which
  # is how a patched dompurify sat available for months while the vulnerable one
  # shipped to every visitor. They are on now — and a setting somebody can switch
  # off is not a check, so this asks the same question here, where turning it off
  # is a diff. See scripts/check-advisories.mjs.
  advisories:
    runs-on: ubuntu-latest
    # 2m typical.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # `pnpm audit` reads the lockfile, not node_modules, so this job needs
          # pnpm on PATH and nothing installed.
          package-manager-cache: false
      - run: node scripts/check-advisories.mjs

  backend:
    runs-on: ubuntu-latest
    # 5m typical.
    timeout-minutes: 20
    services:
      postgres:
        # pgvector image (stock pg16 + vector ext) so `dotnet ef database update`
        # can run the AddPgVectorAndChunks migration's CREATE EXTENSION vector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: books
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # The JS half of this question is scripts/check-advisories.mjs; this is the
      # .NET half, and it is free here because restore has already run. Currently
      # clean across all 15 projects — cheap to keep that way, and the command
      # reports success without failing, so the grep is what makes it a gate.
      - name: Vulnerable packages
        run: |
          set -euo pipefail
          out=$(dotnet list package --vulnerable --include-transitive)
          echo "$out"
          if echo "$out" | grep -qE '^\s+> '; then
            echo "::error::A dependency has a known advisory. See the listing above."
            exit 1
          fi

      - name: Lint (format check)
        run: dotnet format --no-restore --verify-no-changes

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Run migrations
        run: dotnet ef database update --project backend/src/Infrastructure --startup-project backend/src/Api
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=books;Username=app;Password=changeme"

      - name: Search tests
        run: dotnet test tests/TextStack.Search.Tests --no-build

      # MCP over-the-wire integration suite (AI-053) — hermetic (loopback only, no
      # Postgres/Docker). In the solution, so --no-build reuses the Build step above.
      - name: MCP integration tests
        run: dotnet test tests/TextStack.Ai.Mcp.Tests --no-build

      # Unit tests (incl. the AI-047..050 MCP unit suites) are NOT in textstack.sln,
      # so the Build step doesn't compile them — run WITHOUT --no-build. This closes a
      # real CI gap: these were never executed by an explicit dotnet test step before.
      - name: Unit tests
        run: dotnet test tests/TextStack.UnitTests

      # AI-051: keep the MCP global-tool packaging green (no publish, no secret).
      # Owner publishes manually via `dotnet nuget push` with their nuget.org key.
      - name: Pack MCP global tool
        run: dotnet pack backend/src/Ai/TextStack.Ai.Mcp -c Release

  frontend:
    runs-on: ubuntu-latest
    # 1m45 typical.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # No version here — pnpm/action-setup reads `packageManager` from the
      # root package.json, so CI, Docker and developers use the same one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # One install for the whole workspace. Each app used to install from its
      # own lockfile; there is one lockfile now, and `catalog:` only resolves
      # with pnpm-workspace.yaml in scope.
      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter textstack-web build

      # Vitest was never wired into CI — the job built the app and stopped, so a
      # failing web unit test merged to main unnoticed.
      - name: Web unit tests
        working-directory: apps/web
        run: pnpm test

      # Same gap, one level up: apps/web's vitest config is rooted at apps/web,
      # so the ~380 tests in packages/shared were reachable only through a root
      # `pnpm -r test` that nothing ran. That package is the auth client, the
      # progress maths and the resume logic for BOTH web and mobile.
      - name: Shared package unit tests
        working-directory: packages/shared
        run: pnpm test

      # And it had no `typecheck` script at all, so root `pnpm -r typecheck`
      # skipped it silently — which is how four type errors sat in its test
      # fixtures unnoticed. Running the tests without this would guard the
      # behaviour of a package whose types nothing checks.
      - name: Shared package typecheck
        working-directory: packages/shared
        run: pnpm typecheck

      - name: Drift-check mobile overlay bundle
        working-directory: apps/web
        run: pnpm check:mobile-overlay

      # The PDF bundle had no such guard. entry.ts is the source of the viewer
      # that owns the reader's position in a PDF, and an edit shipped without a
      # rebuild changes nothing at runtime — silently, past a green CI.
      - name: Drift-check mobile PDF bundle
        working-directory: apps/web
        run: pnpm check:mobile-pdf

      - name: Build admin
        run: pnpm --filter textstack-admin build

      # scripts/ has its own tests and no vitest project would otherwise find
      # them — the web config's include does not reach outside apps/web, so
      # without this step they exist and never run. They cover the weekly
      # dependency job, which edits pnpm-workspace.yaml unattended.
      - name: Repo script tests
        run: pnpm test:scripts

  # apps/mobile is npm + its own lockfile, not part of the pnpm workspace, so it
  # gets its own job rather than another step in `frontend`. @textstack/shared is
  # consumed from source via Metro watchFolders + tsconfig paths, so the checkout
  # already carries it and only the app's own deps need installing.
  #
  # Not covered here: e2e. apps/mobile/e2e is Playwright driving the Expo *web*
  # build in a Pixel-sized viewport — it exercises no native code path, so running
  # it in CI would buy confidence it cannot actually provide.
  mobile:
    runs-on: ubuntu-latest
    # 1m10 typical.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter mobile typecheck

      - name: Unit tests
        run: pnpm --filter mobile test

      # Expo pins a set of package versions it has tested together, and nothing
      # in CI knew about it. Dependabot proposed react-native 0.87.1 against an
      # SDK that expects 0.83.10, expo-splash-screen from a different SDK
      # entirely, and a webview major the SDK does not ship — all with green
      # type checks and green unit tests, because tsc does not know what an SDK
      # compatibility matrix is. The version catalog had also quietly moved
      # react past Expo's pin.
      #
      # `--check` fails on a version mismatch. It is the check that turns "the
      # tests pass" into "and the app is built out of parts that were tested
      # together". @sentry/react-native is deliberately ahead and recorded in
      # expo.install.exclude.
      - name: Expo SDK version alignment
        working-directory: apps/mobile
        run: npx expo install --check

      # tsc and unit tests both passed while the app could not be bundled at
      # all — a broken import or a bad module resolution only surfaces when
      # Metro walks the graph. This is the cheapest step that would have
      # caught it, and it is the same command that produces an OTA payload.
      - name: Bundle (Metro)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/ci-bundle

  # Does this change still ship as an OTA, or does it need a Play build?
  #
  # mobile-ota.yml already refuses to publish into a runtime nobody is running,
  # and that guard works — but it runs after the merge, so it tells the person
  # who can no longer avoid it. Asked here, the answer still changes a decision.
  #
  # Its own job because it checks out and installs twice, and only when
  # something that can move a fingerprint has changed.
  mobile-runtime:
    runs-on: ubuntu-latest
    # 12s when it skips; an install and a fingerprint when it does not.
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No pnpm cache here. This job installs only when something mobile
          # changed, and on the PRs where it does not, setup-node's cleanup
          # fails trying to save a store that was never created:
          # "Path Validation Error: Path(s) specified in the action for caching
          # do(es) not exist". A skipped job should cost nothing, including at
          # the end.

      # Nothing mobile touched → nothing to say. Keeps this off the ~85% of PRs
      # that cannot possibly move a fingerprint.
      - name: Does this PR touch anything that could move it
        id: touched
        run: |
          set -euo pipefail
          base=$(git merge-base origin/${{ github.base_ref }} HEAD)
          if git diff --quiet "$base" HEAD -- apps/mobile packages pnpm-lock.yaml pnpm-workspace.yaml; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo '### Mobile runtime not affected' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'Nothing under apps/mobile, packages/ or the lockfile changed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "base=$base" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the runtime on this branch
        if: steps.touched.outputs.relevant == 'true'
        id: head
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          cd apps/mobile
          echo "runtime=$(npx expo-updates runtimeversion:resolve --platform android | jq -r '.runtimeVersion')" >> "$GITHUB_OUTPUT"

      # The merge base, not main's tip: the question is what this branch changed,
      # not what happened on main while it was open.
      - name: Resolve the runtime on the merge base
        if: steps.touched.outputs.relevant == 'true'
        id: base
        run: |
          set -euo pipefail
          git checkout --detach ${{ steps.touched.outputs.base }}
          pnpm install --frozen-lockfile
          cd apps/mobile
          echo "runtime=$(npx expo-updates runtimeversion:resolve --platform android | jq -r '.runtimeVersion')" >> "$GITHUB_OUTPUT"

      - name: Report
        if: steps.touched.outputs.relevant == 'true'
        run: |
          git checkout ${{ github.sha }} -- scripts/report-runtime-change.mjs 2>/dev/null || true
          node scripts/report-runtime-change.mjs \
            "${{ steps.base.outputs.runtime }}" \
            "${{ steps.head.outputs.runtime }}"

  docker:
    runs-on: ubuntu-latest
    # 12m typical.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=app
          POSTGRES_PASSWORD=changeme
          POSTGRES_DB=books
          JWT_SECRET=test-secret-key-for-ci-minimum-32-chars
          JWT_ISSUER=textstack.app
          JWT_AUDIENCE=textstack.app
          GOOGLE_CLIENT_ID=test
          ASPNETCORE_ENVIRONMENT=Development
          # The integration suite runs against this stack, so the limiter knobs
          # have to be HERE. They were previously only in the e2e job's .env,
          # which meant the suite ran on production defaults: guest-session 3
          # (16 legitimate guest creates starve it) and clip 20 (a dozen classes
          # seed a book by clipping). Harmless while the limiter was inert, fatal
          # the moment it works. GUEST_DAILY_ENRICHMENT_CAP is 3 because the cap
          # test skips itself above 10 - at the default 50 it asserted nothing.
          GUEST_SESSION_PERMIT_LIMIT=50
          USER_LOGIN_PERMIT_LIMIT=100
          CLIP_PERMIT_LIMIT=200
          ACCOUNT_DELETE_PERMIT_LIMIT=50
          RAG_ASK_PERMIT_LIMIT=300
          GUEST_DAILY_ENRICHMENT_CAP=3
          EOF

      - name: Create volume dirs for non-root containers
        run: |
          # The cache dirs are bind mounts. Docker creates a missing one as root,
          # the api container runs as uid 1000, and every cache write is
          # best-effort - so an uncreated dir means the cache silently does
          # nothing and the dictionary outage fallback does not exist. That is
          # what the repeated-lookup test caught.
          mkdir -p data/storage data/textstack data/postgres-prod data/dictionary-cache data/explain-cache
          chmod 777 data/storage data/textstack data/dictionary-cache data/explain-cache

      - name: Build containers
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for API health
        run: |
          timeout 120 bash -c 'until curl -s http://localhost:8080/health; do sleep 5; done'


      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Everything EXCEPT the rate-limit enforcement test. That one deliberately drains the whole
      # guest-session bucket (60 consecutive POST /auth/guest until one is rejected), and the bucket
      # is keyed on client IP with a 5-minute window — in CI every request comes from one host, so
      # sharing a window with the functional guest suite means one of them starves. Measured: run
      # together, the enforcement test finishes in ~2.7s and fifteen guest/merge tests then SKIP,
      # which is precisely the "green with no coverage" outcome the guest PR exists to prevent.
      # Raising the limit cannot resolve it: the enforcement test consumes limit+1 by construction.
      - name: Integration tests
        run: dotnet test tests/TextStack.IntegrationTests --filter "FullyQualifiedName!~RateLimitEnforcement"
        env:
          API_URL: http://localhost:8080

      # Restarting the API drops the in-memory limiter partitions, so this starts from a full
      # bucket and cannot be starved by the run above.
      - name: Restart API to reset rate-limiter state
        run: |
          docker compose up -d --force-recreate --no-deps api
          timeout 120 bash -c 'until curl -sf http://localhost:8080/health; do sleep 3; done'

      - name: Rate limit enforcement test (isolated)
        run: dotnet test tests/TextStack.IntegrationTests --filter "FullyQualifiedName~RateLimitEnforcement"
        env:
          API_URL: http://localhost:8080

      - name: Stop services
        if: always()
        run: docker compose down

  e2e:
    runs-on: ubuntu-latest
    # 11m typical.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=app
          POSTGRES_PASSWORD=changeme
          POSTGRES_DB=books
          JWT_SECRET=test-secret-key-for-ci-minimum-32-chars
          JWT_ISSUER=textstack.app
          JWT_AUDIENCE=textstack.app
          GOOGLE_CLIENT_ID=test
          ASPNETCORE_ENVIRONMENT=Development
          ENABLE_TEST_AUTH=true
          GUEST_SESSION_PERMIT_LIMIT=50
          USER_LOGIN_PERMIT_LIMIT=100
          CLIP_PERMIT_LIMIT=200
          ACCOUNT_DELETE_PERMIT_LIMIT=50
          RAG_ASK_PERMIT_LIMIT=300
          GUEST_DAILY_ENRICHMENT_CAP=3
          ADMIN_EMAIL=admin@textstack.app
          ADMIN_PASSWORD=admin
          EOF

      - name: Create volume dirs for non-root containers
        run: |
          # The cache dirs are bind mounts. Docker creates a missing one as root,
          # the api container runs as uid 1000, and every cache write is
          # best-effort - so an uncreated dir means the cache silently does
          # nothing and the dictionary outage fallback does not exist. That is
          # what the repeated-lookup test caught.
          mkdir -p data/storage data/textstack data/postgres-prod data/dictionary-cache data/explain-cache
          chmod 777 data/storage data/textstack data/dictionary-cache data/explain-cache

      - name: Build & start services
        run: docker compose up -d --build

      - name: Wait for API health
        run: |
          timeout 120 bash -c 'until curl -s http://localhost:8080/health; do sleep 5; done'

      # CI wrote ADMIN_EMAIL/ADMIN_PASSWORD into .env but nothing ever created the
      # account, so admin login 401'd and reader-images.spec.ts skipped both of its
      # tests on every run — silently, since a skip still reports green. The spec's
      # own comment ("skip all tests if admin not available (e.g. CI)") shows the hole
      # was known and accepted. Creating the admin closes it.
      #
      # Idempotent: the CLI catches "already exists" and exits 0, so a warm volume
      # does not fail the job. Credentials match helpers/api.ts defaults.
      - name: Create admin user for E2E
        run: docker compose exec -T api dotnet Api.dll create-admin admin@textstack.app admin Admin

      # No version here — pnpm/action-setup reads `packageManager` from the
      # root package.json, so CI, Docker and developers use the same one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: pw-version
        working-directory: apps/web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      # `playwright install-deps` runs `apt-get update`, which fails HARD if ANY
      # configured repository is unreachable — including the Microsoft ones the
      # runner image ships and Playwright has no use for. On 2026-08-27 both
      # returned 403 and took two PRs red with "The repository is no longer
      # signed", which reads like a broken change rather than an upstream outage.
      - name: Drop apt repositories Playwright does not need
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm -C apps/web exec playwright install-deps chromium

      - name: Clean stale dist
        run: rm -rf apps/web/dist

      # Split on purpose, after looking at what this suite actually earns.
      #
      # 20 of the 70 commits touching apps/web/e2e were about flakes, timeouts and
      # waits — a third of the suite's maintenance went to keeping the suite running.
      # And the one production incident in its strongest coverage area (reading
      # position lost to a 23505 upsert race, 2026-08-07) was caught by Sentry, not
      # by these tests: a single-threaded Playwright script cannot produce a
      # concurrent write. The suite reliably catches broken wiring — a page that
      # stops rendering, a route that 404s, a button that vanished — and reliably
      # does not catch logic or concurrency.
      #
      # So the shallow, cheap part gates production and the rest reports. A Google
      # CDN hiccup should never again hold a deploy (it did, 2026-08-20).
      - name: E2E smoke — gates the deploy
        working-directory: apps/web
        run: pnpm test:e2e --grep @smoke
        env:
          CI: true
          API_URL: http://localhost:8080
          BASE_URL: http://localhost:5173
          ADMIN_URL: http://localhost:81

      # Reported, not blocking. Read the summary and the uploaded report; a failure
      # here is a real signal worth acting on, it just does not stop a release.
      - name: E2E full — reported, does not gate
        id: e2e-full
        continue-on-error: true
        working-directory: apps/web
        run: pnpm test:e2e --grep-invert @smoke
        env:
          CI: true
          API_URL: http://localhost:8080
          BASE_URL: http://localhost:5173
          ADMIN_URL: http://localhost:81

      - name: Flag non-blocking E2E failures
        if: steps.e2e-full.outcome == 'failure'
        run: |
          echo "::warning title=E2E (non-blocking)::Full E2E suite failed. Deploy was NOT blocked — see the playwright-report artifact."
          echo "### ⚠️ Full E2E suite failed (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke passed, so the deploy proceeded. Download the \`playwright-report\` artifact for details." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/e2e/playwright-report/
          retention-days: 14

      # `worker` was missing here, and it is where ingestion happens — so when an
      # ingestion-dependent test timed out, the one log that could explain it was the
      # one not captured.
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color api migrator worker

      - name: Stop services
        if: always()
        run: docker compose down
