name: Mobile Release (EAS)

# Manual mobile shipping via EAS. Three SEPARATE, explicit actions — nothing reaches
# the store automatically; each run is a deliberate human click:
#   • ota-update — `eas update` to the production channel (JS-only changes, instant).
#   • build      — `eas build` only. Produces an artifact; does NOT touch the store.
#   • submit     — `eas submit --latest` — pushes the latest build to the store,
#                  to the `track` input (internal | closed | production). Android-only.
#   • build-submit — one run, no tags: `eas build --auto-submit-with-profile`.
#                  Builds on EAS, waits, then pushes to the store in the same run,
#                  to the `track` input (internal | closed | production). Android-only.
# Submit destination = the `track` input → eas.json `submit.<track>` profile.
#
# `production` opens a STAGED rollout at 10% (eas.json submit.production:
# releaseStatus inProgress + rollout 0.1). EAS cannot advance an existing rollout —
# 10% → 25% → 50% → 100% is done by hand in Play Console → Production → Manage
# rollout. Re-running this workflow with a larger rollout creates a NEW release
# instead of widening the current one.
#
# Requires repo secret EXPO_TOKEN (expo.dev → Account → Access tokens).
# workflow_dispatch ONLY — no push/tag/schedule triggers, so the store is never
# deployed to automatically.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do (store submit is its own explicit action)
        type: choice
        options: [ota-update, build, submit, build-submit]
        default: ota-update
      platform:
        description: Target platform
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        description: Build profile (build / ota / build-submit)
        type: choice
        options: [production, preview]
        default: production
      track:
        description: Submit track (submit / build-submit only). production = 10% staged rollout.
        type: choice
        options: [internal, closed, production]
        default: internal
      message:
        description: OTA message (ota-update only)
        type: string
        default: CI OTA update

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    # 17m, and an EAS cloud build can sit in a queue first.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Version comes from .nvmrc, the one place that declares it. It must
          # stay >= 22: eas-cli 23 pulls @oclif/plugin-autocomplete, which
          # declares engines.node >= 22 and will not install below it.
          node-version-file: .nvmrc
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # One workspace, one lockfile — apps/mobile stopped having its own the day
      # this repo became a pnpm workspace, and `npm ci` kept looking for a
      # package-lock.json that no longer exists. ci.yml's mobile job was
      # converted at the time; this file and mobile-ota.yml were missed.
      #
      # Installs the whole workspace rather than this app alone: packages/shared
      # is consumed from source and Metro resolves it through the workspace root.
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: OTA update
        if: ${{ inputs.action == 'ota-update' }}
        run: |
          eas update \
            --branch production \
            --platform "${{ inputs.platform }}" \
            --environment production \
            --message "${{ inputs.message }}" \
            --non-interactive

      # Build only — never auto-submits. The artifact sits in EAS until you
      # explicitly run the 'submit' action below.
      - name: Build
        if: ${{ inputs.action == 'build' }}
        run: |
          eas build \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait

      # Explicit, separate store push — submits the latest build to the store.
      - name: Submit to store
        if: ${{ inputs.action == 'submit' }}
        run: |
          eas submit \
            --platform android \
            --profile "${{ inputs.track }}" \
            --latest \
            --non-interactive

      # One run, no tags: build on EAS, wait, then push to the store. The submit
      # track comes from eas.json (submit.<profile>.android.track). Android only —
      # iOS has no submit config, so pick android for this action.
      - name: Build + submit
        if: ${{ inputs.action == 'build-submit' }}
        run: |
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --auto-submit-with-profile "${{ inputs.track }}" \
            --non-interactive
