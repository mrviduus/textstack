name: CI cache warm

# Builds the compose images on main so pull requests start with a warm Docker
# layer cache. A PR can read caches from its own branch and from main; nothing
# else builds images on main (deploy builds on the server), so without this
# every PR's first `docker`/`e2e` run was cold. Same overlay and scopes as
# ci.yml; the .env matches the `docker` job so build args (and cache keys) match.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-cache-warm
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  warm:
    runs-on: ubuntu-latest
    # ~12m cold, a few minutes warm.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=app
          POSTGRES_PASSWORD=changeme
          POSTGRES_DB=books
          JWT_SECRET=test-secret-key-for-ci-minimum-32-chars
          JWT_ISSUER=textstack.app
          JWT_AUDIENCE=textstack.app
          GOOGLE_CLIENT_ID=test
          ASPNETCORE_ENVIRONMENT=Development
          GUEST_SESSION_PERMIT_LIMIT=50
          USER_LOGIN_PERMIT_LIMIT=100
          CLIP_PERMIT_LIMIT=200
          ACCOUNT_DELETE_PERMIT_LIMIT=50
          GUEST_DAILY_ENRICHMENT_CAP=3
          EOF

      - name: Build containers (writes the cache)
        run: docker compose -f docker-compose.yml -f .github/docker-compose.ci.yml build
