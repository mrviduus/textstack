name: Mobile OTA (auto)

# Publishes a JS-only change to installed Android apps when it lands on main.
#
# Separate from mobile-release.yml on purpose. That workflow is workflow_dispatch
# only and says so in its own header: nothing reaches the STORE without a human
# clicking. This one never touches the store — `eas update` republishes the JS
# bundle to apps that are already installed.
#
# The guard is the point of this file.
#
# app.json sets `runtimeVersion: { policy: "fingerprint" }`, so an update only
# reaches builds whose fingerprint matches. When a merge changes a native
# dependency, an Expo plugin or app.json, the fingerprint moves — and `eas
# update` still SUCCEEDS, publishing to a runtime nobody has installed. A green
# check and zero delivery. That is the same shape as the SSG rebuild that
# reported success after losing its files
# (docs/incidents/2026-08-31-deploy-wiped-a-running-ssg-rebuild.md), and it is
# worse here because nothing else would ever notice.
#
# So: compute the fingerprint, compare it with the runtime of the newest
# finished production build, and publish only on a match.
#
# A mismatch used to FAIL the run, on the reasoning that "this merge did not
# reach anyone" is information and a silent skip looks like a success. The
# reasoning was right and the outcome was still a twelve-day outage: offline
# reading landed 2026-09-14, this step refused correctly the same night, and the
# feature sat on main and on nobody's phone until 2026-09-27 while the failed run
# scrolled out of sight. A failed run is not a task list.
#
# So a mismatch now ships itself — a build, submitted to `closed` (Play's `alpha`).
# That is where the testers actually are: six of them opted in, while the Internal
# track's list is empty, and a build sent somewhere nobody is subscribed repeats
# this outage in a quieter way. `production` stays manual in mobile-release.yml,
# because it has an audience that did not ask to be a test.
#
# That run publishes no update: nothing installed has the new runtime yet, and the
# build carries the commit's JS itself. A push while that build is still queued or
# running does not start a second one. Both rules: scripts/mobile-ota-decide.mjs.
#
# One track, not two. Play identifies a release by `versionCode` and refuses a
# second upload of the same one — submitting build 28 to `internal` and then to
# `closed` failed with "You've already submitted this version of the app", and
# reaching the second track meant promoting it by hand in Play Console. So the
# automatic path picks the track with an audience and sends the build there once.
#
# Android only. iOS has no released build for an update to land on.
#
# Requires repo secret EXPO_TOKEN (expo.dev → Account → Access tokens).

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'          # consumed from source by Metro, so it ships in the bundle
      # The fingerprint resolves through the workspace root, so these two move the
      # mobile runtime without a single file under apps/mobile changing — the pnpm
      # migration moved 122 of 135 fingerprint sources for exactly this reason. They
      # were missing here while the only thing that edited them was a human; the
      # semiannual dependency lane now edits both, unattended, twice a year. Without
      # them a lockfile bump moves the runtime, `mobile-runtime` warns on the pull
      # request, and nothing at all happens on the merge. Kept in step with that
      # job's own diff filter in ci.yml.
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-ota.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare the runtime and stop before publishing
        type: boolean
        default: true

# Shared with mobile-release.yml so an automatic update can never run alongside
# a manual build or store submit.
concurrency:
  group: mobile-release
  cancel-in-progress: false

# Read-only by default; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  ota:
    runs-on: ubuntu-latest
    # 2m typical.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before the expo action, so a missing token says so instead of surfacing
      # as an authentication failure three steps later. Read from env rather
      # than a step-level `if`: the secrets context is not dependably available
      # in one.
      - name: Fail early without a usable token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Empty and placeholder are the same failure to a reader: the workflow
          # cannot talk to EAS. The secret was created with a placeholder so the
          # field exists in Settings; catching it here means the run says what to
          # do instead of dying on an authentication error two steps later.
          case "${EXPO_TOKEN:-}" in
            '' | REPLACE_ME*)
              echo "::error::EXPO_TOKEN is unset or still the placeholder. Create a token at expo.dev → Account → Access tokens, then replace the secret at Settings → Secrets and variables → Actions."
              exit 1
              ;;
          esac

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Version comes from .nvmrc, the one place that declares it. It must
          # stay >= 22: eas-cli 23 pulls @oclif/plugin-autocomplete, which
          # declares engines.node >= 22 and will not install below it.
          node-version-file: .nvmrc
          cache: pnpm

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # One workspace, one lockfile — apps/mobile stopped having its own the day
      # this repo became a pnpm workspace. `npm ci` kept looking for a
      # package-lock.json that no longer exists, and setup-node failed before it
      # even got there: "Some specified paths were not resolved, unable to cache
      # dependencies." ci.yml's mobile job was converted at the time; these two
      # were missed, so the first OTA after the move never published.
      #
      # Installs the whole workspace rather than this app alone: packages/shared
      # is consumed from source and Metro resolves it through the workspace root.
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      # MUST run from apps/mobile. From the repo root the command computes a
      # different hash and reports it as valid — see docs/03-ops/play-store-release.md.
      # `working-directory` above covers it; do not "simplify" this to a root run.
      - name: Resolve the runtime this commit would have
        id: fp
        run: |
          set -euo pipefail
          # runtimeversion:resolve, not fingerprint:generate — it answers the
          # question being asked ("what runtime would this commit produce"),
          # and it is the command docs/03-ops/play-store-release.md already
          # prescribes for this comparison. fingerprint:generate is kept as a
          # fallback for CLI versions that lack it.
          out=$(npx expo-updates runtimeversion:resolve --platform android 2>/dev/null \
            || npx expo-updates fingerprint:generate --platform android)
          echo "$out"
          hash=$(printf '%s' "$out" | jq -r '.runtimeVersion // .hash // empty' 2>/dev/null || true)
          if [ -z "$hash" ]; then
            # Plain-text output: take the hash it printed.
            hash=$(printf '%s' "$out" | grep -oE '[0-9a-f]{32,}' | head -1 || true)
          fi
          if [ -z "$hash" ]; then
            echo "::error::Could not read a runtime version out of: $out"
            exit 1
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      # Finished builds AND queued/running ones: a production build still in flight with this
      # commit's runtime means the previous push already started the store build, and this one
      # must not start a second. The decision (publish / build / queued) and why it is shaped
      # like that: scripts/mobile-ota-decide.mjs, tested in mobile-ota-decide.test.mjs.
      # Filtered there, not with a CLI flag — the profile filter has been spelled --profile and
      # --buildProfile across EAS versions, and a wrong flag name fails the run for a reason
      # that has nothing to do with the app.
      - name: Read the runtime of the newest production build
        id: build
        env:
          HASH: ${{ steps.fp.outputs.hash }}
        run: |
          set -euo pipefail
          # One call per status — the CLI takes a single --status — so the newest finished
          # build cannot fall out of a window filled by errored builds or other profiles.
          files=()
          for status in finished new in-queue in-progress; do
            limit=10
            [ "$status" = finished ] && limit=20
            f="$RUNNER_TEMP/builds-$status.json"
            eas build:list \
              --platform android \
              --status "$status" \
              --limit "$limit" \
              --json --non-interactive > "$f"
            files+=("$f")
          done
          node "$GITHUB_WORKSPACE/scripts/mobile-ota-decide.mjs" "$HASH" "${files[@]}"

      # The JS bundle every installed app downloads. EXPO_PUBLIC_* values are inlined
      # into it, so a secret put in EAS's production environment under that prefix
      # would ship to every phone. Exported here with the same environment `eas
      # update` uses (env:exec loads its plain-text variables; secret-visibility ones
      # never reach a bundle either way) and scanned with the image scanner's
      # patterns plus EXPO_TOKEN's own value. Runs on a dry run too, so the gate can
      # be tried without publishing. Placed before the permission check and the store
      # build: that build bundles the same JS with the same environment and sends it
      # to testers, so a hit must block it as well as the update. Both bundle again
      # from the same commit and environment — this is an equivalent bundle, not the
      # uploaded bytes.
      - name: Secret scan the OTA bundle (gates the publish)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ota-scan"
          eas env:exec production "npx expo export --platform android --output-dir '$out'" --non-interactive
          SCAN_SECRET_VALUES="$EXPO_TOKEN" "$GITHUB_WORKSPACE/scripts/scan-image-secrets.sh" --dir "$out"
          rm -rf "$out"

      # The source-level permission check, before anything is built. It reads the
      # manifest our own config produces — app.json plus the config plugins — which
      # is where a new permission from `blockedPermissions` drifting out of date
      # would appear. It is NOT the merged manifest: library-injected permissions
      # need `gradlew :app:processReleaseMainManifest`, ten minutes and an Android
      # SDK, and the summary below says which level ran so nobody reads more into
      # it than that. Android's permission strategy here is blocklist-only, with no
      # allowlist, so this is the cheapest place a surprise shows up.
      - name: Check the permissions this build would declare
        if: ${{ steps.build.outputs.action == 'build' && inputs.dry_run != true }}
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --clean
          pnpm check:permissions

      # And then delete it again. A leftover `android/` makes EAS treat the project
      # as bare: it skips its own prebuild, builds from these local files, and the
      # runtime fingerprint of the result is no longer the one measured two steps
      # ago — the exact poisoning docs/03-ops/play-store-release.md warns about for
      # local fingerprint runs, with a build attached.
      - name: Put the tree back the way EAS expects it
        if: ${{ steps.build.outputs.action == 'build' && inputs.dry_run != true }}
        run: rm -rf android

      # --json for the build id the summary links to (logs go to stderr). Implies --non-interactive.
      - name: Build and submit to Closed testing, since no update can reach anyone
        id: ship
        if: ${{ steps.build.outputs.action == 'build' && inputs.dry_run != true }}
        run: |
          set -euo pipefail
          out=$(eas build --platform android --profile production \
            --auto-submit-with-profile closed --non-interactive --no-wait --json)
          echo "$out"
          # The build has started by now; a JSON shape change must not fail the run over a link.
          id=$(printf '%s' "$out" | jq -r 'if type == "array" then .[0].id else .id end // empty' 2>/dev/null || true)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # No update when this run started the store build: its runtime is on no installed app
      # yet, and the binary itself carries this commit's JS. Publishing anyway gave a green
      # "OTA published" that reached nobody (run 37661100905, #761). On `queued` it does
      # publish — see scripts/mobile-ota-decide.mjs.
      #
      # Commit subject only, passed through the environment rather than
      # interpolated into the script: a commit message is attacker-controlled
      # text and `${{ }}` inside `run:` would execute what it contains.
      - name: Publish the update
        if: ${{ inputs.dry_run != true && steps.build.outputs.action != 'build' }}
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          msg=$(printf '%s' "${COMMIT_MSG:-manual run}" | head -1 | cut -c1-140)
          eas update \
            --branch production \
            --platform android \
            --environment production \
            --message "$msg" \
            --non-interactive

      - name: Say what happened
        if: ${{ success() }}
        env:
          ACTION: ${{ steps.build.outputs.action }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          HASH: ${{ steps.fp.outputs.hash }}
          RUNTIME: ${{ steps.build.outputs.runtime }}
          BUILD_ID: ${{ steps.build.outputs.id }}
          INFLIGHT_ID: ${{ steps.build.outputs.inflight_id }}
          INFLIGHT_STATUS: ${{ steps.build.outputs.inflight_status }}
          NEW_ID: ${{ steps.ship.outputs.id }}
        run: |
          builds=https://expo.dev/accounts/$(jq -r .expo.owner app.json)/projects/$(jq -r .expo.slug app.json)/builds
          link() { if [ -n "$1" ]; then echo "[\`$1\`]($builds/$1)"; else echo "[the build list]($builds)"; fi; }
          {
            case "$ACTION/$DRY_RUN" in
              publish/true) echo "### Runtime matches — dry run, nothing published" ;;
              publish/false) echo "### OTA published to the production channel" ;;
              build/true) echo "### Runtime changed — dry run, nothing built or published" ;;
              build/false)
                echo "### Runtime changed → store build $(link "$NEW_ID") submitted to Closed testing; no OTA published"
                echo
                echo "No installed app runs this runtime yet. Installs get these changes from the store build."
                echo "It submits itself to **closed testing** (Play's \`alpha\`) when it finishes — \`--no-wait\`,"
                echo "so this run ends first. Permissions were checked at the **source** manifest level only."
                echo "A build reaches ONE track per upload; \`production\` is still a human click: **mobile-release.yml**."
                ;;
              queued/true) echo "### Runtime changed, store build $(link "$INFLIGHT_ID") already $INFLIGHT_STATUS — dry run, nothing published" ;;
              queued/false)
                echo "### Runtime changed, store build $(link "$INFLIGHT_ID") already $INFLIGHT_STATUS → no second build; OTA published for its runtime"
                echo
                echo "No installed app runs this runtime yet. The queued build embeds an older commit and picks"
                echo "this update up on first launch."
                echo
                echo "**If this build fails, these changes reach no one until the next mobile push.**"
                echo "Re-run **mobile-release.yml → build**."
                ;;
            esac
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| this commit | \`$HASH\` |"
            echo "| newest finished production build | \`$RUNTIME\` ($(link "$BUILD_ID")) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
