name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_commit:
        description: 'Commit SHA to rollback to (optional)'
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_DIR: /home/vasyl/projects/onlinelib/textstack
  # Opt JS actions into Node 24 ahead of June 2026 forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: self-hosted
    # 2m typical, 30m at worst.
    timeout-minutes: 60

    steps:
      - name: Pre-deploy backup
        run: |
          mkdir -p ~/backups/textstack
          DATE=$(date +%F-%H%M)
          docker exec textstack_db_prod pg_dump -U textstack_prod textstack_prod | gzip > ~/backups/textstack/pre-deploy-$DATE.sql.gz
          echo "Backup created: pre-deploy-$DATE.sql.gz"
          # Keep only 5 newest pre-deploy backups
          cd ~/backups/textstack && ls -1t pre-deploy-*.sql.gz 2>/dev/null | tail -n +6 | xargs -r rm -v

      - name: Pull latest code
        run: |
          cd $PROJECT_DIR
          git fetch origin
          if [ -n "${{ github.event.inputs.rollback_commit }}" ]; then
            git checkout ${{ github.event.inputs.rollback_commit }}
          else
            git checkout main
            git pull origin main
          fi

      # The frontend that reaches production is built by this job, and until now
      # on whatever Node the runner happened to have — no setup-node, no pin,
      # nothing that would notice a drift. It is checked rather than installed:
      # this job has no `actions/checkout` (it works inside $PROJECT_DIR), so
      # node-version-file has nothing to read, and silently swapping the
      # runtime under a production deploy is worse than refusing to run.
      #
      # Placed after the pull so .nvmrc is the version this commit asks for,
      # and before the build, so a mismatch stops the deploy while it is still
      # only a git checkout.
      - name: Check the runner's Node against .nvmrc
        run: |
          cd $PROJECT_DIR
          want=$(tr -d '[:space:]' < .nvmrc)
          have=$(node -v | sed 's/^v//')
          echo "runner: Node v$have · .nvmrc: $want"
          if [ "$have" != "$want" ]; then
            echo "::error::Deploy runner is on Node $have, this commit expects $want. Install it: asdf install nodejs $want (asdf reads .nvmrc here — ~/.asdfrc has legacy_version_file = yes). The production frontend is built on this machine."
            exit 1
          fi

      - name: Snapshot SSG dir + referenced assets before vite wipes dist
        # Closes the deploy-race window where vite's emptyOutDir=true
        # nukes dist/ssg/ AND dist/assets/* before the SSG worker can
        # regenerate (5-10 min gap). During that gap, bots hit /en/books/*,
        # /en/authors/*, etc. → 404 spa (nginx falls back when SSG file
        # missing). Solution: snapshot the existing dist/ssg/ + every asset
        # transitively referenced by it (HTML→JS→imports→CSS→url() fonts)
        # to a folder OUTSIDE dist/. After vite finishes, restore both.
        # Result: bots get old SSG referencing old (preserved) assets until
        # SSG worker atomic-swaps in fresh files. No more 404 window.
        #
        # BFS through JS+CSS files is what tripped up the original Wave 4
        # prune (5e4070a): a naive HTML-only scan misses React.lazy()
        # chunks (string-literal imports inside the main bundle) and
        # fonts referenced from CSS via url(). The fixed-point loop here
        # walks the full reachability graph.
        run: |
          set -e
          DIST=$PROJECT_DIR/apps/web/dist
          STAGING=$PROJECT_DIR/apps/web/.ssg-staging
          # Never clear staging before knowing there is something to replace
          # it with. This used to `rm -rf "$STAGING"` first and check second,
          # so a deploy starting after a previous one died mid-flight would
          # destroy the only copy of 1990 prerendered pages before discovering
          # dist/ssg was already gone. Three such deploys sat queued behind a
          # build that hung for 76 minutes; the first to run would have done it.
          if [ ! -d "$DIST/ssg" ]; then
            if [ -d "$STAGING/ssg" ]; then
              echo "dist/ssg missing and staging holds a copy — a previous deploy died between snapshot and restore."
              echo "Leaving staging alone; the restore step will put it back."
            else
              echo "No existing dist/ssg — first deploy, nothing to preserve"
            fi
            exit 0
          fi

          rm -rf "$STAGING"
          mkdir -p "$STAGING/assets"

          ALL_REFS=$(mktemp)
          # Pass 1: refs from SSG HTML files
          find "$DIST/ssg" -name '*.html' -print0 2>/dev/null \
            | xargs -0 -r grep -ohE 'assets/[A-Za-z0-9_.-]+\.(js|css|mjs|cjs|woff2?|ttf|otf|eot|png|jpg|jpeg|svg|webp|gif|ico|map)' 2>/dev/null \
            | awk -F/ '{print $NF}' | sort -u > "$ALL_REFS"

          # Pass 2..N: BFS through JS/CSS files in REFS (lazy imports, url() fonts)
          PREV=0
          CUR=$(wc -l < "$ALL_REFS" | tr -d ' ')
          while [ "$CUR" != "$PREV" ]; do
            PREV=$CUR
            FILES_NUL=$(while IFS= read -r f; do
              case "$f" in
                *.js|*.css|*.mjs|*.cjs) [ -f "$DIST/assets/$f" ] && printf '%s\0' "$DIST/assets/$f" ;;
              esac
            done < "$ALL_REFS")
            if [ -n "$FILES_NUL" ]; then
              printf '%s' "$FILES_NUL" \
                | xargs -0 -r grep -ohE 'assets/[A-Za-z0-9_.-]+\.(js|css|mjs|cjs|woff2?|ttf|otf|eot|png|jpg|jpeg|svg|webp|gif|ico|map)' 2>/dev/null \
                | awk -F/ '{print $NF}' >> "$ALL_REFS"
              sort -u "$ALL_REFS" -o "$ALL_REFS"
            fi
            CUR=$(wc -l < "$ALL_REFS" | tr -d ' ')
          done

          # Move SSG out, copy referenced assets out
          # Copy then remove, not `mv`. A move leaves exactly one copy, and
          # for the length of the build that copy lives somewhere nothing
          # serves. When the build hung, that was the site's entire prerendered
          # output — invisible to nginx and to anyone looking in dist/. The
          # extra disk is worth the window not existing.
          cp -a "$DIST/ssg" "$STAGING/ssg"
          rm -rf "$DIST/ssg"
          COPIED=0
          while IFS= read -r f; do
            if [ -f "$DIST/assets/$f" ]; then
              cp "$DIST/assets/$f" "$STAGING/assets/$f"
              COPIED=$((COPIED + 1))
            fi
          done < "$ALL_REFS"
          rm "$ALL_REFS"

          # Sanity: if SSG had files but we preserved 0 assets, grep/find
          # broke silently (set -e + 2>/dev/null masks failures upstream).
          # Restoring SSG without companion assets ships 404'd CSS to bots
          # for the rebuild window. Fail loud — operator can re-run.
          SSG_COUNT=$(find "$STAGING/ssg" -name index.html | wc -l | tr -d ' ')
          if [ "$SSG_COUNT" -gt 0 ] && [ "$COPIED" -eq 0 ]; then
            echo "FAIL: snapshot preserved $SSG_COUNT SSG files but 0 assets — graph extraction broken (check grep/find availability)"
            exit 1
          fi
          echo "Preserved $SSG_COUNT SSG files + $COPIED assets"

      - name: Build frontend
        # --frozen-lockfile to match ci.yml — prevents transitive deps from
        # silently drifting between CI and deploy, which would produce
        # different chunk hashes per build and bloat the snapshot/restore
        # legacy-asset pool unnecessarily.
        #
        # VITE_GOOGLE_CLIENT_ID is set here (not via prod's
        # apps/web/.env.production which is gitignored, stale from Jan 10
        # with the OLD project ID 301013894506-...). Mismatch with backend
        # Google__ClientId (726577729877-...) caused all /api/auth/google
        # POST to return 401 — silently broke login for months. OAuth
        # client_id is public-by-design (visible in bundle HTML), safe in
        # repo.
        env:
          # Corepack asks "Do you want to continue? [Y/n]" the first time it
          # fetches a package manager it has not cached. On a self-hosted runner
          # nobody answers, so the step waits forever — this hung for 76
          # minutes, holding the deploy open between the snapshot step that
          # MOVES dist/ssg aside and the restore step that puts it back, with
          # 1990 prerendered pages stranded in staging and crawlers getting 404.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          # From the workspace root: one lockfile, and `catalog:` specifiers
          # only resolve with pnpm-workspace.yaml in scope. Installing from
          # inside apps/web stopped being a thing that works.
          cd $PROJECT_DIR
          # `corepack pnpm`, not a bare `pnpm`. The runner resolves Node with
          # asdf, and a bare `pnpm` is an asdf shim built for whichever Node was
          # active when it was created — under a different Node it fails with
          # "No preset version installed for command pnpm" even though corepack
          # has just prepared it. Verified on the runner: `corepack pnpm
          # --version` answers correctly with no reshim. corepack reads the
          # version from `packageManager` in the root package.json.
          corepack enable
          corepack pnpm install --frozen-lockfile
          VITE_API_URL=/api \
            VITE_STORAGE_URL=https://textstack.app \
            VITE_CANONICAL_URL=https://textstack.app \
            VITE_GOOGLE_CLIENT_ID=726577729877-0lc197ngqf9qb297tvgh22q2k7g72l4l.apps.googleusercontent.com \
            corepack pnpm --filter textstack-web build

      - name: Restore preserved SSG + assets
        # vite has now wiped dist/ and written fresh assets/. Put the
        # snapshot back: ssg/ goes back as-is; assets are restored
        # non-clobbering (vite's new files win where names collide).
        # Result: dist/assets/ now contains both NEW (vite) and OLD
        # (preserved-because-SSG-referenced) bundles, side-by-side.
        # SSG worker rebuilds dist/ssg/ atomically a few minutes later;
        # the next deploy's snapshot pass naturally drops these OLD
        # assets (no longer referenced by the new SSG). Self-cleaning.
        run: |
          set -e
          DIST=$PROJECT_DIR/apps/web/dist
          STAGING=$PROJECT_DIR/apps/web/.ssg-staging

          [ -d "$STAGING" ] || { echo "No staging — skip restore"; exit 0; }

          if [ -d "$STAGING/ssg" ]; then
            rm -rf "$DIST/ssg"
            cp -a "$STAGING/ssg" "$DIST/ssg"
            echo "Restored SSG dir ($(find "$DIST/ssg" -name index.html | wc -l) files)"
            # Only now is dropping the copy safe: the pages are back where
            # nginx serves them.
            rm -rf "$STAGING/ssg"
          fi

          RESTORED=0
          if [ -d "$STAGING/assets" ]; then
            while IFS= read -r f; do
              base=$(basename "$f")
              if [ ! -e "$DIST/assets/$base" ]; then
                cp "$f" "$DIST/assets/$base"
                RESTORED=$((RESTORED + 1))
              fi
            done < <(find "$STAGING/assets" -type f)
          fi
          rm -rf "$STAGING"
          echo "Restored $RESTORED legacy assets (the rest were superseded by vite)"

      - name: Fix cache volume permissions
        # Container runs as uid 1000 but host-mounted cache dirs default to
        # root ownership. Without this, every translate/explain/tts cache
        # write logs a permission error. Idempotent.
        run: |
          cd $PROJECT_DIR
          make fix-permissions

      - name: Deploy containers
        # docker-compose.gpu.yml is a prod-only overlay that adds
        # `runtime: nvidia` + GPU device reservation to the ollama service.
        # CI runners don't have nvidia-container-toolkit, so it's NOT in
        # the default compose file (that would break the ci/docker job).
        run: |
          cd $PROJECT_DIR
          # Stamp the deployed commit into the images as SENTRY_RELEASE (build arg →
          # ENV). Without a release Sentry can't do regression detection or tell you
          # which deploy an issue started with. .dockerignore excludes .git, so the
          # build arg is the only way in.
          export GIT_SHA=$(git rev-parse --short HEAD)
          echo "Deploying release $GIT_SHA"
          # --profile mcp brings up the remote MCP server (mcp-server) in prod.
          # It's profile-gated so CI's bare `compose up` (docker/e2e jobs) never
          # builds/runs it; prod opts in here. nginx /mcp is synced below.
          docker compose --profile mcp -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

      - name: Sync nginx config
        run: |
          cd $PROJECT_DIR
          # /etc/nginx/sites-available/textstack is vasyl:vasyl 664, so cp works
          # without sudo. Only nginx -t and reload need sudo (passwordless via
          # sudoers for nginx/systemctl).
          if ! diff -q infra/nginx/textstack.conf /etc/nginx/sites-available/textstack > /dev/null 2>&1; then
            echo "nginx config changed — syncing"
            cp infra/nginx/textstack.conf /etc/nginx/sites-available/textstack
            sudo nginx -t
            sudo systemctl reload nginx
            echo "nginx reloaded"
          else
            echo "nginx config unchanged — skip reload"
          fi

      - name: Wait for services
        run: sleep 30

      - name: Health check API
        run: |
          curl -sf http://localhost:8080/health || exit 1
          echo "API health check passed"

      - name: Queue SSG rebuild
        run: |
          # Stamp the moment we asked, so the wait below can require a swap that happened
          # *after* it rather than guessing from a file's age.
          echo "SSG_QUEUED_AT=$(date +%s)" >> $GITHUB_ENV
          curl -sf -X POST http://localhost:8080/internal/ssg/rebuild-all && echo "SSG rebuild queued" || echo "SSG rebuild queue failed (non-blocking)"

      - name: Health check frontend
        run: |
          curl -sf http://localhost:80 || exit 1
          echo "Frontend health check passed"

      - name: Health check MCP server
        run: |
          # mcp-server is localhost-only on :8090; nginx fronts /mcp.
          curl -sf http://localhost:8090/health || { echo "FAIL: mcp-server /health down"; exit 1; }
          echo "mcp-server /health OK"
          # MCP streamable endpoint through nginx (Host-routed, like a real client).
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Host: textstack.app" \
            -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"deploy-check","version":"1"}}}' \
            http://localhost/mcp)
          [ "$CODE" = "200" ] && echo "nginx /mcp → MCP initialize 200 OK" || { echo "FAIL: /mcp returned $CODE"; exit 1; }

      - name: Verify SEO setup
        run: |
          echo "=== SPA serves real users ==="
          HEADER=$(curl -sf -o /dev/null -w '%{http_code}' -H "Host: textstack.app" http://localhost/en/)
          [ "$HEADER" = "200" ] && echo "SPA 200 OK" || { echo "SPA failed: $HEADER"; exit 1; }

          SPA_RENDER=$(curl -sf -I -H "Host: textstack.app" http://localhost/en/ | grep -i x-seo-render | tr -d '\r')
          echo "Real user: $SPA_RENDER"
          echo "$SPA_RENDER" | grep -qi "spa" || { echo "FAIL: real user not getting SPA"; exit 1; }

          echo "=== Bot detection active ==="
          BOT_RENDER=$(curl -sf -I -H "Host: textstack.app" -H "User-Agent: Googlebot/2.1" http://localhost/en/ | grep -i x-seo-render | tr -d '\r')
          echo "Bot: $BOT_RENDER"
          # Bot gets SSG if files exist, SPA fallback if not — both are OK post-deploy
          # But header MUST be present (proves nginx config is loaded)
          [ -n "$BOT_RENDER" ] && echo "Bot detection OK" || { echo "FAIL: x-seo-render header missing for bot"; exit 1; }

          echo "=== nginx bot map configured ==="
          grep -q 'map.*is_bot' /etc/nginx/sites-available/textstack || { echo "FAIL: bot map missing from nginx"; exit 1; }
          echo "Bot map found in nginx config"

      - name: Wait for SSG rebuild to complete
        run: |
          # Queue SSG rebuild step is async. Poll until the job finishes.
          # ssg-worker bind mount: ./apps/web/dist:/app/dist, so files atomic-swapped
          # by worker appear at $PROJECT_DIR/apps/web/dist/ssg on host.
          SSG_DIR=$PROJECT_DIR/apps/web/dist/ssg
          [ -d "$SSG_DIR" ] || { echo "No SSG dir yet — skipping wait"; exit 0; }

          # A full rebuild renders ~2000 routes and has taken ~25 min; the old 10-minute
          # deadline expired on every honest rebuild and then `exit 0`, so "SSG never
          # refreshed" and "SSG refreshed fine" produced the same green deploy. Both halves
          # were wrong: the budget is now 40 min, and running out of it fails the step.
          DEADLINE=$(( $(date +%s) + 2400 ))
          SENTINEL="$SSG_DIR/en/books/dracula/index.html"
          # Not "is the file recent" — that has no honest window. A 15-minute window expired on
          # every real rebuild; widening it to 45 made a tree from the previous rebuild look
          # current and the wait returned in zero seconds. The question is whether a swap
          # happened after we queued, which is a comparison, not a guess.
          SINCE=${SSG_QUEUED_AT:-0}
          until [ -f "$SENTINEL" ] && [ "$(stat -c %Y "$SENTINEL")" -gt "$SINCE" ]; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "FAIL: SSG rebuild did not finish within 40 min — crawlers may be served a stale or partial tree"
              exit 1
            fi
            echo "Waiting for SSG rebuild… ($(date))"
            sleep 30
          done
          echo "SSG rebuild complete"

      - name: Validate SSG content
        run: |
          # Catch skeleton-only SSG files (empty <h1>, only skeleton divs). Silent-save bug
          # from before P0.5 left 247 stale shells on disk for 3 months.
          SSG_DIR=$PROJECT_DIR/apps/web/dist/ssg
          [ -d "$SSG_DIR" ] || { echo "SSG dir missing: $SSG_DIR (skipping — first deploy)"; exit 0; }

          TOTAL=$(find "$SSG_DIR" -name index.html | wc -l)
          [ "$TOTAL" -eq 0 ] && { echo "No SSG files yet (rebuild pending) — skip"; exit 0; }

          # Quality was checked; quantity was not. On 2026-08-31 the tree held 104 author
          # pages, 23 genres and zero books — every surviving file had a valid <h1>, so this
          # step passed while the entire catalogue was 404 to crawlers. Compare against the
          # route list the rebuild was given.
          EXPECTED=$(curl -sf http://localhost:8080/ssg/routes | grep -o '"/[^"]*"' | wc -l)
          if [ "$EXPECTED" -gt 0 ]; then
            FLOOR=$(( EXPECTED * 9 / 10 ))
            if [ "$TOTAL" -lt "$FLOOR" ]; then
              echo "FAIL: SSG holds $TOTAL pages, expected at least $FLOOR of $EXPECTED routes."
              echo "Whole sections are missing — a concurrent rebuild or a wiped dist, not a few bad renders."
              find "$SSG_DIR" -mindepth 2 -maxdepth 2 -type d | sed 's/^/  section: /'
              exit 1
            fi
            echo "SSG coverage: $TOTAL pages against $EXPECTED routes (floor $FLOOR)"
          else
            echo "Could not read route list — skipping coverage check"
          fi

          BAD=0
          SAMPLES=""
          while IFS= read -r f; do
            # Must have a real H1, and must not end with a bare skeleton div
            if ! grep -q '<h1' "$f" || grep -q '__skeleton"></div></div></div>$' "$f"; then
              BAD=$((BAD + 1))
              [ "$BAD" -le 3 ] && SAMPLES="$SAMPLES\n  $f"
            fi
          done < <(find "$SSG_DIR" -name index.html)

          echo "SSG files: $TOTAL, bad: $BAD"
          if [ "$BAD" -gt 0 ]; then
            printf "FAIL: %d SSG files lack <h1> or are skeleton-only. Samples:%b\n" "$BAD" "$SAMPLES"
            exit 1
          fi
          echo "SSG content validation passed"

          echo "All SEO checks passed"

      # NB: asset prune intentionally absent. A naive HTML+CSS reference
      # scan misses React.lazy() dynamic imports (they're string-literals
      # inside the main JS bundle, not <link rel=modulepreload>). The first
      # version of this step in 5e4070a deleted every lazy chunk on prod
      # (Highlights/Reader/Library/Stats/Vocabulary all 404'd until rollback
      # rebuilt). Disk growth from --emptyOutDir=false is ~600 KB/deploy;
      # add a manifest-driven cleanup as a Makefile target before re-adding
      # to the deploy critical path.

      - name: Restart systemd pollers
        # GH Actions runner job doesn't inherit a user DBus session, so plain
        # `systemctl --user` returned an error and fell through to the "not
        # installed" branch — silently skipping the restart for ~weeks. Set
        # XDG_RUNTIME_DIR explicitly so the user-systemd is reachable
        # (linger=yes is already enabled for vasyl, so /run/user/1000 exists
        # independent of login sessions).
        env:
          XDG_RUNTIME_DIR: /run/user/1000
        run: |
          systemctl --user restart seo-publish-poller && echo "SEO Publish poller restarted" || echo "SEO Publish poller restart FAILED"
          systemctl --user restart seo-backfill-poller && echo "SEO Backfill poller restarted" || echo "SEO Backfill poller restart FAILED (run: make seo-backfill-setup if not installed)"

      - name: Cleanup old images
        run: docker image prune -f
