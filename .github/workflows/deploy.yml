name: Deploy
# A rollback deploys `rollback_commit`, not the run's head_sha, and the API exposes no
# inputs: this title is how ghcr-retention.yml knows which images are live. Empty
# (push, plain dispatch) = GitHub's default title.
run-name: ${{ inputs.rollback_commit != '' && format('Rollback to {0}', inputs.rollback_commit) || '' }}

on:
  push:
    branches: [main]
    # A docs-only merge has nothing to ship. Root-level *.md only — `*` stops at
    # `/`, deliberately: markdown inside code directories is code here
    # (Application embeds ChapterReview/ReviewMethod.md). A push touching docs AND
    # anything else still deploys; workflow_dispatch is unaffected.
    #
    # Mobile and the browser extension never reach the server: mobile ships by OTA
    # (mobile-ota.yml), the extension by hand. NEVER add packages/**, the lockfile or
    # pnpm-workspace.yaml here — the admin, ssg-worker and web images (and the
    # server's fallback web build) consume them.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'apps/mobile/**'
      - 'apps/web/e2e/**'   # Playwright specs; no image or web build reads them
      - 'extension/**'
      - '.github/workflows/mobile-*.yml'
  workflow_dispatch:
    inputs:
      rollback_commit:
        description: 'Commit SHA on main to roll back to (7-40 hex; optional)'
        required: false
      rebuild_ssg:
        description: 'Full SSG rebuild now (otherwise it runs nightly after the backup)'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Read-only by default; `images` widens itself to packages: write.
permissions:
  contents: read

env:
  PROJECT_DIR: /home/vasyl/projects/onlinelib/textstack
  # Opt JS actions into Node 24 ahead of June 2026 forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Rollbacks only. `rollback_commit` is typed by a human and ends up in
  # `git checkout` on the production box and as the ref `images` builds and
  # publishes, so it must be a commit that is already on main: hex only (no
  # option or ref syntax), resolved here in a full clone of main, and an ancestor
  # of origin/main (a fork commit fetched by SHA is not). Everything downstream
  # uses the full SHA this job prints, never the raw input. Skipped on a push.
  guard:
    if: github.event.inputs.rollback_commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          ROLLBACK: ${{ github.event.inputs.rollback_commit }}
        run: |
          [[ $ROLLBACK =~ ^[0-9a-f]{7,40}$ ]] \
            || { echo "::error::rollback_commit must be 7-40 lowercase hex characters"; exit 1; }
          sha=$(git rev-parse --verify --quiet "$ROLLBACK^{commit}") \
            || { echo "::error::$ROLLBACK is not a commit in this repository (or is ambiguous)"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$sha is not on main — only a commit already merged can be deployed"; exit 1; }
          echo "Rolling back to $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Not the whole suite. The pull request already ran it; what this adds is the
  # one thing a pull request cannot prove under `strict: false` branch
  # protection — that the MERGED tree still compiles and passes. That is
  # `backend` and `frontend`; `ci.yml` explains what is skipped and why,
  # including the deliberate omission of `e2e`.
  #
  # It used to run all nine jobs, and the server then rebuilt the images itself
  # anyway, so a deploy spent about thirty minutes re-proving the pull request.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      scope: merged-tree

  # Builds and pushes the images for this commit (or the rollback commit) on a
  # GitHub-hosted runner, in parallel with `ci`. A job in the same run rather than
  # a separate workflow the server polls for: `needs` gives the exact SHA with no
  # timeout to guess and no race, and the rollback input reaches it directly.
  images:
    needs: guard
    if: ${{ !cancelled() && needs.guard.result != 'failure' }}
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.guard.outputs.sha }}

  deploy:
    needs: [guard, ci, images]
    # A failed `images` must not block a deploy: the server builds instead, as it
    # always did. A failed `ci` or `guard` still does.
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.guard.result != 'failure' }}
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    # 2m typical, 30m at worst.
    timeout-minutes: 60

    steps:
      - name: Pull latest code
        env:
          # Set only on a rollback, and only after `guard` proved it is on main.
          ROLLBACK_SHA: ${{ needs.guard.outputs.sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          cd $PROJECT_DIR
          git fetch origin
          # The scanner comes from THIS workflow's commit, not the checkout below: a
          # rollback target may predate the script or its --dir mode, and a scan that
          # cannot run would stop a break-glass deploy halfway. Every scan in this run
          # uses this copy. (Everything else run from $PROJECT_DIR — Makefile, compose,
          # nginx config — is meant to be the target commit's.)
          git show "$RUN_SHA:scripts/scan-image-secrets.sh" > "$RUNNER_TEMP/scan-image-secrets.sh"
          chmod +x "$RUNNER_TEMP/scan-image-secrets.sh"
          # Same reason: the web swap, the SSG restore and the web build's public values.
          git show "$RUN_SHA:scripts/swap-web-dist.sh" > "$RUNNER_TEMP/swap-web-dist.sh"
          git show "$RUN_SHA:scripts/restore-ssg-staging.sh" > "$RUNNER_TEMP/restore-ssg-staging.sh"
          git show "$RUN_SHA:apps/web/production.env" > "$RUNNER_TEMP/production.env"
          if [ -n "$ROLLBACK_SHA" ]; then
            # Checked again against this clone: guard ran on GitHub's copy.
            if ! [[ $ROLLBACK_SHA =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$ROLLBACK_SHA" origin/main; then
              echo "::error::$ROLLBACK_SHA is not on origin/main here"; exit 1
            fi
            git checkout "$ROLLBACK_SHA"
          else
            # This run's own commit, not main's tip: the images job built exactly
            # github.sha, and a newer merge queued behind us gets its own run.
            # ff-only: re-running an older deploy fails loudly — use rollback_commit.
            git checkout main
            git merge --ff-only "$RUN_SHA"
          fi

      # The web bundle `images` built, scanned and pushed (job `web`), pulled by digest
      # and copied out of its image into $RUNNER_TEMP/web-dist. Nothing live changes
      # here: "Secret scan web dist" checks it against the server's real values, then
      # "Put web bundle live" swaps it in. No digest (images failed or was skipped, a
      # commit from before the web image) or a failed pull → the server builds it, as
      # it used to: the steps marked "fallback" below.
      - name: Fetch web bundle
        id: web
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DIGEST: ${{ needs.images.outputs.web_digest }}
        run: |
          cd "$PROJECT_DIR"
          IMAGE=ghcr.io/${{ github.repository_owner }}/textstack-web
          TAG=$(git rev-parse HEAD)
          OUT=$RUNNER_TEMP/web-dist
          rm -rf "$OUT"
          ok=false
          if [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            # Throwaway config, as in "Deploy containers": the token never lands in ~/.docker.
            DOCKER_CONFIG=$(mktemp -d) && export DOCKER_CONFIG
            if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin \
              && timeout 300 docker pull "$IMAGE@$DIGEST"; then
              ok=true
            fi
            rm -rf "$DOCKER_CONFIG"; unset DOCKER_CONFIG
          fi
          if [ "$ok" = true ]; then
            # Tagged so "Cleanup old images" treats it like the others.
            docker tag "$IMAGE@$DIGEST" "$IMAGE:$TAG" || true
            # Never started: scratch has no command and `docker create` wants one.
            if c=$(docker create "$IMAGE@$DIGEST" /none); then
              docker cp "$c:/dist" "$OUT" || ok=false
              docker rm "$c" > /dev/null || true
            else
              ok=false
            fi
          fi
          if [ "$ok" = true ] && [ -f "$OUT/index.html" ]; then
            echo "Web bundle $IMAGE@$DIGEST → $OUT ($(du -sh "$OUT" | cut -f1))"
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Web bundle for $TAG not pulled — building it on the server"
            rm -rf "$OUT"
            echo "pulled=false" >> "$GITHUB_OUTPUT"
          fi

      # Fallback only. A server build of the frontend once ran on whatever Node the
      # runner happened to have — no setup-node, no pin,
      # nothing that would notice a drift. It is checked rather than installed:
      # this job has no `actions/checkout` (it works inside $PROJECT_DIR), so
      # node-version-file has nothing to read, and silently swapping the
      # runtime under a production deploy is worse than refusing to run.
      #
      # Placed after the pull so .nvmrc is the version this commit asks for,
      # and before the build, so a mismatch stops the deploy while it is still
      # only a git checkout.
      - name: Check the runner's Node against .nvmrc
        if: steps.web.outputs.pulled != 'true'
        run: |
          cd $PROJECT_DIR
          want=$(tr -d '[:space:]' < .nvmrc)
          have=$(node -v | sed 's/^v//')
          echo "runner: Node v$have · .nvmrc: $want"
          if [ "$have" != "$want" ]; then
            echo "::error::Deploy runner is on Node $have, this commit expects $want. Install it: asdf install nodejs $want (asdf reads .nvmrc here — ~/.asdfrc has legacy_version_file = yes). The web bundle was not pulled, so the frontend is built on this machine."
            exit 1
          fi

      # Never deploy while an SSG rebuild is rendering: "Deploy containers" recreates
      # ssg-worker (its image tag changes every deploy), and the fallback frontend build empties
      # apps/web/dist, which ssg-worker writes into (dist/ssg-new); a rebuild caught in that
      # window fails by design (assertBuildSurvived — the 2026-08-31 guard) and leaves
      # ssg-worker unhealthy. Rebuilds come from the nightly backup, the admin button and make rebuild-ssg,
      # so any of them can be mid-run when a merge lands.
      # Waits up to 40 min (a full rebuild is ~25), then proceeds with a warning: a wedged
      # job must not block deploys forever, and the guard still protects the live tree.
      # Only jobs touched in the last hour count: ssg-worker fails a job left 'Running' only when it
      # next starts (ADR-022), and one such row would otherwise cost every deploy the full 40 minutes.
      - name: Wait for any running SSG rebuild
        run: |
          DEADLINE=$(( $(date +%s) + 2400 ))
          while :; do
            ACTIVE=$(docker exec textstack_db_prod psql -U textstack_prod textstack_prod -tAc \
              "SELECT count(*) FROM ssg_rebuild_jobs WHERE status IN ('Queued','Running') AND COALESCE(started_at, created_at) > now() - interval '60 minutes'" 2>/dev/null | tr -d '[:space:]')
            [ "$ACTIVE" = "0" ] && { echo "No SSG rebuild in progress"; break; }
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::warning::SSG rebuild still active after 40 min — deploying anyway"
              break
            fi
            echo "SSG rebuild in progress ($ACTIVE active) — waiting… ($(date +%T))"
            sleep 30
          done

      # After the SSG wait, before anything live changes (the web swap or fallback
      # build rewrites the served dist/). A failed dump therefore ships nothing: same site, same
      # containers. Not at the start of the run and not in a parallel job: CI, images
      # and the up-to-40-min SSG wait could then put an hour of writes between the
      # dump and a bad migration, all lost on restore. Here it is minutes before the
      # migrator (next: web scan + swap or fallback build, "Deploy containers"). Correctness of the
      # rollback point beats the ~2.5 min this costs.
      - name: Pre-deploy backup
        run: |
          mkdir -p ~/backups/textstack
          DATE=$(date +%F-%H%M)
          # pipefail + trailer check: a failed pg_dump used to leave an empty archive
          # and let the deploy proceed with no usable rollback point.
          set -o pipefail
          docker exec textstack_db_prod pg_dump -U textstack_prod textstack_prod | gzip > ~/backups/textstack/pre-deploy-$DATE.sql.gz
          zcat ~/backups/textstack/pre-deploy-$DATE.sql.gz | tail -n 5 | grep -q 'PostgreSQL database dump complete' \
            || { echo "::error::pre-deploy dump is incomplete"; exit 1; }
          echo "Backup created: pre-deploy-$DATE.sql.gz"
          # Keep only the 2 newest pre-deploy backups
          cd ~/backups/textstack && ls -1t pre-deploy-*.sql.gz 2>/dev/null | tail -n +3 | xargs -r rm -v

      # Vite reads apps/web/.env* and inlines VITE_* values into public JS. Nothing
      # here needs those files — the four VITE_ variables the code reads come from
      # apps/web/production.env (the fallback build below exports them, and the
      # environment wins over any file) — and the box had a stale,
      # gitignored .env.production (wrong Google client id). Moved aside, not
      # deleted, before the snapshot step, so this step can never strand dist/ssg.
      - name: Move stray web env files aside
        run: |
          cd "$PROJECT_DIR/apps/web"
          for f in .env .env.local .env.production .env.production.local; do
            [ -e "$f" ] || continue
            dest=~/backups/textstack/stray-web-env/$(date +%F-%H%M%S)
            mkdir -p "$dest" && mv "$f" "$dest/"
            echo "::warning::moved apps/web/$f to $dest — vite must not read it"
          done

      - name: Snapshot SSG dir + referenced assets before vite wipes dist
        # Fallback only: a pulled bundle never wipes dist (scripts/swap-web-dist.sh).
        if: steps.web.outputs.pulled != 'true'
        # Closes the deploy-race window where vite's emptyOutDir=true
        # nukes dist/ssg/ AND dist/assets/* before the SSG worker can
        # regenerate (5-10 min gap). During that gap, bots hit /en/books/*,
        # /en/authors/*, etc. → 404 spa (nginx falls back when SSG file
        # missing). Solution: snapshot the existing dist/ssg/ + every asset
        # transitively referenced by it (HTML→JS→imports→CSS→url() fonts)
        # to a folder OUTSIDE dist/. After vite finishes, restore both.
        # Result: bots get old SSG referencing old (preserved) assets until
        # SSG worker atomic-swaps in fresh files. No more 404 window.
        #
        # BFS through JS+CSS files is what tripped up the original Wave 4
        # prune (5e4070a): a naive HTML-only scan misses React.lazy()
        # chunks (string-literal imports inside the main bundle) and
        # fonts referenced from CSS via url(). The fixed-point loop here
        # walks the full reachability graph.
        run: |
          set -e
          DIST=$PROJECT_DIR/apps/web/dist
          STAGING=$PROJECT_DIR/apps/web/.ssg-staging
          # Never clear staging before knowing there is something to replace
          # it with. This used to `rm -rf "$STAGING"` first and check second,
          # so a deploy starting after a previous one died mid-flight would
          # destroy the only copy of 1990 prerendered pages before discovering
          # dist/ssg was already gone. Three such deploys sat queued behind a
          # build that hung for 76 minutes; the first to run would have done it.
          if [ ! -d "$DIST/ssg" ]; then
            if [ -d "$STAGING/ssg" ]; then
              echo "dist/ssg missing and staging holds a copy — a previous deploy died between snapshot and restore."
              echo "Leaving staging alone; the restore step will put it back."
            else
              echo "No existing dist/ssg — first deploy, nothing to preserve"
            fi
            exit 0
          fi

          rm -rf "$STAGING"
          mkdir -p "$STAGING/assets"

          ALL_REFS=$(mktemp)
          # Pass 1: refs from SSG HTML files
          find "$DIST/ssg" -name '*.html' -print0 2>/dev/null \
            | xargs -0 -r grep -ohE 'assets/[A-Za-z0-9_.-]+\.(js|css|mjs|cjs|woff2?|ttf|otf|eot|png|jpg|jpeg|svg|webp|gif|ico|map)' 2>/dev/null \
            | awk -F/ '{print $NF}' | sort -u > "$ALL_REFS"

          # Pass 2..N: BFS through JS/CSS files in REFS (lazy imports, url() fonts)
          PREV=0
          CUR=$(wc -l < "$ALL_REFS" | tr -d ' ')
          while [ "$CUR" != "$PREV" ]; do
            PREV=$CUR
            FILES_NUL=$(while IFS= read -r f; do
              case "$f" in
                *.js|*.css|*.mjs|*.cjs) [ -f "$DIST/assets/$f" ] && printf '%s\0' "$DIST/assets/$f" ;;
              esac
            done < "$ALL_REFS")
            if [ -n "$FILES_NUL" ]; then
              printf '%s' "$FILES_NUL" \
                | xargs -0 -r grep -ohE 'assets/[A-Za-z0-9_.-]+\.(js|css|mjs|cjs|woff2?|ttf|otf|eot|png|jpg|jpeg|svg|webp|gif|ico|map)' 2>/dev/null \
                | awk -F/ '{print $NF}' >> "$ALL_REFS"
              sort -u "$ALL_REFS" -o "$ALL_REFS"
            fi
            CUR=$(wc -l < "$ALL_REFS" | tr -d ' ')
          done

          # Move SSG out, copy referenced assets out
          # Copy then remove, not `mv`. A move leaves exactly one copy, and
          # for the length of the build that copy lives somewhere nothing
          # serves. When the build hung, that was the site's entire prerendered
          # output — invisible to nginx and to anyone looking in dist/. The
          # extra disk is worth the window not existing.
          cp -a "$DIST/ssg" "$STAGING/ssg"
          rm -rf "$DIST/ssg"
          COPIED=0
          while IFS= read -r f; do
            if [ -f "$DIST/assets/$f" ]; then
              cp "$DIST/assets/$f" "$STAGING/assets/$f"
              COPIED=$((COPIED + 1))
            fi
          done < "$ALL_REFS"
          rm "$ALL_REFS"

          # Sanity: if SSG had files but we preserved 0 assets, grep/find
          # broke silently (set -e + 2>/dev/null masks failures upstream).
          # Restoring SSG without companion assets ships 404'd CSS to bots
          # for the rebuild window. Fail loud — operator can re-run.
          SSG_COUNT=$(find "$STAGING/ssg" -name index.html | wc -l | tr -d ' ')
          if [ "$SSG_COUNT" -gt 0 ] && [ "$COPIED" -eq 0 ]; then
            echo "FAIL: snapshot preserved $SSG_COUNT SSG files but 0 assets — graph extraction broken (check grep/find availability)"
            exit 1
          fi
          echo "Preserved $SSG_COUNT SSG files + $COPIED assets"

      - name: Build frontend
        # Fallback only — normally `images` builds this on GitHub (job `web`).
        if: steps.web.outputs.pulled != 'true'
        # --frozen-lockfile to match ci.yml — prevents transitive deps from
        # silently drifting between CI and deploy, which would produce
        # different chunk hashes per build and bloat the snapshot/restore
        # legacy-asset pool unnecessarily.
        #
        # The VITE_ values come from apps/web/production.env at this workflow's
        # commit (copied by "Pull latest code"), the same file images.yml builds
        # with — not from prod's apps/web/.env.production, gitignored, stale from Jan 10
        # with the OLD project ID 301013894506-...). Mismatch with backend
        # Google__ClientId (726577729877-...) caused all /api/auth/google
        # POST to return 401 — silently broke login for months. OAuth
        # client_id is public-by-design (visible in bundle HTML), safe in
        # repo.
        env:
          # Corepack asks "Do you want to continue? [Y/n]" the first time it
          # fetches a package manager it has not cached. On a self-hosted runner
          # nobody answers, so the step waits forever — this hung for 76
          # minutes, holding the deploy open between the snapshot step that
          # MOVES dist/ssg aside and the restore step that puts it back, with
          # 1990 prerendered pages stranded in staging and crawlers getting 404.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          # From the workspace root: one lockfile, and `catalog:` specifiers
          # only resolve with pnpm-workspace.yaml in scope. Installing from
          # inside apps/web stopped being a thing that works.
          cd $PROJECT_DIR
          # `corepack pnpm`, not a bare `pnpm`. The runner resolves Node with
          # asdf, and a bare `pnpm` is an asdf shim built for whichever Node was
          # active when it was created — under a different Node it fails with
          # "No preset version installed for command pnpm" even though corepack
          # has just prepared it. Verified on the runner: `corepack pnpm
          # --version` answers correctly with no reshim. corepack reads the
          # version from `packageManager` in the root package.json.
          corepack enable
          corepack pnpm install --frozen-lockfile
          set -a; . "$RUNNER_TEMP/production.env"; set +a
          corepack pnpm --filter textstack-web build
          # dist holds only vite's output until the restore: record it as the live
          # release, so the next pulled swap removes what this one shipped and that does not.
          (cd apps/web/dist && find . -type f ! -path './assets/*' | sed 's#^\./##' | sort) > apps/web/.web-release

      - name: Restore preserved SSG + assets
        # Runs on both paths; the decision is scripts/restore-ssg-staging.sh (self-check
        # in ci.yml `frontend`).
        #  - Fallback (built): vite has wiped dist/ and written fresh assets/. Put the
        #    snapshot back: ssg/ as-is, assets non-clobbering (vite's new files win), so
        #    dist/assets holds the NEW bundle and the OLD one the SSG pages reference
        #    until ssg-worker swaps in a fresh tree; the next deploy's snapshot drops the
        #    OLD ones. Self-cleaning. Also recovers a deploy that died between snapshot
        #    and restore (the snapshot step leaves that staging alone).
        #  - Pulled: no snapshot ran, so any staging is from a deploy that died mid-flight.
        #    Restored only if dist/ssg is missing; if dist/ssg is live it is newer than
        #    the copy, so the copy is removed (with a warning) instead of rm -rf'ing the
        #    live tree to put older pages back.
        env:
          MODE: ${{ steps.web.outputs.pulled == 'true' && 'pulled' || 'built' }}
        run: bash "$RUNNER_TEMP/restore-ssg-staging.sh" "$MODE" "$PROJECT_DIR/apps/web/dist" "$PROJECT_DIR/apps/web/.ssg-staging"

      # The bundle every visitor downloads, scanned with the image scanner's patterns
      # plus the server's real secret values (names ending SECRET, PASSWORD, TOKEN,
      # API_KEY — INDEXNOW_KEY and the DSN are public by design). A hit prints the
      # file, never the value. Runs after the restore so a failure here can't strand
      # dist/ssg.
      #
      # A pulled bundle was already scanned on GitHub (patterns + canaries); this adds
      # the real values, which GitHub never sees, and it runs BEFORE the swap — a hit
      # stops the deploy with nothing live changed. Kept as defence in depth: seconds,
      # and the only check that knows the production secrets. Fallback limit: vite has
      # already replaced dist, so a hit stops the deploy (no new containers) but the
      # bundle is live — page the owner, rotate, redeploy.
      - name: Secret scan web dist
        env:
          PULLED: ${{ steps.web.outputs.pulled }}
        run: |
          cd "$PROJECT_DIR"
          SCAN_SECRET_VALUES=$(awk '/^[A-Z_][A-Z0-9_]*=/ { n = substr($0, 1, index($0, "=") - 1)
              if (n ~ /(SECRET|PASSWORD|TOKEN|API_KEY)$/) { v = substr($0, index($0, "=") + 1)
                gsub(/^["\047]|["\047]$/, "", v); print v } }' .env)
          export SCAN_SECRET_VALUES
          # Vite's output only (index.html + assets/): dist/ssg and dist/ssg-new are
          # Puppeteer's, rewritten by ssg-worker while this runs (a file vanishing
          # mid-grep is a scan error), and vite inlines env into neither.
          if [ "$PULLED" = true ]; then
            # The whole release (no SSG in it), before it is live.
            "$RUNNER_TEMP/scan-image-secrets.sh" --dir "$RUNNER_TEMP/web-dist"
          else
            web=$(mktemp -d "$RUNNER_TEMP/web-scan.XXXX")
            cp -a apps/web/dist/index.html apps/web/dist/assets "$web/"
            "$RUNNER_TEMP/scan-image-secrets.sh" --dir "$web"
            rm -rf "$web"
          fi

      # The pulled bundle goes live: assets first, then every other file, index.html
      # last, each renamed into place; dist/ssg* is never touched, so the SSG
      # snapshot/restore above is not needed on this path. Not a rename of dist itself:
      # ssg-worker bind-mounts it. Unreferenced old assets are pruned (one release of
      # grace for open tabs). Details and the self-check: scripts/swap-web-dist.sh.
      - name: Put web bundle live
        if: steps.web.outputs.pulled == 'true'
        run: bash "$RUNNER_TEMP/swap-web-dist.sh" "$RUNNER_TEMP/web-dist" "$PROJECT_DIR/apps/web/dist" "$PROJECT_DIR/apps/web/.web-release"

      - name: Fix cache volume permissions
        # Container runs as uid 1000 but host-mounted cache dirs default to
        # root ownership. Without this, every translate/explain/tts cache
        # write logs a permission error. Idempotent.
        run: |
          cd $PROJECT_DIR
          make fix-permissions

      - name: Deploy containers
        # docker-compose.gpu.yml is a prod-only overlay that adds
        # `runtime: nvidia` + GPU device reservation to the ollama service.
        # CI runners don't have nvidia-container-toolkit, so it's NOT in
        # the default compose file (that would break the ci/docker job).
        #
        # Images come from GHCR, built once by the `images` job for this exact
        # commit. If any pull fails (job failed, registry down, a commit from before
        # images were published) the server builds them itself, as it used to.
        #
        # Pulled by DIGEST (from the `images` job), then tagged :<sha> locally for
        # compose and for humans. A tag in GHCR can be re-pushed by anyone with
        # packages: write between build and pull; the digest is the exact bytes
        # that passed the scan. No digest for a service (images failed or was
        # skipped) → the same server-build fallback as a failed pull.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DIGESTS: ${{ needs.images.outputs.digests }}
        run: |
          cd $PROJECT_DIR
          # Stamp the deployed commit into the images as SENTRY_RELEASE (build arg →
          # ENV). Without a release Sentry can't do regression detection or tell you
          # which deploy an issue started with. .dockerignore excludes .git, so the
          # build arg is the only way in. --short=12, the same as images.yml, so a
          # pulled and a fallback-built image report the same release.
          GIT_SHA=$(git rev-parse --short=12 HEAD)
          IMAGE_TAG=$(git rev-parse HEAD)
          IMAGE_REGISTRY=ghcr.io/${{ github.repository_owner }}/textstack
          export GIT_SHA IMAGE_TAG IMAGE_REGISTRY
          echo "Deploying release $GIT_SHA"
          # --profile mcp brings up the remote MCP server (mcp-server) in prod.
          # It's profile-gated so CI's bare `compose up` (docker/e2e jobs) never
          # builds/runs it; prod opts in here. nginx /mcp is synced below.
          COMPOSE="docker compose --profile mcp -f docker-compose.yml -f docker-compose.gpu.yml"

          PULLED=false
          if grep -q 'IMAGE_TAG' docker-compose.yml; then
            # The token goes into a throwaway config dir for these pulls only, never
            # into ~/.docker on the server. It expires with this job anyway. Once the
            # packages are public the login is unnecessary but harmless.
            DOCKER_CONFIG=$(mktemp -d) && export DOCKER_CONFIG
            if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
              PULLED=true
              for s in migrator api worker admin ssg-worker mcp-server; do
                d=$(tr ' ' '\n' <<< "$DIGESTS" | sed -n "s/^$s@\(sha256:[0-9a-f]\{64\}\)$/\1/p")
                [ -n "$d" ] || { echo "no digest for $s"; PULLED=false; break; }
                timeout 900 docker pull "$IMAGE_REGISTRY-$s@$d" || { PULLED=false; break; }
                docker tag "$IMAGE_REGISTRY-$s@$d" "$IMAGE_REGISTRY-$s:$IMAGE_TAG"
              done
            fi
            rm -rf "$DOCKER_CONFIG"; unset DOCKER_CONFIG
          fi

          if [ "$PULLED" = true ]; then
            echo "Deploying pulled images $IMAGE_REGISTRY-*:$IMAGE_TAG"
            $COMPOSE up -d --no-build
          else
            echo "::warning::Images for $IMAGE_TAG not pulled — building on the server"
            $COMPOSE up -d --build
          fi

          # A hand-run `docker compose up -d <svc>` on the server (e.g. after editing .env)
          # has no IMAGE_TAG and resolves `textstack-<svc>:latest`. Point that at what is
          # running now, or it would silently start an older image.
          if grep -q 'IMAGE_TAG' docker-compose.yml; then
            for s in migrator api worker admin ssg-worker mcp-server; do
              docker tag "$IMAGE_REGISTRY-$s:$IMAGE_TAG" "textstack-$s:latest"
            done
          fi

      # Keep the local model current. A no-op when the manifest hasn't changed (seconds); the model
      # was otherwise pulled once by hand and never again. Non-fatal: a failed pull keeps the model
      # already on disk, which is what was running anyway.
      - name: Refresh Ollama model
        run: |
          MODEL=$(grep -m1 'Ollama__Model:' $PROJECT_DIR/docker-compose.yml | awk '{print $2}')
          MODEL=${MODEL:-gemma4:e2b}
          timeout 1200 docker exec textstack_ollama ollama pull "$MODEL" \
            && echo "Ollama model $MODEL is current" \
            || echo "::warning::ollama pull $MODEL failed — keeping the model on disk"
          docker exec textstack_ollama ollama --version || true

      - name: Sync nginx config
        run: |
          cd $PROJECT_DIR
          # /etc/nginx/sites-available/textstack is vasyl:vasyl 664, so cp works
          # without sudo. Only nginx -t and reload need sudo (passwordless via
          # sudoers for nginx/systemctl).
          if ! diff -q infra/nginx/textstack.conf /etc/nginx/sites-available/textstack > /dev/null 2>&1; then
            echo "nginx config changed — syncing"
            cp infra/nginx/textstack.conf /etc/nginx/sites-available/textstack
            sudo nginx -t
            sudo systemctl reload nginx
            echo "nginx reloaded"
          else
            echo "nginx config unchanged — skip reload"
          fi

      # Poll instead of a fixed sleep: passes as soon as the API answers, and gives a
      # slow start up to ~2.5 min instead of failing at 30s.
      - name: Health check API
        run: |
          set -o pipefail
          curl -sf --retry 30 --retry-delay 5 --retry-all-errors --retry-connrefused http://localhost:8080/health || exit 1
          echo "API health check passed"
          # `up -d` returns before healthchecks run; a container still `starting` or already
          # `unhealthy` (worker, mcp-server…) would otherwise ship green, so wait up to 90s for
          # every healthcheck to settle. A failing `compose ps` fails the step (set -e on the
          # assignment) instead of reading as "nothing unhealthy". ssg-worker is excluded: its
          # healthcheck also reports "last rebuild failed", which is content state that
          # health-check.yml alarms on — not a reason to call this deploy broken.
          for _ in $(seq 18); do
            STATES=$(cd "$PROJECT_DIR" && docker compose --profile mcp -f docker-compose.yml -f docker-compose.gpu.yml ps --format '{{.Service}} {{.Health}}')
            NOT_HEALTHY=$(printf '%s\n' "$STATES" | awk '($2 == "starting" || $2 == "unhealthy") && $1 != "ssg-worker" {print $1 "=" $2}')
            [ -z "$NOT_HEALTHY" ] && break
            sleep 5
          done
          [ -z "$NOT_HEALTHY" ] || { echo "::error::services not healthy after 90s: $NOT_HEALTHY"; exit 1; }

      # A full rebuild is ~25 min of Puppeteer on the prod box and held the only runner for it.
      # Not needed per deploy: the snapshot step above keeps the old SSG tree AND the assets it
      # references, so crawlers keep complete pages. Nothing rebuilds per edit (ADR-023): a published
      # book reaches crawlers after the nightly Full rebuild (backup.yml), or after `make rebuild-ssg`
      # / the admin button. Tick `rebuild_ssg` on a manual run when a release changes how SEO pages render.
      - name: Queue SSG rebuild
        if: inputs.rebuild_ssg
        run: |
          # Stamp the moment we asked, so the wait below can require a swap that happened
          # *after* it rather than guessing from a file's age.
          echo "SSG_QUEUED_AT=$(date +%s)" >> $GITHUB_ENV
          curl -sf -X POST http://localhost:8080/internal/ssg/rebuild-all && echo "SSG rebuild queued" || echo "SSG rebuild queue failed (non-blocking)"

      - name: Health check frontend
        run: |
          curl -sf http://localhost:80 || exit 1
          echo "Frontend health check passed"

      - name: Health check MCP server
        run: |
          # mcp-server is localhost-only on :8090; nginx fronts /mcp.
          curl -sf http://localhost:8090/health || { echo "FAIL: mcp-server /health down"; exit 1; }
          echo "mcp-server /health OK"
          # MCP endpoint through nginx (Host-routed, like a real client). Since OAuth (ADR-017) every
          # client must sign in, so an anonymous initialize is a 401 carrying the resource-metadata
          # challenge — which is exactly what proves both the nginx route and the auth gate. A 200
          # here would mean the gate is gone; anything else, that routing is broken.
          HDRS=$(curl -s -o /dev/null -D - -X POST -H "Host: textstack.app" \
            -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"deploy-check","version":"1"}}}' \
            http://localhost/mcp)
          echo "$HDRS" | head -1 | grep -q " 401" \
            && echo "$HDRS" | grep -qi '^www-authenticate: Bearer resource_metadata=' \
            && echo "nginx /mcp → 401 + OAuth challenge OK" \
            || { echo "FAIL: /mcp did not answer 401 with the OAuth challenge:"; echo "$HDRS"; exit 1; }
          # Discovery documents must be JSON, not the SPA's index.html.
          for P in /.well-known/oauth-protected-resource/mcp /.well-known/oauth-authorization-server; do
            CT=$(curl -s -o /dev/null -w '%{content_type}' -H "Host: textstack.app" "http://localhost$P")
            case "$CT" in application/json*) echo "$P → JSON OK" ;; *) echo "FAIL: $P served $CT"; exit 1 ;; esac
          done

      - name: Verify SEO setup
        run: |
          echo "=== SPA serves real users ==="
          HEADER=$(curl -sf -o /dev/null -w '%{http_code}' -H "Host: textstack.app" http://localhost/en/)
          [ "$HEADER" = "200" ] && echo "SPA 200 OK" || { echo "SPA failed: $HEADER"; exit 1; }

          SPA_RENDER=$(curl -sf -I -H "Host: textstack.app" http://localhost/en/ | grep -i x-seo-render | tr -d '\r')
          echo "Real user: $SPA_RENDER"
          echo "$SPA_RENDER" | grep -qi "spa" || { echo "FAIL: real user not getting SPA"; exit 1; }

          echo "=== Bot detection active ==="
          BOT_RENDER=$(curl -sf -I -H "Host: textstack.app" -H "User-Agent: Googlebot/2.1" http://localhost/en/ | grep -i x-seo-render | tr -d '\r')
          echo "Bot: $BOT_RENDER"
          # Bot gets SSG if files exist, SPA fallback if not — both are OK post-deploy
          # But header MUST be present (proves nginx config is loaded)
          [ -n "$BOT_RENDER" ] && echo "Bot detection OK" || { echo "FAIL: x-seo-render header missing for bot"; exit 1; }

          echo "=== nginx bot map configured ==="
          grep -q 'map.*is_bot' /etc/nginx/sites-available/textstack || { echo "FAIL: bot map missing from nginx"; exit 1; }
          echo "Bot map found in nginx config"

      - name: Wait for SSG rebuild to complete
        if: inputs.rebuild_ssg
        run: |
          # Queue SSG rebuild step is async. Poll until the job finishes.
          # ssg-worker bind mount: ./apps/web/dist:/app/dist, so files atomic-swapped
          # by worker appear at $PROJECT_DIR/apps/web/dist/ssg on host.
          SSG_DIR=$PROJECT_DIR/apps/web/dist/ssg
          [ -d "$SSG_DIR" ] || { echo "No SSG dir yet — skipping wait"; exit 0; }

          # A full rebuild renders ~2000 routes and has taken ~25 min; the old 10-minute
          # deadline expired on every honest rebuild and then `exit 0`, so "SSG never
          # refreshed" and "SSG refreshed fine" produced the same green deploy. Both halves
          # were wrong: the budget is now 40 min, and running out of it fails the step.
          DEADLINE=$(( $(date +%s) + 2400 ))
          SENTINEL="$SSG_DIR/en/books/dracula/index.html"
          # Not "is the file recent" — that has no honest window. A 15-minute window expired on
          # every real rebuild; widening it to 45 made a tree from the previous rebuild look
          # current and the wait returned in zero seconds. The question is whether a swap
          # happened after we queued, which is a comparison, not a guess.
          SINCE=${SSG_QUEUED_AT:-0}
          until [ -f "$SENTINEL" ] && [ "$(stat -c %Y "$SENTINEL")" -gt "$SINCE" ]; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "FAIL: SSG rebuild did not finish within 40 min — crawlers may be served a stale or partial tree"
              exit 1
            fi
            echo "Waiting for SSG rebuild… ($(date))"
            sleep 30
          done
          echo "SSG rebuild complete"

      - name: Validate SSG content
        run: |
          # Catch skeleton-only SSG files (empty <h1>, only skeleton divs). Silent-save bug
          # from before P0.5 left 247 stale shells on disk for 3 months.
          SSG_DIR=$PROJECT_DIR/apps/web/dist/ssg
          [ -d "$SSG_DIR" ] || { echo "SSG dir missing: $SSG_DIR (skipping — first deploy)"; exit 0; }

          TOTAL=$(find "$SSG_DIR" -name index.html | wc -l)
          [ "$TOTAL" -eq 0 ] && { echo "No SSG files yet (rebuild pending) — skip"; exit 0; }

          # Quality was checked; quantity was not. On 2026-08-31 the tree held 104 author
          # pages, 23 genres and zero books — every surviving file had a valid <h1>, so this
          # step passed while the entire catalogue was 404 to crawlers. Compare against the
          # route list the rebuild was given.
          EXPECTED=$(curl -sf http://localhost:8080/ssg/routes | grep -o '"/[^"]*"' | wc -l)
          if [ "$EXPECTED" -gt 0 ]; then
            FLOOR=$(( EXPECTED * 9 / 10 ))
            if [ "$TOTAL" -lt "$FLOOR" ]; then
              echo "FAIL: SSG holds $TOTAL pages, expected at least $FLOOR of $EXPECTED routes."
              echo "Whole sections are missing — a concurrent rebuild or a wiped dist, not a few bad renders."
              find "$SSG_DIR" -mindepth 2 -maxdepth 2 -type d | sed 's/^/  section: /'
              exit 1
            fi
            echo "SSG coverage: $TOTAL pages against $EXPECTED routes (floor $FLOOR)"
          else
            echo "Could not read route list — skipping coverage check"
          fi

          BAD=0
          SAMPLES=""
          while IFS= read -r f; do
            # Must have a real H1, and must not end with a bare skeleton div
            if ! grep -q '<h1' "$f" || grep -q '__skeleton"></div></div></div>$' "$f"; then
              BAD=$((BAD + 1))
              [ "$BAD" -le 3 ] && SAMPLES="$SAMPLES\n  $f"
            fi
          done < <(find "$SSG_DIR" -name index.html)

          echo "SSG files: $TOTAL, bad: $BAD"
          if [ "$BAD" -gt 0 ]; then
            printf "FAIL: %d SSG files lack <h1> or are skeleton-only. Samples:%b\n" "$BAD" "$SAMPLES"
            exit 1
          fi
          echo "SSG content validation passed"

          echo "All SEO checks passed"

      # NB: asset prune intentionally absent. A naive HTML+CSS reference
      # scan misses React.lazy() dynamic imports (they're string-literals
      # inside the main JS bundle, not <link rel=modulepreload>). The first
      # version of this step in 5e4070a deleted every lazy chunk on prod
      # (Highlights/Reader/Library/Stats/Vocabulary all 404'd until rollback
      # rebuilt). Disk growth from --emptyOutDir=false is ~600 KB/deploy;
      # add a manifest-driven cleanup as a Makefile target before re-adding
      # to the deploy critical path.

      - name: Restart systemd pollers
        # GH Actions runner job doesn't inherit a user DBus session, so plain
        # `systemctl --user` returned an error and fell through to the "not
        # installed" branch — silently skipping the restart for ~weeks. Set
        # XDG_RUNTIME_DIR explicitly so the user-systemd is reachable
        # (linger=yes is already enabled for vasyl, so /run/user/1000 exists
        # independent of login sessions).
        env:
          XDG_RUNTIME_DIR: /run/user/1000
        run: |
          systemctl --user restart seo-publish-poller && echo "SEO Publish poller restarted" || echo "SEO Publish poller restart FAILED"
          systemctl --user restart seo-backfill-poller && echo "SEO Backfill poller restarted" || echo "SEO Backfill poller restart FAILED (run: make seo-backfill-setup if not installed)"
          # Same pattern; it was never restarted, so it kept running the previous deploy's script.
          systemctl --user restart quality-poller && echo "Quality poller restarted" || echo "Quality poller restart FAILED (run: make quality-poll-setup if not installed)"

      - name: Cleanup old images
        run: |
          # Every deploy pulls a new SHA tag, and a tagged image is never "dangling", so
          # prune alone would keep them all. Drop every published tag but this deploy's.
          # In-use images refuse removal, which is the point.
          KEEP=$(git -C "$PROJECT_DIR" rev-parse HEAD)
          docker image ls --format '{{.Repository}}:{{.Tag}}' \
            | grep '^ghcr\.io/${{ github.repository_owner }}/textstack-' | grep -v ":$KEEP\$" \
            | xargs -r docker rmi || true
          docker image prune -f
