name: Publish MCP tool to NuGet

# Publishes the TextStack MCP server as a .NET global tool (TextStack.Mcp) to
# nuget.org via Trusted Publishing (OIDC) — NO long-lived API key/secret stored.
# GitHub Actions presents a signed, single-use OIDC token; nuget.org verifies it
# against a Trusted Publisher Policy and hands back a 1-hour API key just for this
# push.
#
# Manual-only (publishing a version is irreversible — nuget.org never lets you
# overwrite or truly delete a version), or on an `mcp-v*` tag.
#
# ONE-TIME owner setup on nuget.org → username → Trusted Publishing → Create:
#   Repository Owner: mrviduus
#   Repository:       textstack
#   Workflow File:    publish-mcp-nuget.yml   (filename only, no path)
#   Environment:      (leave empty)
# (For a private repo the policy is "temporarily active" for 7 days until the
# first successful publish locks the repo/owner IDs.)
#
# To release a NEW version: bump <Version> in
# backend/src/Ai/TextStack.Ai.Mcp/TextStack.Ai.Mcp.csproj, then run this workflow
# (or push a tag like mcp-v1.0.1). --skip-duplicate makes re-runs a no-op.

on:
  workflow_dispatch:
  push:
    tags:
      - 'mcp-v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    # 35s typical.
    timeout-minutes: 20
    permissions:
      id-token: write   # OIDC token issuance for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pack the .NET tool
        run: |
          dotnet pack backend/src/Ai/TextStack.Ai.Mcp/TextStack.Ai.Mcp.csproj \
            -c Release -o ./artifacts
          ls -lh ./artifacts/*.nupkg

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org username (profile name, NOT email). Public (it's the package
          # owner), so a literal is fine; swap to ${{ secrets.NUGET_USER }} if preferred.
          user: mrviduus

      - name: Push to NuGet
        run: |
          # --skip-duplicate: re-running for an already-published version is a
          # no-op (nuget.org rejects overwrites). Bump <Version> for a new release.
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
