name: Images

# Build once, deploy many. Builds the compose images on a GitHub-hosted runner,
# scans them for secrets, and pushes them to GHCR as
#   ghcr.io/<owner>/textstack-<service>:<full commit sha>
# deploy.yml calls this next to its CI job, and the server pulls those exact tags
# instead of building (it still builds itself if the pull fails).
#
# It replaced ci-cache-warm.yml, which built the same images on main only to warm
# the layer cache and threw them away. Same overlay and cache scopes, so pull
# requests still start warm.
#
# The packages are meant to be PUBLIC (free). That is only safe if nothing secret
# is baked in, so the scan below gates the push: every .env value is a canary, and
# a canary, a private key or a token pattern anywhere in an image fails the job
# before anything leaves the runner.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Empty = the commit that triggered the run.
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build (empty = the selected branch head)
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    # ~12m cold, a few minutes warm, plus the push and scan.
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/textstack
      # Every service with a `build:` in docker-compose.yml. deploy.yml pulls the same list.
      SERVICES: migrator api worker admin ssg-worker mcp-server
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve tag
        id: tag
        run: |
          echo "IMAGE_TAG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # Same value the server stamps on a fallback build — one Sentry release per commit.
          echo "GIT_SHA=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          # A rollback to a commit from before this workflow existed: its compose file has
          # no `image:` entries, so the server builds it, as it always did.
          if grep -q 'IMAGE_TAG' docker-compose.yml; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$(git rev-parse --short HEAD) predates published images — the server will build it"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.tag.outputs.publish == 'true'

      - name: Log in to GHCR
        if: steps.tag.outputs.publish == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # A rollback to a commit that was deployed before is already in the registry.
      - name: Already published?
        id: exists
        if: steps.tag.outputs.publish == 'true'
        run: |
          for s in $SERVICES; do
            if ! docker buildx imagetools inspect "$IMAGE_REGISTRY-$s:$IMAGE_TAG" >/dev/null 2>&1; then
              echo "all=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "All images for $IMAGE_TAG already published"
          echo "all=true" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: steps.exists.outputs.all == 'false'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af

      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
        if: steps.exists.outputs.all == 'false'

      # Every value a canary. Compose interpolates .env into build args, so if anyone
      # ever forwards a real variable into a build (`args: KEY: ${OPENAI_API_KEY}`),
      # the canary lands in the image and the scan fails.
      - name: Create canary .env
        if: steps.exists.outputs.all == 'false'
        run: |
          sed -n 's/^\([A-Z_][A-Z0-9_]*\)=.*/\1=CANARY_SECRET_\1/p' .env.example > .env
          for v in SENTRY_DSN GOOGLE_LEGACY_CLIENT_IDS GUEST_SESSION_PERMIT_LIMIT USER_LOGIN_PERMIT_LIMIT \
                   CLIP_PERMIT_LIMIT ACCOUNT_DELETE_PERMIT_LIMIT GUEST_DAILY_ENRICHMENT_CAP ENABLE_TEST_AUTH; do
            echo "$v=CANARY_SECRET_$v" >> .env
          done
          cat .env

      - name: Build
        if: steps.exists.outputs.all == 'false'
        run: |
          # shellcheck disable=SC2086
          docker compose --profile mcp -f docker-compose.yml -f .github/docker-compose.ci.yml build $SERVICES

      - name: Secret scan (gates the push)
        if: steps.exists.outputs.all == 'false'
        run: |
          # shellcheck disable=SC2046
          scripts/scan-image-secrets.sh $(for s in $SERVICES; do echo "$IMAGE_REGISTRY-$s:$IMAGE_TAG"; done)

      - name: Push
        if: steps.exists.outputs.all == 'false'
        run: |
          for s in $SERVICES; do docker push "$IMAGE_REGISTRY-$s:$IMAGE_TAG"; done
