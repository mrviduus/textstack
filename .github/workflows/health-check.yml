name: Health Check

on:
  schedule:
    # Five minutes is what this asks for, not what it gets. GitHub drops scheduled runs under load
    # and does not queue what it drops: observed 2026-10-29/30, this ran at 06:46, 13:44, 19:13,
    # 23:16, 02:37 and 08:56 — three to six hours apart. The cost was measured on 2026-10-30, when
    # the API was 502 for 44 minutes and the last check before it had run five hours earlier, so the
    # outage was found by a person reading a red CI cross
    # (docs/internal/incidents/2026-10-30-migrator-v2-took-down-the-api.md).
    #
    # The request stays high because a dropped run costs nothing and the check is 6s. Do not read it
    # as coverage: nothing here can see this site go down promptly. The prompt alarm is the Sentry
    # uptime monitor on /api/health/ready (#1054, docs/internal/ops/uptime-monitoring.md).
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Opt JS actions into Node 24 ahead of June 2026 forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Shared retry policy: a deploy restarts the API container, so a scheduled
  # check landing inside the ~25-min deploy window briefly sees connection-refused / 5xx. These
  # flags ride that out (up to 5 * 15s ≈ 75s) instead of false-alarming. --retry-all-errors retries
  # on any HTTP error, --retry-connrefused on a restarting container.
  CURL_RETRY: '--retry 5 --retry-delay 15 --retry-all-errors --retry-connrefused'

# No checkout and no API calls: the job token gets nothing.
permissions: {}

# A slow run (deploy window, hung upstream) must not stack 5-min runs on top of it.
concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    # 6s typical.
    timeout-minutes: 10
    steps:
      # /api/health, not /health: nginx has no /health location, so that URL got the
      # SPA's index.html with a 200 and passed with the API down. The body must be the
      # API's own "healthy" (a JSON string), so a fallback page can't pass either.
      - name: Check textstack.app API
        run: |
          body=$(curl -sf $CURL_RETRY https://textstack.app/api/health)
          [ "$body" = '"healthy"' ] || { echo "unexpected /api/health body: $body"; exit 1; }

      - name: Check textstack.dev API
        run: |
          body=$(curl -sf $CURL_RETRY https://textstack.dev/api/health)
          [ "$body" = '"healthy"' ] || { echo "unexpected /api/health body: $body"; exit 1; }

      - name: Check frontends
        run: |
          curl -sf $CURL_RETRY https://textstack.app/ -o /dev/null
          curl -sf $CURL_RETRY https://textstack.dev/ -o /dev/null

      # Read /health/ready once; the steps below parse the same response.
      # No -f: a 503 carries the body that says WHICH component is down, and a schema behind
      # the build answers 503 by design (ADR-021). curl still retries a 503 under CURL_RETRY,
      # which rides out a deploy. This step fails only on what neither step below can label:
      # no response, a non-JSON body (nginx error page), or db/storage down.
      - name: Readiness probe
        id: ready
        # Runs even if a smoke above failed, so its own alarms still carry their own label.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/ready.json"
          code=$(curl -s $CURL_RETRY -o "$f" -w '%{http_code}' https://textstack.app/api/health/ready) || {
            echo "::error::no response from /api/health/ready"; exit 1; }
          jq -e '.components' "$f" > /dev/null || {
            echo "::error::/api/health/ready returned HTTP $code and no readiness JSON"; head -c 500 "$f"; exit 1; }
          down=$(jq -r '[.components | to_entries[] | select((.key == "db" or .key == "storage") and .value.status != "ok") | .key] | join(", ")' "$f")
          [ -z "$down" ] || { echo "::error::/api/health/ready (HTTP $code): critical component down: $down"; exit 1; }
          echo "readiness HTTP $code"

      # The Api never migrates (ADR-021, ADR-026). A schema behind the running build — a
      # `migrate.sh down`, a migrator that did not run — shows here as components.schema != ok.
      - name: Schema matches the build
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/ready.json"
          schema=$(jq -c '.components.schema // empty' "$f")
          if [ -z "$schema" ]; then
            echo "::warning::readiness probe has no schema component yet — API not redeployed"
            exit 0
          fi
          status=$(printf '%s' "$schema" | jq -r '.status')
          if [ "$status" != "ok" ]; then
            pending=$(printf '%s' "$schema" | jq -r '(.pending // []) | join(", ")')
            echo "::error::Database schema is $status for the running API. Pending migrations: ${pending:-none listed} ($schema). Run the migrator, or roll the code back too (ADR-026)."
            exit 1
          fi
          echo "schema ok"

      # The `db` image can change the OS collation version under a live cluster — a digest bump
      # inside one Postgres major can move the base distribution, and with it glibc. Text then sorts
      # by rules the indexes were not built with: a btree lookup walks past rows that are there and
      # a UNIQUE index stops seeing a duplicate. Postgres says this once, as a WARNING in a log
      # nobody reads, which is how the production cluster sat mismatched for months (#1056).
      - name: Collation matches the OS
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          c=$(jq -c '.components.collation // empty' "$RUNNER_TEMP/ready.json")
          # Missing field means the API predates this check — the normal state between merging it
          # and the deploy finishing.
          if [ -z "$c" ]; then
            echo "::warning::readiness probe has no collation component yet — API not redeployed"
            exit 0
          fi
          status=$(printf '%s' "$c" | jq -r '.status')
          # Anything but ok, as in the schema step above: "unknown" means the query itself failed,
          # and a check that cannot answer must not read as a healthy one.
          if [ "$status" != "ok" ]; then
            where=$(printf '%s' "$c" | jq -r '(.databases // []) | join("; ")')
            echo "::error::Collation $status: ${where:-no detail}. Text indexes may be sorted by rules nothing uses, and a mismatched template1 blocks CREATE DATABASE cluster-wide. Verify with amcheck before refreshing anything (#1056)."
            exit 1
          fi
          echo "collation ok"

      # V2 (ADR-030, #1043): the readiness cache /me/v2 is gated on. Anything but "ok" (behind /
      # unreachable / unconfigured) means /me/v2 answers 503.
      - name: V2 database ready
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          v2=$(jq -c '.components.v2 // empty' "$RUNNER_TEMP/ready.json")
          if [ -z "$v2" ]; then
            echo "::warning::readiness probe has no v2 component yet — API not redeployed"
            exit 0
          fi
          status=$(printf '%s' "$v2" | jq -r '.status')
          [ "$status" = ok ] || { echo "::error::textstack_v2 is $status ($v2): /me/v2 answers 503. On the server: make migrate-status (ADR-030, #1053)."; exit 1; }
          echo "v2 ok"
          # The library volume (#1110): an unwritable one fails every upload. No component = not redeployed.
          library=$(jq -c '.components.library // empty' "$RUNNER_TEMP/ready.json")
          if [ -n "$library" ] && [ "$(printf '%s' "$library" | jq -r '.status')" != ok ]; then
            echo "::error::The V2 library volume is not writable ($library). On the server: make fix-permissions (#1110)."; exit 1
          fi

      # Runs even when a step above failed (!cancelled()).
      #
      # Edge TTS is an unofficial endpoint. On 2026-10-15 it answered 403 for 5+ hours, every
      # /api/tts was a 502, and every check above stayed green (#827, #880). The text is unique
      # per run on purpose: a fixed word is served from the API's disk cache and passes while
      # Edge is down. Cost: a ~32 KB mp3 + a .ts.json per run, ~9 MB a day, ~275 MB over the
      # cache's 30-day TTL (under its 1 GB LRU cap); one request per run, far under the 120/min
      # 'tts' limit. No -f so the log shows the status; Cloudflare replaces a 502 body with
      # "error code: 502", so Edge's reason is in Sentry / `docker compose logs api`, not here.
      # curl still retries 5xx under CURL_RETRY (rides out a deploy); --max-time caps each
      # attempt so a hung Edge call fails instead of holding the run.
      - name: Smoke — TTS synthesizes through Edge
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/tts.mp3"
          meta=$(curl -s $CURL_RETRY --max-time 30 -G -o "$f" -w '%{http_code} %{size_download} %{content_type}' \
            --data-urlencode "text=Health check $(date +%s)" --data-urlencode "lang=en" \
            https://textstack.app/api/tts) || { echo "::error::no response from /api/tts"; exit 1; }
          read -r code size type <<< "$meta"
          if [ "$code" != "200" ] || [ "$type" != "audio/mpeg" ] || [ "$size" -le 1024 ]; then
            echo "::error::TTS is down: HTTP $code, $type, $size bytes. Edge TTS probably changed its token protocol — see docs/internal/ops/uptime-monitoring.md"
            head -c 500 "$f"; exit 1
          fi
          echo "TTS ok: $size bytes"
