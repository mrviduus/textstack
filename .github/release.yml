# The area labels (#1220): each one is a section on the /changelog page, and the format GitHub
# uses if notes are ever generated (`gh release create --generate-notes`). The app has no GitHub
# releases: Android notes go to Play's "What's new" (owner, 2026-11-11).
# Every PR carries one area label from the list below; pr-labels.yml fails a PR
# without one, and reads its allowed labels from this file, so add an area here only.
# A PR with two area labels lands in the first matching section.
changelog:
  exclude:
    labels: [dependencies]
    authors: [dependabot]
  categories:
    - title: Reader
      labels: [reader]
    - title: Mobile
      labels: [mobile]
    - title: Library
      labels: [library]
    - title: Vocabulary
      labels: [vocabulary]
    - title: AI & MCP
      labels: [ai]
    - title: Data
      labels: [data]
    - title: Ops
      labels: [ops]
    - title: Docs
      labels: [documentation]
    # Nothing silently disappears: a PR merged without an area label still shows up.
    - title: Other
      labels: ["*"]
