# Sections of a release's generated notes (#1220). Releases are cut by hand for milestones
# (V2 cutover, Android store builds), not per deploy:
#   gh release create v2.0.0 --generate-notes --notes-start-tag <previous release>
# Every PR carries one area label from the list below; pr-labels.yml fails a PR
# without one, and reads its allowed labels from this file, so add an area here only.
# A PR with two area labels lands in the first matching section.
changelog:
  exclude:
    labels: [dependencies]
    authors: [dependabot]
  categories:
    - title: Reader
      labels: [reader]
    - title: Mobile
      labels: [mobile]
    - title: Library
      labels: [library]
    - title: Vocabulary
      labels: [vocabulary]
    - title: AI & MCP
      labels: [ai]
    - title: Data
      labels: [data]
    - title: Ops
      labels: [ops]
    - title: Docs
      labels: [documentation]
    # Nothing silently disappears: a PR merged without an area label still shows up.
    - title: Other
      labels: ["*"]
