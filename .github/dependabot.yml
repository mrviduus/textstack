# Nothing was watching. Dependabot alerts were disabled on this repository, so a
# JS advisory had no way to reach anyone — the vulnerable dompurify that shipped
# to every visitor was found by running `pnpm audit` by hand, months after the
# patch existed. It was not even a hard fix: the declared range already allowed
# the patched version, and only a stale lockfile held it back.
#
# Alerts are on now, and so are Dependabot **security updates** — the second
# half, which is what actually opens a pull request when an advisory lands.
# Both are repository settings rather than file entries, and
# scripts/check-advisories.mjs asserts them on every pull request, because a
# setting somebody can switch off is not a check.
#
# What this file is for, after that: almost nothing. Version updates on a
# calendar moved to .github/workflows/deps-refresh.yml, which runs twice a year
# and proposes the lockfile, the pnpm catalog and Directory.Packages.props in
# ONE pull request. Splitting the two was the point — a vulnerability must not
# wait for a calendar, and not-falling-behind does not need a weekly one.
# `scripts/report-drift.mjs` prints how far behind we are on every pull request,
# so the quiet lane stays visible between runs.
version: 2
updates:
  # No npm entry, on the evidence of two weeks that said the same thing. Written
  # after the first; confirmed by the second, which produced expo-sqlite@57
  # against an SDK pinning ~55.0.20 — the identical failure, from the identical
  # cause, one week later.
  #
  # Week one: Dependabot opened five JavaScript PRs and all five were wrong —
  # not failing, wrong:
  # react-native 0.87.1 against an SDK that pins 0.83.10, expo-splash-screen
  # from a different SDK entirely, a webview major the SDK does not ship, a
  # screens minor it does not pin, and a bump to expo-speech, a package nothing
  # in the app imports. Four of the five had green type checks and green unit
  # tests, because tsc does not know what an SDK compatibility matrix is.
  #
  # deps-refresh.yml covers the same ground with the gates Dependabot cannot
  # have: the runtime-fingerprint report and a full Metro bundle per proposal.
  # Running both means the one without gates files first.

  # NuGet: security updates only. `open-pull-requests-limit: 0` switches off
  # version updates for an ecosystem while leaving security updates untouched —
  # that is the documented meaning of 0, not "no PRs at all".
  #
  # Version bumps come from deps-refresh.yml instead, for one reason worth
  # naming: this lane produced five open pull requests in a fortnight, all green,
  # all ignored, and their only content was Dapper and four Microsoft.Extensions
  # patches. That is not a risk anybody needed a weekly reminder about, and the
  # noise is what made the queue unreadable when something did matter.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    ignore:
      # Applies to security updates too, which is why it stays. ImageSharp v4 is
      # not a version we can take: the build fails with "No Six Labors license
      # found. Set $(SixLaborsLicenseKey) ... obtain a license from
      # sixlabors.com/pricing". v3 is the last release usable under the split
      # licence on our terms, and this repository is BUSL-1.1 with paid
      # inference behind it — a per-seat image library is a business decision,
      # not a dependency bump.
      - dependency-name: SixLabors.ImageSharp
        update-types: [version-update:semver-major]

  # The workflows in this repo pin action majors (actions/checkout@v5). Those
  # move rarely and silently, and one of them is what installs the Node version
  # everything else now depends on.
  #
  # This is the one lane that CANNOT move to deps-refresh.yml: GITHUB_TOKEN is
  # refused permission to push changes under .github/workflows/**, so a workflow
  # of ours physically cannot raise an action pin. Grouped into a single pull
  # request and left monthly — action majors move rarely enough that monthly is
  # silent most months anyway.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']

  # Base images. Every image compose pulls is pinned by digest (`tag@sha256:…`);
  # the Dockerfile FROM pins land with the slim-images PR (ci/slim-images) — until
  # then this lane bumps their tags. A tag is mutable, a digest is the bytes we
  # reviewed. A pin
  # nobody moves is a base that never gets patched, so these two lanes move them —
  # weekly, one grouped pull request each, and CI + the image secret scan gate it
  # like any other change. Not here: images named inside scripts and workflow
  # `run:` lines (the scanner in scripts/scan-image-secrets.sh, restic in
  # backup.yml, alpine in the Makefile) — Dependabot cannot see those; bump by hand.
  - package-ecosystem: docker
    directories: [/backend/Docker, /apps/admin, /apps/web]
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      base-images:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      compose-images:
        patterns: ['*']
    ignore:
      # pg16 → pg17 is a data-directory upgrade (dump/restore), never a bump.
      - dependency-name: pgvector/pgvector
        update-types: [version-update:semver-major]
