# Textstack Docker Compose
# Usage: docker compose up -d

# Container log rotation for every service. Without it json-file grows forever, so how long
# application logs were kept was undefined (the privacy policy states a bound). Size-based: the
# oldest file is overwritten once 5 x 10 MB fill up.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *default-logging
    # pgvector image = stock postgres:16 + the `vector` extension binary.
    # Existing ./data/postgres-prod volume is compatible (no re-init); the
    # extension is activated by the AddPgVectorAndChunks migration.
    # Pulled images are pinned by digest (tags are mutable); Dependabot's
    # docker-compose lane bumps them. Never take a pgNN major that way — a major
    # needs dump/restore (dependabot.yml ignores it).
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: textstack_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "statement_timeout=10000"
    volumes:
      - ./data/postgres-prod:/var/lib/postgresql/data
    # NOTE: No ports exposed - internal only for security
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  migrator:
    logging: *default-logging
    # Production pulls ghcr.io/<owner>/textstack-<service>:<sha> (deploy.yml sets
    # IMAGE_REGISTRY + IMAGE_TAG; images.yml publishes them). Unset — local dev, CI —
    # it is a plain local name and `build:` below makes it, exactly as before.
    image: ${IMAGE_REGISTRY:-textstack}-migrator:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Docker/Migrator.Dockerfile
    container_name: textstack_migrator_prod
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-textstack}-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Docker/Api.Dockerfile
      args:
        # Becomes SENTRY_RELEASE inside the image — Sentry needs a release to do regression
        # detection and "this broke with deploy X". .dockerignore excludes .git, so the SHA
        # can only get in as a build arg. Empty locally = no release tag, still works.
        GIT_SHA: "${GIT_SHA:-}"
    container_name: textstack_api_prod
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ENABLE_TEST_AUTH: ${ENABLE_TEST_AUTH:-false}
      # Guest-session creates per IP per 5min. Production keeps 3; CI raises it because the
      # guest suites need >=6 guests and every request there comes from one host. A knob, not
      # a bypass: the limiter policy itself is identical in both.
      RateLimits__GuestSessionPermitLimit: ${GUEST_SESSION_PERMIT_LIMIT:-3}
      # Register/login/password-reset attempts per IP per minute. Production keeps 10; CI raises it
      # because the guest-merge suite makes ~15 of them from one host inside a minute and would
      # otherwise throttle itself into skips — a green run with no merge coverage.
      RateLimits__UserLoginPermitLimit: ${USER_LOGIN_PERMIT_LIMIT:-10}
      # Web clips per IP per minute, and account hard-deletes per IP per 5 min. Production keeps
      # 20 and 3; CI raises both because the integration suite seeds user books by clipping and the
      # GDPR delete test legitimately deletes four times.
      RateLimits__ClipPermitLimit: ${CLIP_PERMIT_LIMIT:-20}
      RateLimits__AccountDeletePermitLimit: ${ACCOUNT_DELETE_PERMIT_LIMIT:-3}
      # New vocabulary words a GUEST may push through paid LLM enrichment per UTC day. Production
      # keeps 50 (appsettings). CI lowers it so the cap is reachable in a test: proving that
      # promoting a parked lookup respects it takes `cap` real saves, and 50 is not testable.
      Entitlements__Tiers__Guest__DailyEnrichmentCap: ${GUEST_DAILY_ENRICHMENT_CAP:-50}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Storage__RootPath: /storage
      Jwt__SecretKey: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Google__LegacyClientIds: ${GOOGLE_LEGACY_CLIENT_IDS:-}
      Tts__CachePath: /data/tts-cache
      Explain__CachePath: /data/explain-cache
      Translate__CachePath: /data/translate-cache
      Ollama__BaseUrl: http://ollama:11434
      Ollama__Model: gemma4:e2b
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4.1-nano}
      OpenAI__Explain__Model: ${OPENAI_EXPLAIN_MODEL:-gpt-4.1-mini}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__FromEmail: ${RESEND_FROM_EMAIL:-noreply@textstack.app}
      Resend__AdminAlertEmail: ${ADMIN_ALERT_EMAIL:-}
      # Empty ⇒ no OpenTelemetry export at all (production: nothing receives it). Set it in .env
      # only when something listens — locally, Aspire: `docker compose --profile observability up -d
      # aspire-dashboard` and OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Empty ⇒ Sentry never initializes (local dev, CI, forks are unchanged).
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Oldest Android build (versionCode, e.g. 23) allowed to run; below it the app shows "Please update".
      # Empty or <=0 = no minimum. Advisory: the API never refuses an old build.
      Mobile__MinSupportedBuild: ${MOBILE_MIN_SUPPORTED_BUILD:-}
    volumes:
      - ./data/storage:/storage
      - ./data/textstack:/data/textstack
      - ./data/tts-cache:/data/tts-cache
      - ./data/explain-cache:/data/explain-cache
      - ./data/translate-cache:/data/translate-cache
    ports:
      - "127.0.0.1:8080:8080"  # Only localhost, nginx will proxy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  worker:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-textstack}-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Docker/Worker.Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-}"
    container_name: textstack_worker_prod
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Storage__RootPath: /storage
      # The worker routes bookmeta.agent to OpenAI (Ai:Routes), so it needs the
      # key too — without it OpenAiLlmClient throws on an empty key.
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      # Worker reaches Ollama via the Docker service name, not localhost
      # (without this override it falls back to appsettings.json's
      # "http://localhost:11434" and silently fails every vocab-enrichment
      # call — symptom: words save with NULL distractors/hint/explanation).
      Ollama__BaseUrl: http://ollama:11434
      Ollama__Model: gemma4:e2b
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./data/storage:/storage
    restart: always
    healthcheck:
      # HeartbeatWorker writes /tmp/worker-alive every 30s. 2min grace covers
      # GC pauses and brief ingestion stalls without false-negatives.
      test: ["CMD-SHELL", "find /tmp/worker-alive -mmin -2 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2G  # Worker needs more for book processing
        reservations:
          memory: 512M

  admin:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-textstack}-admin:${IMAGE_TAG:-latest}
    build:
      # Root context — see ssg-worker above.
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: textstack_admin_prod
    environment:
      VITE_API_URL: /api
    ports:
      - "127.0.0.1:81:81"  # Only localhost - not exposed to internet
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:81/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ===========================================
  # MCP server - remote HTTP (streamable) transport (AI-049)
  # ===========================================
  # Multi-user MCP bridge: each connection authenticates with its OWN
  # Authorization: Bearer (the AI-050 device-flow JWT pasted into the client
  # config) — NOT a server-side token cache. Talks to the API over the INTERNAL
  # docker network (no Cloudflare round-trip). nginx fronts /mcp → 127.0.0.1:8090.
  #
  # Behind the `mcp` profile so the default `docker compose up` (used by the CI
  # docker/e2e jobs, which only wait on the API /health) does NOT start it. Bring
  # it up on the server with: docker compose --profile mcp up -d mcp-server
  mcp-server:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-textstack}-mcp-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Docker/Mcp.Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-}"
    container_name: textstack_mcp_prod
    profiles: ["mcp"]
    environment:
      MCP_TRANSPORT: http
      TEXTSTACK_API_URL: http://api:8080
      TEXTSTACK_SITE_HOST: textstack.app
      ASPNETCORE_URLS: http://+:8090
      # Same environment as api/worker, so a local Development .env keeps this one out of Sentry too.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # The same DSN as api/worker — one project, told apart by the `service` tag. Empty ⇒ off.
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "127.0.0.1:8090:8090"  # localhost only - nginx proxies /mcp
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ===========================================
  # SSG Worker - prerenders SEO pages
  # ===========================================

  ssg-worker:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-textstack}-ssg-worker:${IMAGE_TAG:-latest}
    build:
      # Root context: the workspace lockfile and pnpm-workspace.yaml live here,
      # and `catalog:` cannot be resolved without them.
      context: .
      dockerfile: apps/web/Dockerfile.ssg-worker
      args:
        GIT_SHA: "${GIT_SHA:-}"
    container_name: textstack_ssg_worker
    # tini reaps Chromium/chrome_crashpad children left behind by Puppeteer.
    # Without this, each prerender leaves a <defunct> Z process on the host
    # (28 chromium + 28 crashpad zombies observed over a few hours of SSG
    # activity). Doesn't change behaviour, just keeps the process table clean.
    init: true
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      API_URL: http://api:8080
      API_HOST: localhost
      POLL_INTERVAL: "5000"
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      INDEXNOW_ENABLED: ${INDEXNOW_ENABLED:-false}
      # Errors only, scrubbed (apps/web/scripts/ssgSentry.mjs). Same DSN and project as the .NET
      # services, tagged service=ssg-worker; off when empty, and off in Development like them.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    volumes:
      - ./apps/web/dist:/repo/apps/web/dist
    restart: always
    healthcheck:
      # Two questions, because the first one alone gave the wrong answer.
      #
      # ssg-worker.mjs writes /tmp/ssg-worker-alive every 30s — that is
      # liveness, and it is all this used to ask. So a worker that had failed
      # every rebuild for an hour reported "Up (healthy)", which is what
      # `docker compose ps` said while crawlers were being served stale pages.
      # A process that is running and getting nothing done is not healthy.
      #
      # The second file holds the outcome of the last job, written by
      # setJobStatus. Absent means nothing has run yet, which is fine on a
      # fresh container and must not read as failure.
      test: ["CMD-SHELL", "find /tmp/ssg-worker-alive -mmin -2 | grep -q . && { [ ! -f /tmp/ssg-worker-last-job ] || [ \"$$(cat /tmp/ssg-worker-last-job)\" != Failed ]; }"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ===========================================
  # Observability - Aspire Dashboard (all-in-one: traces, logs, metrics)
  # ===========================================

  aspire-dashboard:
    logging: *default-logging
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.0@sha256:064b50d557fcaffd10f06bf79ba4069bd50994a84034f1a0fc35c165500482d7
    container_name: textstack_aspire_prod
    profiles: ["observability"]
    ports:
      - "127.0.0.1:18888:18888"   # Dashboard UI (localhost only)
    environment:
      # Auth mode for all endpoints (Aspire 13.x+)
      - Dashboard__Frontend__AuthMode=Unsecured
      - Dashboard__Otlp__AuthMode=Unsecured
      # Telemetry limits
      - Dashboard__TelemetryLimits__MaxLogCount=100000
      - Dashboard__TelemetryLimits__MaxTraceCount=50000
      - Dashboard__TelemetryLimits__MaxMetricCount=100000
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ===========================================
  # Ollama - Local LLM for vocabulary distractors
  # ===========================================

  ollama:
    logging: *default-logging
    # gemma4 needs Ollama >= 0.30.9 (`ollama show`); 0.23.1 ran it from May to 2026-10. Pinned, not
    # :latest — an image bump is a deliberate change. 0.35.1 is what the local evals ran on.
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    container_name: textstack_ollama
    # GPU access (NVIDIA runtime + device reservation) lives in
    # docker-compose.gpu.yml and is layered on top of this file only by the
    # production deploy (CI runners don't have nvidia-container-toolkit, so
    # `runtime: nvidia` here would break integration tests).
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G

